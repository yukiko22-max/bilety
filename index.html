function subjFiltered(s){
  var f=F(s.id), q=f.q.trim(), ws=words(q), num=/^\d+$/.test(q)?+q:null;
  if(!ws.length) return s.tickets.slice();
  var list=s.tickets.filter(function(t){
    if(num!==null) return String(t.n).indexOf(q)===0 || t.qn.indexOf(q)>=0;
    return ws.every(function(w){return t.qn.indexOf(w)>=0 || t.an.indexOf(w)>=0});
  });
  if(num!==null) list.sort(function(a,b){return (b.n===num)-(a.n===num)||a.n-b.n});
  else list.sort(function(a,b){
    var qa=ws.every(function(w){return a.qn.indexOf(w)>=0}), qb=ws.every(function(w){return b.qn.indexOf(w)>=0});
    return (qb-qa)||a.n-b.n});
  return list;
}
function snippet(t,ws){
  if(!ws.length || ws.every(function(w){return t.qn.indexOf(w)>=0})) return '';
  var idx=-1; ws.forEach(function(w){var i=t.an.indexOf(w); if(i>=0&&(idx<0||i<idx)) idx=i});
  if(idx<0) return '';
  var st=Math.max(0,idx-48), txt=t.at.slice(st,idx+130);
  if(st>0) txt='…'+txt.replace(/^\S*\s/,'');
  return hl(txt,ws);
}
function subjListHTML(s){
  var f=F(s.id), items=subjFiltered(s), ws=words(f.q);
  if(!items.length) return emptyHTML(I.search,'Ничего не найдено','Проверьте номер билета или попробуйте другое слово.');
  if(S.view==='grid' && !f.q.trim()) return '<div class="grid">'+items.map(function(t){return tileHTML(s,t)}).join('')+'</div>';
  var head=f.q.trim()?'<p class="found">'+(items.length===1?'Найден ':'Найдено ')+tickW(items.length)+'</p>':'';
  return head+'<div class="group">'+items.map(function(t){
    return rowHTML(s,t,{q:hl(t.q,ws),sub:snippet(t,ws)})}).join('')+'</div>';
}
function subjectScreen(r,back){

/* ---------- Router ---------- */
var stage=$('#stage'), stack=[], curEl=null, scrollMem={}, trT=null;
function top(){return stack[stack.length-1]}
function keyOf(r){return r.name==='subject'?'s-'+r.sid:r.name==='ticket'?'t-'+r.sid+'-'+r.n:r.name}
function parseKey(k){
  var m;
  if((m=k.match(/^s-([a-z0-9]+)$/)) && byId[m[1]]) return {name:'subject',sid:m[1]};
  if((m=k.match(/^t-([a-z0-9]+)-(\d+)$/)) && byId[m[1]] && byId[m[1]].map[+m[2]]) return {name:'ticket',sid:m[1],n:+m[2]};
  return {name:'home'};
}
function labelOf(r){
  if(!r) return '';
  return r.name==='home'?'Предметы':r.name==='subject'?(byId[r.sid].short||byId[r.sid].title):'Билет '+r.n;
}
function build(r){
  var back=stack.length>1?labelOf(stack[stack.length-2]):null;
  switch(r.name){
    case 'subject': return subjectScreen(r,back);
    case 'ticket': return ticketScreen(r,back);
    default: return homeScreen();
  }
}
var reduced=false; try{reduced=matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){}
function syncScrolled(el){var sc=el.querySelector('.scroller'), nb=el.querySelector('.navbar'); nb.classList.toggle('scrolled',sc.scrollTop>40)}
function show(mode){
  var r=top();
  if(r.name==='ticket'){ S.last={sid:r.sid,n:r.n}; save() }
  if(curEl){ scrollMem[curEl.dataset.key]=curEl.querySelector('.scroller').scrollTop }
  if(trT){clearTimeout(trT); trT=null}
  Array.prototype.slice.call(stage.children).forEach(function(c){ if(c!==curEl) c.remove(); else c.className=c.className.replace(/\s?(enter|leave)-\w+|\s?run/g,'') });
  var old=curEl, el=build(r);
  el.dataset.key=keyOf(r);
  if(mode==='pop') el.classList.add('quiet');
  stage.appendChild(el); curEl=el;
  if(mode==='pop' && scrollMem[el.dataset.key]){ el.querySelector('.scroller').scrollTop=scrollMem[el.dataset.key]; syncScrolled(el) }
  try{ history.replaceState(null,'','#'+keyOf(r)) }catch(e){ try{location.replace('#'+keyOf(r))}catch(e2){} }
  if(!old) return;
  if(mode==='none'||reduced){ old.remove(); return }
  el.classList.add('enter-'+mode); old.classList.add('leave-'+mode);
  void el.offsetWidth;
  el.classList.add('run'); old.classList.add('run');
  trT=setTimeout(function(){ old.remove(); el.classList.remove('enter-'+mode,'run'); trT=null }, 520);
}
function refresh(){
  if(!curEl) return;
  var sc=curEl.querySelector('.scroller').scrollTop, el=build(top());
  el.dataset.key=curEl.dataset.key; el.classList.add('quiet');
  stage.replaceChild(el,curEl); curEl=el;
  el.querySelector('.scroller').scrollTop=sc; syncScrolled(el);
}
function push(r){ stack.push(r); show('push') }
function back(){ if(stack.length>1){ stack.pop(); show('pop') } }
function replaceTop(r,mode){ stack[stack.length-1]=r; show(mode) }

/* ---------- Sheets ---------- */
var sheets=$('#sheets'), sheetTok=0;
function openSheet(title,html){
  sheetTok++;
  sheets.innerHTML='<div class="backdrop" data-act="sheet-close"></div><div class="sheet glass" role="dialog" aria-modal="true" aria-label="'+esc(title)+'">'+
    '<div class="grabber"></div><div class="sh-head"><span></span><h3>'+esc(title)+'</h3><button class="sh-x" data-act="sheet-close" aria-label="Закрыть">'+I.x+'</button></div>'+html+'</div>';
  sheets.classList.add('open'); sheets.setAttribute('aria-hidden','false');
  void sheets.offsetWidth; sheets.classList.add('show'); bindSheetDrag();
}
function closeSheet(){
  if(!sheets.classList.contains('open')) return;
  var my=++sheetTok; sheets.classList.remove('show'); sheets.setAttribute('aria-hidden','true');
  setTimeout(function(){ if(my===sheetTok){ sheets.classList.remove('open'); sheets.innerHTML='' } }, reduced?0:420);
}
function sheetOpen(){return sheets.classList.contains('show')}
function bindSheetDrag(){
  var sh=$('.sheet',sheets), y0=null, dy=0;
  sh.addEventListener('touchstart',function(e){ if(sh.scrollTop>0) return; y0=e.touches[0].clientY; dy=0 },{passive:true});
  sh.addEventListener('touchmove',function(e){ if(y0===null) return; dy=Math.max(0,e.touches[0].clientY-y0); if(dy>4){sh.classList.add('dragging'); sh.style.transform='translateY('+dy+'px)'} },{passive:true});
  sh.addEventListener('touchend',function(){ if(y0===null) return; sh.classList.remove('dragging'); sh.style.transform=''; if(dy>90) closeSheet(); y0=null },{passive:true});
}
function dotsHTML(){return FONTS.map(function(_,i){return '<i class="'+(i<=S.font?'on':'')+'"></i>'}).join('')}
function settingsSheet(){
  openSheet('Оформление','<div class="group"><div class="srow col"><span class="lbl">Тема</span>'+segHTML('tseg',['Авто','Светлая','Тёмная'],['auto','light','dark'].indexOf(S.theme),'mini')+'</div>'+
    '<div class="srow"><span class="lbl">Размер текста ответа</span><div class="stepper">'+
    '<button class="sm" data-act="font" data-v="-1" aria-label="Уменьшить текст">A</button><span class="dots">'+dotsHTML()+'</span>'+
    '<button class="lg" data-act="font" data-v="1" aria-label="Увеличить текст">A</button></div></div></div>');
}
function jumpSheet(){
  var r=top(), s=byId[r.sid];
  openSheet(s.short||s.title,'<div class="grid" style="padding:2px 2px 6px">'+s.tickets.map(function(t){return tileHTML(s,t,r.n,'goto')}).join('')+'</div>');
}

/* ---------- Import Word files on the device ---------- */
var WNS='http://schemas.openxmlformats.org/wordprocessingml/2006/main';
function wDesc(el,name){return Array.prototype.slice.call(el.getElementsByTagNameNS(WNS,name))}
function wKids(el,name){return Array.prototype.filter.call(el.childNodes,function(c){return c.namespaceURI===WNS&&c.localName===name})}
function wText(p){
  var s='';
  wDesc(p,'r').forEach(function(r){ Array.prototype.forEach.call(r.childNodes,function(ch){
    if(ch.namespaceURI!==WNS) return;
    if(ch.localName==='t') s+=ch.textContent; else if(ch.localName==='br'||ch.localName==='cr') s+='\n'; else if(ch.localName==='tab') s+=' ';
  }) });
  return s;
}
function wLines(el){
  var out=[];
  wDesc(el,'p').forEach(function(p){ wText(p).split('\n').forEach(function(l){ l=l.replace(/\s+/g,' ').trim(); if(l) out.push(l) }) });
  return out;
}
function wBold(p){ return wDesc(p,'b').some(function(b){ var v=b.getAttributeNS(WNS,'val'); return v!=='0'&&v!=='false' }) }
var QRE=/^\s*(\d{1,3})\s*[.)]\s*([\s\S]+)$/;
function parseDocx(buf){
  var files;
  try{ files=fflate.unzipSync(new Uint8Array(buf),{filter:function(f){return f.name==='word/document.xml'}}) }catch(e){ throw new Error('zip') }
  var xml=files['word/document.xml']; if(!xml) throw new Error('zip');
  var doc=new DOMParser().parseFromString(fflate.strFromU8(xml),'application/xml');
  var tickets=[], cur=null;
  /* 1) tables: "N. question" rows followed by answer rows, or two columns question | answer */
  wDesc(doc,'tbl').forEach(function(tbl){ wKids(tbl,'tr').forEach(function(tr){
    var cells=wKids(tr,'tc'); if(!cells.length) return;
    if(cells.length>=2){
      var q=wLines(cells[0]).join(' '), a=[]; cells.slice(1).forEach(function(c){ a=a.concat(wLines(c)) });
      var m=q.match(QRE);
      if(m){ cur={n:+m[1],q:m[2].trim(),a:a}; tickets.push(cur) }
      else if(cur&&(q||a.length)){ cur.a=cur.a.concat(q?[q]:[],a) }
      return;
    }
    var ls=wLines(cells[0]); if(!ls.length) return;
    var m1=ls[0].match(QRE);
    if(m1 && ls.length<=2 && ls[0].length<400){ cur={n:+m1[1],q:[m1[2]].concat(ls.slice(1)).join(' ').trim(),a:[]}; tickets.push(cur) }
    else if(cur){ cur.a=cur.a.concat(ls) }
  }) });
  /* 2) no tables: numbered paragraphs in order 1, 2, 3 … start the questions */
  if(!tickets.length){
    var body=doc.getElementsByTagNameNS(WNS,'body')[0]; cur=null;
    if(body) wDesc(body,'p').forEach(function(p){
      var txt=wText(p).replace(/\s+/g,' ').trim(); if(!txt) return;
      var m=txt.match(QRE), next=cur?cur.n+1:null;
      if(m && (next===null||+m[1]===next) && (wBold(p)||txt.length<300) && !(cur&&!cur.a.length&&+m[1]!==next)){
        cur={n:+m[1],q:m[2].trim(),a:[]}; tickets.push(cur);
      } else if(cur){ cur.a.push(txt) }
    });
  }
  var seen={}; tickets=tickets.filter(function(t){ if(seen[t.n]) return false; seen[t.n]=1; return true });
  return tickets;
}
var pending=null;
function cleanName(n){ return n.replace(/\.(docx|dotx)$/i,'').replace(/[_]+/g,' ').replace(/\s+/g,' ').trim() }
function importError(title,text){
  openSheet('Не получилось добавить','<div class="confirm"><div class="empty" style="padding:8px 8px 16px"><div class="ei">'+I.doc+'</div><b>'+title+'</b><p>'+text+'</p></div>'+
    '<button class="btn plain" data-act="import-again">Выбрать другой файл</button></div>');
}
$('#fileIn').addEventListener('change',function(){
  var f=this.files&&this.files[0]; if(!f) return;
  if(/\.doc$/i.test(f.name)){ importError('Старый формат .doc','Откройте файл в Word или Pages и сохраните как .docx, затем загрузите снова.'); return }
  var rd=new FileReader();
  rd.onload=function(){
    var tickets;
    try{ tickets=parseDocx(rd.result) }catch(e){ importError('Файл не читается','Нужен документ Word в формате .docx.'); return }
    if(!tickets.length){ importError('Не нашла билеты','В файле должны быть вопросы с номерами «1.», «2.»… Лучше всего — таблица, как в ваших файлах с билетами.'); return }
    var empty=tickets.filter(function(t){return !t.a.length}).length;
    pending={tickets:tickets};
    var name=cleanName(f.name);
    if(/^[\s_.\-]*$/.test(name)) name='';
    openSheet('Новый предмет',
      '<div class="imp-sum"><div class="imp-n">'+tickets.length+'</div><div><b>'+plural(tickets.length,['билет найден','билета найдено','билетов найдено'])+'</b>'+
      '<span>№ '+tickets[0].n+'–'+tickets[tickets.length-1].n+(empty?' · без ответа: '+empty:'')+'</span></div></div>'+
      '<label class="lbl-up" for="impName">Название предмета</label>'+
      '<label class="field sheet-field"><input id="impName" type="text" autocomplete="off" placeholder="Например, История Беларуси" value="'+esc(name)+'"></label>'+
      '<div class="group imp-prev">'+tickets.slice(0,3).map(function(t){return '<div class="srow"><span class="num">'+t.n+'</span><span class="row-q">'+esc(t.q)+'</span></div>'}).join('')+'</div>'+
      '<button class="btn primary" data-act="import-add">Добавить предмет</button><button class="btn plain" data-act="sheet-close">Отмена</button>');
  };
  rd.onerror=function(){ importError('Файл не открылся','Попробуйте выбрать его ещё раз.') };
  rd.readAsArrayBuffer(f);
});
function importCommit(){
  if(!pending) return;
  var inp=$('#impName',sheets), title=(inp.value||'').trim();
  if(!title){ inp.focus(); inp.parentNode.classList.add('err'); return }
  var s=prep({id:'u'+Date.now().toString(36),title:title,short:'',icon:'book',user:true,tickets:pending.tickets});
  SUBJECTS.push(s);
  try{ saveUserSubjects() }catch(e){
    SUBJECTS.pop(); delete byId[s.id];
    importError('Не хватает места','Память браузера на телефоне заполнена. Удалите ненужный загруженный предмет и попробуйте снова.'); return;
  }
  pending=null; closeSheet(); haptic();
  stack=[{name:'home'},{name:'subject',sid:s.id}]; show('push');
}
function subjMenu(){
  var s=byId[top().sid];
  openSheet('Предмет','<label class="lbl-up" for="ren">Название</label><label class="field sheet-field"><input id="ren" type="text" autocomplete="off" value="'+esc(s.title)+'"></label>'+
    '<button class="btn primary" data-act="subj-rename">Сохранить название</button>'+
    '<div class="group" style="margin-top:16px"><button class="srow danger" data-act="subj-del">Удалить предмет</button></div>');
}

/* ---------- Actions ---------- */
function step(d){
  var r=top(); if(r.name!=='ticket') return;
  var s=byId[r.sid], i=s.tickets.indexOf(s.map[r.n]), t=s.tickets[i+d];
  if(!t){ haptic(); return }
  replaceTop({name:'ticket',sid:s.id,n:t.n}, d>0?'next':'prev');
}
var A={
  back:back,
  subject:function(b){push({name:'subject',sid:b.dataset.sid})},
  open:function(b){ closeSheet(); push({name:'ticket',sid:b.dataset.sid,n:+b.dataset.n}) },
  goto:function(b){ var r=top(), n=+b.dataset.n; closeSheet(); if(n!==r.n) replaceTop({name:'ticket',sid:r.sid,n:n}, n>r.n?'next':'prev') },
  step:function(b){ haptic(); step(+b.dataset.d) },
  jump:jumpSheet,
  settings:settingsSheet,
  font:function(b){ S.font=Math.max(0,Math.min(FONTS.length-1,S.font+(+b.dataset.v))); save(); applyFont(); $('.dots',sheets).innerHTML=dotsHTML() },
  view:function(){ S.view=S.view==='grid'?'list':'grid'; save(); refresh() },
  'sheet-close':closeSheet,
  upload:function(){ var fi=$('#fileIn'); fi.value=''; fi.click() },
  'import-add':function(){ importCommit() },
  'import-again':function(){ closeSheet(); setTimeout(function(){ A.upload() },50) },
  'subj-menu':subjMenu,
  'subj-rename':function(){
    var s=byId[top().sid], v=($('#ren',sheets).value||'').trim(); if(!v){ $('#ren',sheets).focus(); return }
    s.title=v; try{ saveUserSubjects() }catch(e){} closeSheet(); refresh();
  },
  'subj-del':function(){
    var s=byId[top().sid];
    openSheet('Удалить предмет?','<div class="confirm"><p>«'+esc(s.title)+'» и все '+tickW(s.tickets.length)+' будут удалены с этого телефона. Файл Word останется у вас.</p>'+
      '<button class="btn destr" data-act="subj-del-yes">Удалить</button><button class="btn plain" data-act="sheet-close">Отмена</button></div>');
  },
  'subj-del-yes':function(){
    var sid=top().sid; SUBJECTS=SUBJECTS.filter(function(s){return s.id!==sid}); delete byId[sid];
    if(S.last&&S.last.sid===sid){ S.last=null; save() }
    try{ saveUserSubjects() }catch(e){}
    closeSheet(); stack=[{name:'home'}]; show('pop');
  },
  theme:function(){ haptic(); setTheme(isDark()?'light':'dark') },
  seg:function(b){ var seg=b.parentNode, i=+b.dataset.i; markSeg(seg,i); if(b.dataset.seg==='tseg') setTheme(['auto','light','dark'][i]) },
  clear:function(b){ var inp=$('#'+b.dataset.for,curEl); inp.value=''; onInput(inp); inp.focus() }
};
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]'); if(!b||b.disabled) return;
  var f=A[b.dataset.act]; if(f){ e.preventDefault(); f(b) }
});
function onInput(inp){
  var v=inp.value, clr=inp.parentNode.querySelector('.clear'); if(clr) clr.hidden=!v;
  if(inp.id==='sq'){ var s=byId[top().sid]; F(s.id).q=v; $('#tlist',curEl).innerHTML=subjListHTML(s) }
}
document.addEventListener('input',function(e){ if(e.target.id==='sq') onInput(e.target) });
document.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT'){ if(e.key==='Enter'){ if(e.target.id==='impName') importCommit(); else if(e.target.id==='ren') A['subj-rename'](); else e.target.blur() } return }
  if(e.key==='Escape'){ if(sheetOpen()) closeSheet(); else back() }
  if(top().name==='ticket' && !sheetOpen()){ if(e.key==='ArrowRight') step(1); if(e.key==='ArrowLeft') step(-1) }
});

/* Gestures: edge swipe = back; horizontal swipe on a ticket = next/previous */
var tx=null;
stage.addEventListener('touchstart',function(e){ if(e.touches.length!==1){tx=null;return} var t=e.touches[0]; tx={x:t.clientX,y:t.clientY,edge:t.clientX<26,tm:Date.now()} },{passive:true});
stage.addEventListener('touchend',function(e){
  if(!tx) return; var t=e.changedTouches[0], dx=t.clientX-tx.x, dy=t.clientY-tx.y, quick=Date.now()-tx.tm<650;
  if(Math.abs(dx)>64 && Math.abs(dx)>Math.abs(dy)*1.8 && quick && !sheetOpen()){
    if(tx.edge && dx>0 && stack.length>1) back();
    else if(top().name==='ticket'){ haptic(); step(dx<0?1:-1) }
  }
  tx=null;
},{passive:true});

/* ---------- Boot ---------- */
if('serviceWorker' in navigator && location.protocol==='https:' && !/claude|anthropic/i.test(location.hostname)){
  try{ navigator.serviceWorker.register('sw.js').catch(function(){}) }catch(e){}
}
(function boot(){
  var h=(location.hash||'').replace('#',''), r=parseKey(h);
  if(r.name==='ticket') stack=[{name:'home'},{name:'subject',sid:r.sid},r];
  else if(r.name==='subject') stack=[{name:'home'},r];
  else stack=[r];
  show('none');
})();
})();
</script>
