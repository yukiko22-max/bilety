."]}, {"n": 56, "q": "Энергоменеджмент. Энергетический аудит. Функции энергоменеджера и энергоаудитора.", "a": ["Энергоменеджмент — система управления энергопотреблением на предприятии для постоянного снижения затрат энергии (по стандарту ISO 50001 / СТБ ISO 50001).", "Энергетический аудит (энергообследование) — обследование предприятия или здания, чтобы оценить, сколько и как используется энергия, найти потери и предложить меры по экономии. Бывает обязательный (для крупных потребителей ТЭР, периодически) и добровольный; итог — энергетический паспорт и программа энергосбережения.", "Функции энергоменеджера (работник предприятия): учёт и анализ потребления ТЭР; разработка и выполнение планов энергосбережения; контроль норм расхода; внедрение энергоэффективных мероприятий; обучение и мотивация персонала; отчётность в органы по энергоэффективности.", "Функции энергоаудитора (внешний специалист): проводит обследование, замеры, анализирует данные, рассчитывает потенциал экономии, составляет отчёт и рекомендации.", "Контроль за энергосбережением в Беларуси — Департамент по энергоэффективности Госстандарта."]}, {"n": 57, "q": "Нормативно-правовая база в области энергосбережения.", "a": ["Основные акты Республики Беларусь:", "— Конституция РБ (обязанность беречь природу и рационально использовать ресурсы);", "— Закон РБ «Об энергосбережении» (2015 г.) — основной закон: понятия, принципы, госуправление, нормирование расхода ТЭР, энергетические обследования, экономическое стимулирование, ответственность;", "— Закон РБ «О возобновляемых источниках энергии» (2010 г.);", "— Закон РБ «Об электроэнергетике» (2022 г.);", "— Директива Президента № 3 «Экономия и бережливость — главные факторы экономической безопасности государства» (2007 г.);", "— Концепция энергетической безопасности РБ;", "— Государственная программа «Энергосбережение» на 2021–2025 гг. (сейчас — на 2026–2030 гг.);", "— технические нормативные акты (СТБ, ТКП) по энергоэффективности оборудования и зданий, маркировка энергоэффективности.", "Государственное регулирование осуществляет Госстандарт (Департамент по энергоэффективности) и его областные управления по надзору за рациональным использованием ТЭР."]}, {"n": 58, "q": "Экологические проблемы разработки и добычи полезных ископаемых", "a": ["Добыча полезных ископаемых сильно влияет на все компоненты природы:", "— земли — нарушение и изъятие земель под карьеры, шахты, отвалы, хранилища; уничтожение почвенного покрова;", "— недра и вода — понижение уровня подземных вод (депрессионные воронки), осушение колодцев, загрязнение вод рассолами и нефтью;", "— атмосфера — пыль, выбросы газов, сжигание попутного газа;", "— ландшафт — изменение рельефа, провалы и оседание поверхности над шахтами;", "— растительность и животные — гибель и сокращение мест обитания.", "В Беларуси главная проблема — Солигорский горнопромышленный район: солеотвалы (терриконы) и шламохранилища «Беларуськалия» занимают тысячи гектаров, засоляют почвы и подземные воды, оседает поверхность земли, подтопление. Другие проблемы: загрязнение нефтью и рассолами в районе нефтедобычи (Речица, Светлогорск); карьеры строительных материалов; выработанные торфяники (пожары, деградация)."]}, {"n": 59, "q": "Охрана недр.", "a": ["Охрана недр — система мер, чтобы сохранить недра, использовать их полностью и рационально и не допустить вредного влияния на окружающую среду.", "Основа — Кодекс РБ о недрах (2008 г.). Недра — исключительная собственность государства, предоставляются только во временное пользование по разрешению.", "Основные требования: полное и комплексное извлечение полезных ископаемых и попутных компонентов; учёт запасов (государственный баланс и кадастр); предотвращение загрязнения недр и подземных вод; не допускать самовольной добычи и застройки площадей залегания; безопасное захоронение отходов; рекультивация земель после добычи (засыпка карьеров, создание водоёмов, посадка леса); мониторинг (геологический, подземных вод); геологическая и экологическая экспертиза проектов.", "Контроль осуществляют Минприроды и Госпромнадзор; за нарушения — административная и уголовная ответственность."]}, {"n": 60, "q": "Социально-экономический ущерб от травматизма и профессиональных заболеваний.", "a": ["Производственная травма — повреждение здоровья работника при несчастном случае на производстве. Профессиональное заболевание — болезнь, вызванная воздействием вредных производственных факторов.", "Социальный ущерб: гибель людей, инвалидность, потеря трудоспособности, страдания семьи, снижение качества жизни, уменьшение числа работоспособных людей, психологические последствия.", "Экономический ущерб: для работодателя — потери рабочего времени, простои, порча оборудования, расходы на расследование, выплаты, штрафы, найм и обучение новых работников; для государства — выплаты пособий по временной нетрудоспособности, пенсий по инвалидности, страховых выплат (Белгосстрах — обязательное страхование от несчастных случаев на производстве и профзаболеваний), затраты на лечение и реабилитацию, недополучение продукции.", "В Беларуси ежегодно на производстве гибнут около 100–130 человек; больше всего — в сельском хозяйстве, строительстве, промышленности; главные причины — нарушения требований охраны труда и алкогольное опьянение."]}, {"n": 61, "q": "«Охрана труда». Определение, цель, задачи, содержание.", "a": ["Охрана труда — система обеспечения безопасности жизни и здоровья работников в процессе трудовой деятельности, включающая правовые, социально-экономические, организационные, технические, психофизиологические, санитарно-гигиенические, лечебно-профилактические, реабилитационные и иные мероприятия и средства (Закон РБ «Об охране труда», 2008 г.).", "Цель — сохранение жизни, здоровья и работоспособности работников, сведение к минимуму травматизма и профзаболеваний.", "Задачи: создание безопасных и здоровых условий труда; выявление и устранение вредных и опасных факторов; обучение работников безопасным методам работы; обеспечение средствами защиты; расследование и учёт несчастных случаев; социальная защита пострадавших.", "Содержание (разделы): законодательство об охране труда; производственная санитария и гигиена труда; техника безопасности (производственная безопасность); пожарная безопасность; электробезопасность; организация работы по охране труда на предприятии."]}, {"n": 62, "q": "Управление государственной системой охраны труда в Республике Беларусь.", "a": ["Государственное управление охраной труда осуществляют:", "— Совет Министров РБ — определяет государственную политику, утверждает программы;", "— Министерство труда и социальной защиты — главный орган, проводит единую политику, разрабатывает нормативные акты, координирует работу;", "— другие республиканские органы (министерства) — в своих отраслях;", "— местные исполнительные и распорядительные органы (исполкомы) — на своей территории;", "— наниматели (руководители организаций) — непосредственно на предприятии: создают службу охраны труда, обеспечивают безопасные условия, обучение, СИЗ, проводят аттестацию рабочих мест.", "Участвуют также профсоюзы (через общественных инспекторов и коллективные договоры).", "Основные документы: Конституция, Трудовой кодекс, Закон «Об охране труда», Республиканская программа и Государственная программа по охране труда, Межотраслевые правила, инструкции."]}, {"n": 63, "q": "Контроль и надзор за состоянием охраны труда в Республике Беларусь.", "a": ["Государственный надзор и контроль:", "— Департамент государственной инспекции труда Минтруда и соцзащиты — главный орган надзора за соблюдением законодательства об охране труда;", "— Госпромнадзор (МЧС) — за безопасным ведением работ в промышленности (котлы, краны, газ, лифты);", "— Госэнергонадзор (Минэнерго) — за электроустановками;", "— органы МЧС — за пожарной безопасностью;", "— санэпидслужба Минздрава — за санитарно-гигиеническими условиями;", "— Генеральная прокуратура — высший надзор за соблюдением законов.", "Ведомственный контроль — министерства и концерны над своими предприятиями.", "Общественный контроль — профсоюзы (технические инспекторы труда, общественные инспекторы).", "Производственный контроль на предприятии — трёхступенчатый (I ступень — мастер ежедневно, II — начальник цеха еженедельно, III — комиссия руководства ежемесячно), а также служба охраны труда."]}, {"n": 64, "q": "Виды инструктажей по охране труда и порядок их проведения.", "a": ["Инструктажи проводятся по Инструкции о порядке обучения, стажировки, инструктажа и проверки знаний работников по вопросам охраны труда (Минтруда РБ). Виды:", "— вводный — при приёме на работу, проводит специалист по охране труда, знакомит с общими правилами на предприятии;", "— первичный на рабочем месте — до начала самостоятельной работы, проводит непосредственный руководитель (мастер), по инструкциям для конкретной профессии, с показом безопасных приёмов;", "— повторный — не реже 1 раза в 6 месяцев (на работах с повышенной опасностью — раз в 3 мес.), по программе первичного;", "— внеплановый — при изменении правил, оборудования, технологии, после нарушений и несчастных случаев, после перерыва в работе (более 6 месяцев, для опасных работ — более 30 дней);", "— целевой — перед разовыми работами, не входящими в обязанности, ликвидацией аварий, работами по наряду-допуску.", "Все инструктажи (кроме целевого — по наряду) регистрируются в журнале с подписями инструктирующего и инструктируемого. Знания проверяются устным опросом."]}, {"n": 65, "q": "Производственная санитария и гигиена труда. Определение. Задачи.", "a": ["Производственная санитария — система организационных, гигиенических и санитарно-технических мероприятий и средств, которые предотвращают или уменьшают воздействие на работников вредных производственных факторов.", "Гигиена труда — раздел профилактической медицины, который изучает влияние трудового процесса и производственной среды на организм работника и разрабатывает гигиенические нормативы и меры защиты.", "Задачи: изучение и оценка условий труда; разработка нормативов (ПДК вредных веществ, допустимые уровни шума, вибрации, излучений, параметры микроклимата и освещения); создание нормальных условий (вентиляция, отопление, освещение, кондиционирование); обеспечение санитарно-бытовыми помещениями (гардеробы, душевые, комнаты отдыха); медосмотры работников; профилактика профзаболеваний; лечебно-профилактическое питание, молоко на вредных работах.", "Контроль — санэпидслужба Минздрава РБ, аттестация рабочих мест по условиям труда."]}, {"n": 66, "q": "Метеорологические условия труда (микроклимат).", "a": ["Микроклимат производственных помещений — климат внутренней среды помещения, который определяется сочетанием температуры, относительной влажности, скорости движения воздуха и интенсивности теплового (инфракрасного) излучения.", "Нормируется санитарными нормами Минздрава РБ с учётом периода года (холодный и тёплый) и категории работ по тяжести (лёгкие Iа, Iб; средней тяжести IIа, IIб; тяжёлые III). Есть оптимальные и допустимые нормы. Например, для лёгкой работы в холодный период оптимально 22–24 °C, влажность 40–60%, скорость воздуха до 0,1 м/с.", "Влияние: перегрев — тепловой удар, судороги, обезвоживание; переохлаждение — простуда, обморожения, радикулит; повышенная влажность усиливает действие жары и холода, низкая — пересыхание слизистых.", "Меры по нормализации: вентиляция и кондиционирование, отопление, теплоизоляция и экранирование горячих источников, воздушные души и завесы, механизация тяжёлых работ, спецодежда, режим труда и отдыха (перерывы, комнаты для обогрева), питьевой режим (подсоленная вода в горячих цехах)."]}, {"n": 67, "q": "Понятие об опасных и вредных производственных факторах, их классификация, влияние на организм человека.", "a": ["Вредный производственный фактор — фактор, воздействие которого на работника может привести к заболеванию или снижению работоспособности (шум, пыль, плохое освещение).", "Опасный производственный фактор — фактор, воздействие которого может привести к травме или резкому ухудшению здоровья, вплоть до смерти (движущиеся части машин, электрический ток, падение с высоты, взрыв).", "Один и тот же фактор в зависимости от уровня и времени может быть вредным или опасным.", "Классификация (по природе действия):", "— физические — движущиеся машины и механизмы, повышенная или пониженная температура, шум, вибрация, излучения, недостаток освещения, электрический ток, высота;", "— химические — токсичные, раздражающие, канцерогенные вещества (газы, пары, пыль);", "— биологические — микроорганизмы (бактерии, вирусы, грибы), животные и растения;", "— психофизиологические — физические перегрузки (тяжесть труда) и нервно-психические перегрузки (умственное перенапряжение, монотонность, эмоциональный стресс).", "Влияние: острые отравления и травмы, профзаболевания (тугоухость, вибрационная болезнь, пневмокониозы, аллергия), хроническая усталость, снижение иммунитета."]}, {"n": 68, "q": "Физиологические аспекты обеспечения безопасности труда. Анализаторы человека. Основы эргономики.", "a": ["Безопасность труда во многом зависит от возможностей организма человека: как он воспринимает информацию, как быстро реагирует, сколько может работать без ошибок.", "Анализатор — система, которая воспринимает раздражитель, передаёт сигнал в мозг и анализирует его. Состоит из 3 частей: рецептор (воспринимает) → нервные проводящие пути → центр в коре головного мозга.", "Основные анализаторы: зрительный (около 80–90% информации), слуховой, тактильный (осязание), обонятельный, вкусовой, температурный, болевой, двигательный (кинестетический), вестибулярный (равновесие). Важны пороги чувствительности и время реакции (около 0,15–0,3 с).", "Эргономика — наука о том, как приспособить технику, рабочее место и условия труда к возможностям человека, чтобы работа была эффективной, безопасной и удобной.", "Основы эргономики: удобная рабочая поза и высота стола и сиденья; рабочая зона в пределах досягаемости рук; понятные приборы, сигналы и органы управления (цвет, форма, размер); правильное освещение; учёт антропометрических и психологических особенностей человека."]}, {"n": 69, "q": "Работоспособность и утомление. Стадии (фазы) работоспособности.", "a": ["Работоспособность — способность человека выполнять определённую работу в течение заданного времени с нужной эффективностью и качеством.", "Утомление — временное снижение работоспособности после длительной или напряжённой работы. Проявляется в снижении внимания, замедлении реакции, увеличении ошибок, что повышает риск травм. Если не отдыхать, развивается переутомление (хроническое).", "Фазы работоспособности в течение рабочего дня:", "— врабатывание (мобилизация) — 30 мин – 1,5 ч, работоспособность постепенно растёт;", "— устойчивая (высокая) работоспособность — 2–3 ч, лучшие показатели;", "— снижение работоспособности (утомление) — растёт количество ошибок.", "После обеденного перерыва фазы повторяются, но вторая фаза короче, а утомление наступает быстрее. В конце дня бывает кратковременный подъём («конечный порыв»).", "В течение недели: понедельник — врабатывание, вторник–четверг — максимум, пятница — снижение."]}, {"n": 70, "q": "Задачи производственной безопасности.", "a": ["Производственная безопасность (техника безопасности) — система организационных мероприятий и технических средств, которые предотвращают или уменьшают воздействие на работников опасных производственных факторов.", "Задачи:", "— выявление и анализ опасных производственных факторов на рабочих местах;", "— создание безопасного оборудования и технологий (безопасность заложена ещё при проектировании);", "— применение средств защиты: ограждений, блокировок, сигнализации, предохранительных устройств, знаков безопасности;", "— безопасная организация работ (наряды-допуски, инструкции, обучение и инструктажи);", "— обеспечение работников средствами индивидуальной защиты;", "— контроль соблюдения правил и требований безопасности;", "— расследование и анализ несчастных случаев, устранение их причин;", "— снижение производственного травматизма до минимума."]}, {"n": 71, "q": "Основные причины несчастных случаев на производстве.", "a": ["Несчастный случай на производстве — событие, при котором работник получил травму или другое повреждение здоровья при выполнении работы.", "Причины:", "— организационные — недостатки в организации работ, отсутствие или плохое проведение обучения и инструктажей, допуск неподготовленных людей, нарушение режима труда и отдыха, отсутствие контроля, нарушение трудовой дисциплины;", "— технические — неисправность оборудования, инструментов, отсутствие ограждений и блокировок, конструктивные недостатки машин, несовершенство технологии;", "— санитарно-гигиенические — плохое освещение, шум, вибрация, загазованность, неблагоприятный микроклимат, отсутствие СИЗ;", "— психофизиологические (личные) — усталость, невнимательность, спешка, недостаток опыта, болезнь, стресс, нахождение в состоянии алкогольного опьянения.", "По статистике Беларуси, большинство несчастных случаев связано с человеческим фактором: нарушения требований безопасности самим работником и руководителями, а значительная часть погибших была в состоянии алкогольного опьянения."]}, {"n": 72, "q": "Принципы, методы и средства обеспечения безопасности.", "a": ["Принципы — основные идеи обеспечения безопасности. По назначению делятся на ориентирующие (системный подход, ликвидация опасности, замена оператора, классификация), технические (защита расстоянием, экранирование, блокировка, слабое звено, герметизация, прочность), организационные (защита временем, нормирование, подбор кадров, последовательность) и управленческие (контроль, ответственность, обратная связь, стимулирование).", "Методы — способы достижения безопасности. Выделяют гомосферу (зона, где находится человек) и ноксосферу (зона, где есть опасность):", "— метод А — пространственное или временное разделение гомосферы и ноксосферы (автоматизация, дистанционное управление, ограждение опасных зон);", "— метод Б — нормализация ноксосферы, т.е. устранение опасности (вентиляция, снижение шума, заземление);", "— метод В — адаптация человека к среде (обучение, профотбор, СИЗ, тренировки).", "Средства — конкретные устройства и мероприятия: средства коллективной защиты (вентиляция, ограждения, освещение, звукоизоляция) и индивидуальной защиты (каски, очки, респираторы, спецодежда)."]}, {"n": 73, "q": "Технические принципы и средства обеспечения безопасности.", "a": ["Технические принципы:", "— защита расстоянием — человек находится на безопасном расстоянии от опасности (дистанционное управление, санитарно-защитные зоны);", "— экранирование — между человеком и опасностью ставят экран (от излучения, шума, тепла);", "— блокировка — устройство не даёт включить машину или открыть опасную зону при нарушении безопасности;", "— герметизация — изоляция опасных веществ в закрытых системах;", "— слабое звено — элемент, который разрушается первым и защищает систему (предохранители, предохранительные клапаны, разрывные мембраны);", "— прочность — запас прочности конструкций (тросы, сосуды под давлением);", "— вакуумирование, флегматизация (снижение взрывоопасности инертными газами).", "Технические средства: ограждения, предохранительные устройства, блокировочные устройства, сигнализация (световая, звуковая, цветовая), знаки безопасности и сигнальные цвета (красный — запрет, жёлтый — предупреждение, зелёный — безопасно, синий — предписание), дистанционное управление, заземление и зануление, вентиляция, тормозные устройства."]}, {"n": 74, "q": "Средства коллективной и индивидуальной защиты на производстве.", "a": ["Средства коллективной защиты (СКЗ) — защищают сразу всех работающих в зоне. Виды: нормализация воздушной среды (вентиляция, кондиционирование, отопление); нормализация освещения (освещение, светофильтры); защита от шума и вибрации (звукоизоляция, глушители, виброизоляция); защита от излучений (экраны); защита от поражения током (заземление, зануление, УЗО, изоляция); ограждения, блокировки, сигнализация, знаки безопасности; защита от падения с высоты (перила, сетки).", "Средства индивидуальной защиты (СИЗ) — используются отдельным работником, когда СКЗ не обеспечивают полную безопасность. Виды: спецодежда и спецобувь; средства защиты головы (каски); глаз и лица (очки, щитки); органов дыхания (респираторы, противогазы); органов слуха (беруши, наушники); рук (перчатки, рукавицы); от падения с высоты (страховочные пояса); дерматологические средства (кремы, пасты).", "Наниматель обязан бесплатно выдавать СИЗ по нормам, а работник — правильно ими пользоваться. Сначала применяют СКЗ, а СИЗ — как дополнение."]}, {"n": 75, "q": "Роль человеческого фактора в обеспечении безопасности труда. Организация рабочего времени с учетом фаз работоспособности.", "a": ["Человеческий фактор — влияние особенностей человека (знаний, опыта, состояния здоровья, внимания, мотивации, характера) на безопасность работы. По статистике, до 70–80% несчастных случаев происходят из-за ошибок людей.", "Типичные причины ошибок: недостаточная подготовка и опыт; усталость и переутомление; невнимательность и спешка; монотонная работа; стресс; употребление алкоголя; пренебрежение правилами («авось пронесёт»); плохая организация рабочего места.", "Как уменьшить роль человеческого фактора: профотбор и медосмотры; обучение, инструктажи, тренировки; автоматизация опасных операций; эргономичные рабочие места; мотивация и культура безопасности; контроль за состоянием работников (предсменные медосмотры, алкотестеры).", "Организация рабочего времени с учётом фаз работоспособности: самую сложную и ответственную работу ставить на период устойчивой работоспособности (2–3 ч после начала смены); регламентированные перерывы (5–10 мин каждые 1–2 ч) и обеденный перерыв в середине смены до наступления утомления; чередование видов работ; производственная гимнастика; продолжительность рабочего времени — не более 40 ч в неделю (сокращённое — при вредных условиях); полноценный отдых и выходные."]}, {"n": 76, "q": "Требования безопасности при работе на компьютере.", "a": ["Вредные факторы при работе за ПК: нагрузка на зрение, статическая поза, монотонность, нервно-эмоциональное напряжение, электромагнитные поля, сухой воздух и статическое электричество.", "Требования к помещению: площадь на одно рабочее место — не менее 6 м² (для мониторов ЖК), естественное и искусственное освещение (300–500 лк на рабочем столе), окна с жалюзи, проветривание и влажная уборка, нормальный микроклимат.", "Требования к рабочему месту: экран на расстоянии 50–70 см от глаз, верх экрана на уровне глаз или чуть ниже; монитор боком к окну (не напротив и не спиной к окну); регулируемое кресло со спинкой и подлокотниками; клавиатура на 10–30 см от края стола; подставка для ног; заземление техники.", "Режим труда: регламентированные перерывы (через каждые 1–2 ч по 10–15 мин), гимнастика для глаз и тела; непрерывная работа за ПК — не более 2 ч; беременным и подросткам — ограничения.", "Электробезопасность: исправные провода и розетки, не трогать включённые блоки внутри, не ставить жидкости рядом."]}, {"n": 77, "q": "Сущность понятия «электробезопасность». Способы и средства для обеспечения электробезопасности.", "a": ["Электробезопасность — система организационных и технических мероприятий и средств, которые защищают людей от вредного и опасного воздействия электрического тока, электрической дуги, электромагнитного поля и статического электричества.", "Технические способы и средства: изоляция токоведущих частей (рабочая, двойная, усиленная); недоступность токоведущих частей (ограждения, кожухи, размещение на высоте); защитное заземление; зануление; защитное отключение (УЗО — устройство защитного отключения); малое напряжение (до 42 В, в особо опасных помещениях — 12 В); разделительные трансформаторы; блокировки; знаки и плакаты безопасности («Стой! Напряжение», «Не включать! Работают люди»).", "Электрозащитные средства: основные (держат рабочее напряжение — диэлектрические перчатки, изолирующие штанги, указатели напряжения, инструмент с изолированными ручками) и дополнительные (диэлектрические боты, галоши, коврики, подставки).", "Организационные меры: допуск к работе только обученного персонала с группой по электробезопасности; наряды-допуски; отключение напряжения, вывешивание плакатов, проверка отсутствия напряжения, наложение заземления; периодическая проверка изоляции и средств защиты. Основа — Правила по охране труда при работе в электроустановках."]}, {"n": 78, "q": "Действие электрического тока на организм человека. Виды поражения электрическим током. Электротравма и электроудар.", "a": ["Действие тока на организм:", "— термическое — нагрев и ожоги тканей, сосудов, нервов;", "— электролитическое — разложение крови и других жидкостей, нарушение их состава;", "— механическое — судорожные сокращения мышц, разрывы тканей, переломы;", "— биологическое — раздражение и возбуждение нервов и мышц, нарушение работы сердца и дыхания.", "Виды поражения: местные электротравмы и общие (электрический удар).", "Электротравмы (местные повреждения): электрические ожоги (токовые и дуговые), электрические знаки (метки тока — серые или жёлтые пятна на коже), металлизация кожи (частички металла в коже), электроофтальмия (воспаление глаз от дуги), механические повреждения.", "Электрический удар — возбуждение живых тканей током с судорожным сокращением мышц. Степени: I — судороги без потери сознания; II — судороги с потерей сознания, дыхание и сердце работают; III — потеря сознания и нарушение дыхания или работы сердца; IV — клиническая смерть (остановка дыхания и сердца). Ток 0,6–1,5 мА — ощутимый, 10–15 мА — неотпускающий, 50–100 мА — смертельный (фибрилляция сердца)."]}, {"n": 79, "q": "Факторы, влияющие на исход поражения электрическим током.", "a": ["Исход поражения зависит от:", "— силы тока — главный фактор (чем больше ток, тем опаснее; смертельный — около 0,1 А);", "— напряжения и сопротивления тела человека (в среднем принимают 1000 Ом; сопротивление сильно падает при влажной, повреждённой коже, в состоянии опьянения);", "— длительности воздействия — чем дольше, тем опаснее;", "— пути тока через тело — самые опасные петли «рука–рука», «левая рука–ноги», «голова–ноги», когда ток проходит через сердце и мозг;", "— рода и частоты тока — переменный ток частотой 50 Гц опаснее постоянного примерно в 4–5 раз (при напряжении до 500 В);", "— индивидуальных особенностей — состояние здоровья, усталость, алкоголь, болезни сердца, возраст;", "— условий внешней среды — влажность, температура, токопроводящая пыль, металлические и сырые полы. По опасности помещения делятся на: без повышенной опасности, с повышенной опасностью, особо опасные (и территории открытых электроустановок)."]}, {"n": 80, "q": "Статическое электричество. Способы защиты от статического электричества.", "a": ["Статическое электричество — возникновение и накопление электрических зарядов на поверхности материалов при трении, разделении, течении жидкостей, распылении (электризация).", "Где возникает: при трении синтетической одежды, ковров, при работе с пластмассами, бумагой, тканями на производстве, при перекачке бензина и других горючих жидкостей, пересыпании порошков, работе ремённых передач, на мониторах.", "Опасность: искровой разряд может вызвать пожар или взрыв горючих паров, газов, пыли; неприятные уколы током, испуг, что может привести к травме; влияние на нервную систему; порча электроники.", "Способы защиты: заземление оборудования, трубопроводов, ёмкостей; увеличение влажности воздуха (до 65–70%); антистатические вещества и покрытия; ионизаторы (нейтрализаторы) воздуха; снижение скорости перекачки жидкостей; антистатическая обувь, одежда, браслеты, полы; использование натуральных материалов; в быту — увлажнители воздуха, антистатик для одежды."]}, {"n": 81, "q": "Пожарная безопасность при эксплуатации бытовых электроприборов.", "a": ["Неисправность электрооборудования и нарушение правил его эксплуатации — одна из главных причин пожаров в жилых домах Беларуси (после неосторожного обращения с огнём и курения).", "Причины пожаров от электроприборов: короткое замыкание; перегрузка сети (много мощных приборов в одной розетке, удлинители, «тройники»); плохой контакт в розетках и проводах (нагрев); самодельные «жучки» вместо предохранителей; ветхая проводка; оставленные без присмотра включённые приборы (обогреватели, утюги, плиты); сушка вещей на обогревателях; самодельные приборы.", "Правила: пользоваться только исправными и сертифицированными приборами; не перегружать сеть; не оставлять включённые приборы без присмотра и выключать их из розетки; не ставить обогреватели рядом с мебелью, шторами; не накрывать телевизор, компьютер; не использовать повреждённые провода и розетки; не применять «жучки»; ставить автоматические выключатели и УЗО; вовремя менять старую проводку; установить автономный пожарный извещатель (в Беларуси обязателен в жилье многодетных и социально уязвимых семей).", "При возгорании прибора — обесточить, тушить сухим порошковым или углекислотным огнетушителем, плотной тканью; водой включённую технику тушить нельзя. Вызвать спасателей — 101 или 112."]}, {"n": 82, "q": "Пожарная безопасность объекта.", "a": ["Пожарная безопасность объекта — состояние объекта, при котором исключается возможность пожара, а при его возникновении предотвращается воздействие опасных факторов пожара на людей и обеспечивается защита имущества.", "Обеспечивается двумя системами:", "— система предотвращения пожара — исключение горючей среды и источников зажигания (контроль за электрооборудованием, запрет курения и открытого огня в опасных местах, безопасное хранение горючих веществ);", "— система противопожарной защиты — огнестойкие конструкции, противопожарные преграды и двери, эвакуационные пути и выходы, пожарная сигнализация и автоматическое пожаротушение, системы оповещения и дымоудаления, первичные средства пожаротушения.", "Организационные меры: назначение ответственных за пожарную безопасность; инструкции о мерах пожарной безопасности; противопожарные инструктажи и обучение (пожарно-технический минимум); планы эвакуации на видных местах; учебные тренировки по эвакуации; добровольные пожарные дружины.", "Основа — Закон РБ «О пожарной безопасности», Правила пожарной безопасности РБ. Надзор осуществляют органы МЧС."]}, {"n": 83, "q": "Методы и средства пожаротушения. Правила пользования огнетушителем.", "a": ["Для горения нужны 3 условия: горючее вещество, окислитель (кислород) и источник зажигания. Тушение основано на устранении хотя бы одного из них.", "Методы тушения: охлаждение (вода); изоляция от кислорода (пена, песок, покрывало, кошма); разбавление горючих веществ или воздуха негорючими веществами (углекислый газ, пар, азот); химическое торможение реакции горения (порошки, хладоны).", "Средства пожаротушения: вода, пена, порошки, углекислый газ; первичные средства — огнетушители, пожарные краны, ящики с песком, ведра, лопаты, покрывала; пожарная техника, автоматические установки пожаротушения.", "Виды огнетушителей: порошковые (ОП) — универсальные, можно тушить электроустановки до 1000 В; углекислотные (ОУ) — электрооборудование, ценные вещи, нельзя держать за раструб (обморожение); воздушно-пенные (ОВП) — нельзя тушить электроустановки под напряжением; водные.", "Правила пользования: 1) сорвать пломбу и выдернуть чеку; 2) направить шланг или раструб на очаг; 3) нажать на рычаг; 4) тушить с наветренной стороны, с расстояния 2–5 м, с края очага к центру, сверху вниз при горении вертикальных поверхностей; 5) после тушения убедиться, что огонь не возобновился. Огнетушители проверяют и перезаряжают по сроку."]}, {"n": 84, "q": "Понятие чрезвычайной ситуации (ЧС). Классификация ЧС.", "a": ["Чрезвычайная ситуация — обстановка на определённой территории, сложившаяся в результате промышленной аварии, иной аварии, катастрофы, опасного природного явления, стихийного или иного бедствия, которые могут повлечь или повлекли за собой человеческие жертвы, вред здоровью людей или окружающей среде, значительный материальный ущерб и нарушение условий жизнедеятельности людей (Закон РБ «О защите населения и территорий от чрезвычайных ситуаций природного и техногенного характера», 1998 г.).", "Классификация:", "— по происхождению: природные, техногенные, экологические, биолого-социальные (а также социальные — войны, теракты);", "— по масштабу (в РБ): локальные (в пределах объекта), местные (в пределах района или города), региональные (в пределах области), республиканские (за пределами области), трансграничные (выходят за пределы страны или пришли из-за рубежа);", "— по скорости развития: внезапные (взрыв, землетрясение), быстро развивающиеся (пожар), умеренные (паводок), плавно развивающиеся (засуха, эпидемии)."]}, {"n": 85, "q": "Природные чрезвычайные ситуации. Техногенные чрезвычайные ситуации.", "a": ["Природные ЧС — связаны с опасными природными явлениями. Виды: геологические (землетрясения, оползни, карст), метеорологические (ураганы, смерчи, сильные ливни, град, снегопады, гололёд, сильные морозы, жара, засуха), гидрологические (наводнения, паводки, половодья), природные пожары (лесные, торфяные), биологические (эпидемии, эпизоотии, эпифитотии). Для Беларуси наиболее характерны ураганы и шквалы, сильные дожди и снегопады, паводки (Полесье, Припять), лесные и торфяные пожары, засухи, гололёд.", "Техногенные ЧС — связаны с деятельностью человека и техникой. Виды: транспортные аварии (автомобильные, железнодорожные, авиационные, на трубопроводах); пожары и взрывы на объектах и в жилье; аварии с выбросом аварийно химически опасных веществ (АХОВ — хлор, аммиак); радиационные аварии; гидродинамические аварии (прорыв дамб); аварии на системах жизнеобеспечения (электро-, тепло-, водоснабжение); обрушение зданий. В Беларуси наиболее частые — пожары в жилом секторе, ДТП, аварии на коммунальных сетях; потенциально опасные объекты — химические предприятия (Гродно Азот, Новополоцк), нефтепроводы, БелАЭС."]}, {"n": 86, "q": "Экологические и биолого-социальные чрезвычайные ситуации.", "a": ["Экологические ЧС — связаны с изменением состояния природной среды (суши, атмосферы, гидросферы, биосферы):", "— изменение состояния суши — деградация почв, опустынивание, эрозия, загрязнение земель тяжёлыми металлами и радионуклидами, провалы при добыче полезных ископаемых;", "— изменение состава атмосферы — резкое загрязнение воздуха (смог), кислотные дожди, разрушение озонового слоя, изменение климата;", "— изменение гидросферы — нехватка питьевой воды, загрязнение водоёмов, истощение подземных вод;", "— изменение биосферы — исчезновение видов, гибель лесов, массовая гибель животных.", "Для Беларуси главная экологическая ЧС — радиоактивное загрязнение после аварии на ЧАЭС; также — последствия осушения Полесья, Солигорские солеотвалы.", "Биолого-социальные ЧС — массовые инфекционные заболевания людей, животных и растений: эпидемии и пандемии (COVID-19, грипп), эпизоотии (африканская чума свиней, бешенство, птичий грипп), эпифитотии (фитофтороз картофеля, ржавчина зерновых, нашествие вредителей — колорадский жук, саранча). Также к социальным относят голод, терроризм, массовые беспорядки."]}, {"n": 87, "q": "ЧС, характерные и наиболее вероятные для Республики Беларусь.", "a": ["Природные: сильные ветры, ураганы и шквалы (ежегодно повреждают леса, кровли, ЛЭП); сильные ливни, град, грозы; сильные снегопады, метели, гололёд; сильные морозы и аномальная жара; весенние паводки и половодья (Полесье — Припять, Днепр, Сож, Неман); засухи; лесные и торфяные пожары (особенно в Гомельской и Брестской обл.).", "Техногенные: пожары в жилом секторе (самые частые ЧС, главная причина гибели людей — неосторожное обращение с огнём и курение, часто в нетрезвом виде); ДТП; аварии на транспорте с опасными грузами; аварии на химически опасных объектах (аммиак на холодильных установках молокозаводов и мясокомбинатов, хлор на водоочистных сооружениях; «Гродно Азот», «Нафтан», «Мозырский НПЗ»); аварии на газопроводах и нефтепроводах; аварии на системах жизнеобеспечения; взрывы бытового газа; потенциально — радиационные аварии (БелАЭС, соседние АЭС: Чернобыльская, Ровенская, Смоленская, Игналинская закрыта).", "Биолого-социальные: эпидемии гриппа и ОРВИ, COVID-19; эпизоотии — африканская чума свиней, бешенство, птичий грипп; эпифитотии.", "Экологические: радиоактивное загрязнение после ЧАЭС."]}, {"n": 88, "q": "Эпизоотии и эпифитотии в Беларуси. Эпидемии. Борьба с эпидемиями в мире и в Республике Беларусь.", "a": ["Эпидемия — массовое распространение инфекционного заболевания людей, значительно превышающее обычный уровень. Пандемия — эпидемия, охватившая несколько стран и континентов (COVID-19 — 2020–2023).", "Эпизоотия — массовое распространение инфекционной болезни животных. В Беларуси: африканская чума свиней (АЧС — у диких кабанов, вспышки с 2013 г.), бешенство (лисы, енотовидные собаки, кошки, собаки), птичий грипп, ящур, лептоспироз.", "Эпифитотия — массовое распространение болезней или вредителей растений. В Беларуси: фитофтороз картофеля, ржавчина и мучнистая роса зерновых, колорадский жук, короеды-типографы в ельниках.", "Борьба с эпидемиями в мире — ВОЗ: вакцинация, контроль за распространением инфекций, международные медико-санитарные правила (в мире ликвидирована натуральная оспа).", "В Беларуси: Национальный календарь профилактических прививок (бесплатно); санитарно-эпидемиологическая служба Минздрава; карантин, изоляция больных, дезинфекция; санитарно-карантинные пункты на границе; противоэпидемические мероприятия (масочный режим, дистанционное обучение во время COVID-19); ветеринарная служба Минсельхозпрода — вакцинация животных, отстрел кабанов, карантинные зоны."]}, {"n": 89, "q": "Аварии на транспорте. Причины аварий.", "a": ["Транспортные аварии — аварии на автомобильном, железнодорожном, авиационном, водном и трубопроводном транспорте, которые приводят к гибели людей, травмам, повреждению транспорта, загрязнению среды (при перевозке опасных грузов).", "Автомобильный транспорт — самые массовые аварии. В Беларуси ежегодно происходит несколько тысяч ДТП с пострадавшими, гибнет около 400–500 человек (в последние годы число гибнущих снижается).", "Железнодорожный — сход с рельсов, столкновения, наезды на людей и автомобили на переездах, аварии цистерн с опасными грузами.", "Авиационный — крушения при взлёте и посадке, наиболее смертельные.", "Трубопроводный — разрывы нефте- и газопроводов, утечки, пожары, загрязнение земли и воды (через Беларусь проходят «Дружба», «Ямал–Европа»).", "Причины: человеческий фактор — нарушение правил движения (превышение скорости, выезд на встречную полосу), вождение в нетрезвом виде, усталость и невнимательность водителей, ошибки пешеходов; технические неисправности транспорта; плохое состояние дорог и путей; неблагоприятные погодные условия (гололёд, туман, снег); нарушение правил перевозки опасных грузов; теракты."]}, {"n": 90, "q": "Современные средства массового поражения.", "a": ["Оружие массового поражения (ОМП) — оружие, которое за короткое время может уничтожить большое количество людей, техники и разрушить сооружения.", "Ядерное оружие — действие основано на энергии ядерного взрыва (деление урана-235, плутония-239 или синтез лёгких ядер — термоядерное). Поражающие факторы: ударная волна (около 50% энергии), световое излучение (30–35%), проникающая радиация (5%), радиоактивное заражение местности (10%), электромагнитный импульс.", "Химическое оружие — отравляющие вещества (ОВ): нервно-паралитические (зарин, зоман, V-газы), кожно-нарывные (иприт), общеядовитые (синильная кислота), удушающие (фосген), психохимические (BZ), раздражающие (слезоточивые). Запрещено Конвенцией 1993 г.", "Биологическое (бактериологическое) оружие — возбудители опасных болезней (чума, сибирская язва, оспа, холера, туляремия) и токсины. Запрещено Конвенцией 1972 г.", "Также существуют современные обычные средства поражения высокой точности (крылатые ракеты, кассетные и объёмно-детонирующие боеприпасы, беспилотники) и оружие на новых физических принципах (лазерное, радиочастотное, инфразвуковое).", "Защита: убежища и укрытия, СИЗ (противогазы, респираторы, защитная одежда), эвакуация, медицинская защита (аптечки, вакцинация)."]}, {"n": 91, "q": "Прогнозирование и предупреждение чрезвычайных ситуаций природного и техногенного характера.", "a": ["Прогнозирование ЧС — заблаговременная оценка вероятности возникновения ЧС, её масштаба и последствий на основе анализа причин и мониторинга.", "Мониторинг и прогнозирование в Беларуси: Белгидромет (опасные метеорологические явления — штормовые предупреждения), НСМОС, радиационный мониторинг, сейсмические станции, наблюдения за паводками, контроль состояния потенциально опасных объектов; Республиканский центр управления и реагирования на ЧС МЧС. Население получает предупреждения через СМИ, сайт МЧС, SMS-рассылки.", "Предупреждение ЧС — комплекс мероприятий, проводимых заранее, чтобы максимально уменьшить риск ЧС, сохранить жизнь и здоровье людей и снизить ущерб.", "Основные меры: соблюдение норм безопасности при строительстве и эксплуатации объектов; декларирование безопасности опасных производственных объектов; страхование; лицензирование опасных видов деятельности; создание систем оповещения, резервов материальных и финансовых ресурсов; строительство защитных сооружений (дамбы, убежища); подготовка населения и спасателей, учения; противопожарные мероприятия в лесах; профилактические проверки МЧС."]}, {"n": 92, "q": "Первая помощь пострадавшим в ЧС природного и техногенного характера.", "a": ["Первая помощь — комплекс простых срочных мер для спасения жизни и предупреждения осложнений, которые выполняются на месте до прибытия медиков (вызов — 103 или 112).", "Общий порядок: убедиться в собственной безопасности; устранить действие поражающего фактора (вынести из огня, воды, из-под завалов, из зоны заражения); оценить состояние (сознание, дыхание, пульс); вызвать скорую помощь; оказать помощь по жизненно важным показаниям; следить за пострадавшим до приезда медиков.", "Основные приёмы:", "— при остановке дыхания и сердца — сердечно-лёгочная реанимация (30 надавливаний на грудину и 2 вдоха);", "— при кровотечении — давящая повязка, пальцевое прижатие, жгут (с запиской о времени, летом до 1 ч, зимой до 30 мин);", "— при переломах — обездвиживание шинами или подручными средствами;", "— при ожогах — охладить водой 15–20 мин, закрыть стерильной повязкой, не вскрывать пузыри;", "— при синдроме длительного сдавливания — наложить жгут выше места сдавления до освобождения конечности, обезболить, обильное питьё;", "— при отравлении АХОВ — вывести на свежий воздух, промыть глаза и кожу водой;", "— при шоке — тепло, покой, питьё (если нет травмы живота), успокоить."]}, {"n": 93, "q": "Первая помощь пострадавшим в бытовых условиях.", "a": ["Типичные бытовые травмы и состояния: порезы и кровотечения, ушибы, вывихи, переломы, ожоги, отравления (лекарствами, грибами, бытовой химией, угарным газом), поражение током, обмороки, инородные тела в дыхательных путях, укусы животных и насекомых.", "Первая помощь:", "— порезы, ссадины — промыть, обработать края раны антисептиком, наложить повязку; сильное кровотечение — давящая повязка, жгут;", "— носовое кровотечение — наклонить голову вперёд, прижать крылья носа, холод на переносицу;", "— термический ожог — охладить проточной водой, закрыть чистой тканью; химический — долго промывать водой;", "— ушибы и вывихи — холод, покой, фиксация, к врачу (вывих самим не вправлять);", "— отравление — вызвать скорую, промыть желудок (кроме кислот, щелочей, бензина), дать активированный уголь; угарный газ — на свежий воздух;", "— поражение током — отключить ток или отбросить провод сухой палкой, проверить дыхание и пульс, при необходимости — реанимация;", "— обморок — уложить, приподнять ноги, свежий воздух;", "— подавился — приём Геймлиха (толчки в верхнюю часть живота);", "— укусы животных — промыть рану с мылом, обратиться к врачу (профилактика бешенства); клещ — аккуратно удалить, сдать на анализ.", "Во всех серьёзных случаях — вызвать скорую по номеру 103 или 112."]}, {"n": 94, "q": "Оповещение граждан о чрезвычайных ситуациях. Технические средства оповещения. Сигналы оповещения.", "a": ["Оповещение — доведение до органов управления и населения сигналов и информации об угрозе или возникновении ЧС и о порядке действий. Организуют органы МЧС и местные исполкомы.", "Технические средства: электросирены (сеть централизованного оповещения); проводное радиовещание (радиоточки), радио и телевидение (перерыв программ для экстренных сообщений); громкоговорители на автомобилях МЧС и милиции; SMS-рассылки МЧС на мобильные телефоны; сайт и соцсети МЧС, мобильное приложение «МЧС Беларуси»; бегущая строка на ТВ и уличных экранах; системы оповещения в зданиях.", "Сигналы: основной сигнал — «ВНИМАНИЕ ВСЕМ!» — включение сирен, прерывистые гудки предприятий и транспорта. Услышав его, надо сразу включить радио или телевизор и прослушать сообщение о том, что случилось и как действовать.", "Сигналы гражданской обороны: «Воздушная тревога», «Отбой воздушной тревоги», «Радиационная опасность», «Химическая тревога»; а также речевые сообщения об угрозе наводнения, урагана и т.п."]}, {"n": 95, "q": "Цель, задачи и структура государственной системы предупреждения и ликвидации чрезвычайных ситуаций (ГСЧС).", "a": ["ГСЧС — система органов управления, сил и средств республиканских и местных органов, организаций, которые решают задачи предупреждения и ликвидации ЧС. Основа — Закон РБ «О защите населения и территорий от ЧС природного и техногенного характера» и положение о ГСЧС, утверждённое Советом Министров. Руководит — Совет Министров, координирует — МЧС.", "Цель — защита населения и территорий от ЧС, снижение ущерба и потерь.", "Задачи: разработка и выполнение мер по предупреждению ЧС; обеспечение готовности органов управления, сил и средств; сбор и обработка информации, прогнозирование; подготовка населения; создание резервов; ликвидация ЧС; социальная защита пострадавших; международное сотрудничество.", "Структура — территориальные и отраслевые подсистемы, имеющие уровни:", "— республиканский (Совет Министров, МЧС, республиканская комиссия по ЧС);", "— территориальный (областной и Минский городской; районный и городской — исполкомы, комиссии по ЧС);", "— объектовый (организации).", "На каждом уровне есть органы управления (комиссии по ЧС), силы и средства, резервы, системы связи и оповещения."]}, {"n": 96, "q": "Силы и средства ликвидации ЧС.", "a": ["Силы и средства ГСЧС делятся на силы наблюдения и контроля и силы ликвидации ЧС.", "Силы ликвидации ЧС:", "— органы и подразделения по ЧС МЧС — главная сила (пожарные аварийно-спасательные части, специальные подразделения, Республиканский специальный отряд «ЗУБР», авиационная служба МЧС);", "— специализированные аварийно-спасательные службы (газовые, энергетические, водоканалы, горноспасательная служба);", "— формирования гражданской обороны (на предприятиях);", "— медицинские силы (скорая помощь, Республиканский центр экстренной медицинской помощи);", "— подразделения милиции, Вооружённых Сил, внутренних войск;", "— ветеринарная и санитарно-эпидемиологическая службы;", "— добровольные пожарные дружины и общественные организации (Белорусское республиканское общество спасания на водах — ОСВОД, Красный Крест).", "Средства — техника (пожарные машины, спасательное оборудование, вертолёты, плавсредства), приборы радиационной и химической разведки, СИЗ, материальные и финансовые резервы."]}, {"n": 97, "q": "Режимы функционирования ГСЧС.", "a": ["ГСЧС работает в одном из трёх режимов (в зависимости от обстановки):", "— режим повседневной деятельности — при нормальной обстановке, когда нет угрозы ЧС: наблюдение и контроль за окружающей средой и опасными объектами, планирование, подготовка населения и сил, создание резервов, проведение мероприятий по предупреждению ЧС;", "— режим повышенной готовности — при угрозе возникновения ЧС (например, штормовое предупреждение, рост уровня воды): усиление наблюдения, прогнозирование развития обстановки, приведение сил в готовность, оповещение населения, принятие мер по защите людей и снижению ущерба; комиссии по ЧС работают в усиленном режиме;", "— чрезвычайный режим — при возникновении и во время ликвидации ЧС: защита населения (эвакуация, укрытие, медицинская помощь), аварийно-спасательные и другие неотложные работы, жизнеобеспечение пострадавших, непрерывный контроль обстановки.", "Режим вводят решением Совета Министров, местных исполкомов или руководителей организаций в зависимости от масштаба ЧС."]}, {"n": 98, "q": "Права и обязанности граждан в ЧС.", "a": ["Права и обязанности закреплены в Законе РБ «О защите населения и территорий от ЧС природного и техногенного характера».", "Граждане имеют право: на защиту жизни, здоровья и имущества при ЧС; на получение информации о риске, которому они могут подвергнуться, и о мерах защиты; использовать средства коллективной и индивидуальной защиты; обращаться в госорганы по вопросам защиты; участвовать в мероприятиях по предупреждению и ликвидации ЧС; на возмещение ущерба, причинённого здоровью и имуществу; на бесплатное медицинское обслуживание, компенсации и социальные гарантии за проживание и работу в зонах ЧС; на пенсионное обеспечение в случае потери трудоспособности или кормильца.", "Граждане обязаны: соблюдать законы и правила по защите от ЧС; соблюдать меры безопасности в быту и на работе, не допускать нарушений технологической и трудовой дисциплины; изучать основные способы защиты от ЧС, приёмы первой помощи, правила пользования СИЗ; выполнять установленные правила поведения при угрозе и возникновении ЧС (в том числе указания спасателей, эвакуацию); при необходимости оказывать содействие в проведении спасательных работ."]}, {"n": 99, "q": "Гражданская оборона (ГО). Основные задачи.", "a": ["Гражданская оборона — составная часть системы оборонных мероприятий, которая включает подготовку и проведение мер по защите населения, материальных и культурных ценностей от опасностей, возникающих при ведении военных действий, а также при ЧС природного и техногенного характера (Закон РБ «О гражданской обороне», 2006 г.). Руководит ГО Совет Министров, начальник ГО — Премьер-министр; координирует МЧС.", "Основные задачи:", "— обучение населения способам защиты от опасностей;", "— оповещение населения об опасностях;", "— эвакуация населения, материальных и культурных ценностей в безопасные районы;", "— предоставление населению убежищ, укрытий и СИЗ;", "— световая маскировка и другие виды маскировки;", "— проведение аварийно-спасательных и других неотложных работ;", "— первоочередное жизнеобеспечение пострадавших (медицинская помощь, жильё, питание);", "— борьба с пожарами;", "— обнаружение и обозначение районов радиоактивного, химического, биологического заражения;", "— обеззараживание людей, техники, зданий, территорий;", "— восстановление и поддержание порядка, срочное восстановление коммунальных служб;", "— обеспечение устойчивой работы объектов экономики в военное время."]}, {"n": 100, "q": "Какие элементы включает понятие «надежность защиты персонала в ЧС»?", "a": ["Надёжность защиты персонала (рабочих и служащих) — способность объекта обеспечить сохранение жизни и здоровья работников при ЧС мирного и военного времени.", "Элементы надёжности защиты:", "— наличие защитных сооружений (убежищ, противорадиационных укрытий) достаточной вместимости для наибольшей работающей смены и их готовность к приёму людей;", "— обеспеченность СИЗ (противогазы, респираторы, защитная одежда) и медицинскими средствами защиты (аптечки);", "— надёжная система оповещения персонала;", "— планирование и подготовка эвакуации и рассредоточения работников;", "— обученность персонала действиям в ЧС, тренировки и учения;", "— готовность формирований ГО объекта (спасательных, медицинских, противопожарных);", "— своевременное проведение аварийно-спасательных работ и оказание медицинской помощи.", "Показатель надёжности — доля работников, которых можно защитить имеющимися средствами, от их общего числа (коэффициент надёжности защиты)."]}, {"n": 101, "q": "Понятие устойчивости объекта и устойчивости работы объекта в ЧС.", "a": ["Устойчивость объекта — способность зданий, сооружений, оборудования, сетей объекта противостоять поражающим факторам ЧС (ударной волне, огню, затоплению, радиации и т.д.) без разрушений, т.е. физическая прочность объекта.", "Устойчивость работы объекта в ЧС — способность объекта выпускать продукцию (оказывать услуги) в запланированном объёме и номенклатуре в условиях ЧС, а при повреждении — быстро восстановить производство.", "От чего зависит: надёжность защиты персонала; прочность и устойчивость зданий и оборудования; устойчивость систем снабжения (электро-, газо-, водо-, теплоснабжение; резервные источники энергии); устойчивость связей с поставщиками и потребителями (кооперация, запасы сырья); надёжность системы управления (резервные пункты управления, связь); подготовленность к восстановлению производства.", "Повышение устойчивости: исследование и прогноз возможных ЧС на объекте; укрепление конструкций, защита ценного оборудования; создание запасов, резервных источников энергии и воды; дублирование сетей; страхование; планирование восстановления; обучение персонала."]}, {"n": 102, "q": "Понятие радиоактивности. Единицы ее измерения. Период полураспада.", "a": ["Радиоактивность — самопроизвольное превращение (распад) неустойчивых ядер атомов в ядра других элементов, сопровождающееся испусканием ионизирующего излучения (альфа-, бета-частиц, гамма-квантов). Открыл А. Беккерель в 1896 г.; изучали М. и П. Кюри.", "Единицы измерения:", "— активность (число распадов в единицу времени) — беккерель (Бк) = 1 распад в секунду; внесистемная — кюри (Ки) = 3,7·1010 Бк. Загрязнение территории измеряют в Ки/км² или кБк/м², продуктов — в Бк/кг, Бк/л;", "— экспозиционная доза — кулон на килограмм (Кл/кг), внесистемная — рентген (Р);", "— поглощённая доза — грей (Гр) = 1 Дж/кг, внесистемная — рад (1 Гр = 100 рад);", "— эквивалентная и эффективная доза (учитывает вид излучения и чувствительность органов) — зиверт (Зв), внесистемная — бэр (1 Зв = 100 бэр);", "— мощность дозы — мкЗв/ч, мкР/ч (естественный фон в Беларуси — около 0,10–0,20 мкЗв/ч, или 10–20 мкР/ч).", "Период полураспада (Т½) — время, за которое распадается половина радиоактивных ядер. Примеры: йод-131 — 8 суток, цезий-137 — 30 лет, стронций-90 — 29 лет, плутоний-239 — 24 тыс. лет, америций-241 — 432 года. Считается, что через 10 периодов полураспада радионуклид практически исчезает."]}, {"n": 103, "q": "Виды и источники ионизирующих излучений. Антропогенные источники ионизирующих излучений.", "a": ["Ионизирующее излучение — излучение, которое при взаимодействии с веществом вызывает образование ионов (разных по знаку зарядов).", "Виды: корпускулярные (потоки частиц) — альфа-излучение (ядра гелия, малая проникающая способность — задерживается листом бумаги, но очень опасно при попадании внутрь организма), бета-излучение (электроны, задерживается слоем алюминия или одеждой и стеклом), нейтронное излучение (большая проникающая способность); электромагнитные — гамма-излучение и рентгеновское (очень большая проникающая способность, защищают свинец, бетон, вода).", "Источники: естественные — космическое излучение, естественные радионуклиды земной коры (уран, торий, радий, радон, калий-40), радионуклиды в организме. Дают около 2/3 годовой дозы человека.", "Антропогенные (техногенные) источники: медицина — рентгенодиагностика, компьютерная томография, лучевая терапия, радиофармпрепараты (наибольший вклад среди искусственных источников); испытания ядерного оружия (глобальные выпадения); атомная энергетика и аварии на АЭС (Чернобыль, Фукусима); добыча и переработка урана, радиоактивные отходы; сжигание угля и торфа, минеральные удобрения (фосфорные); строительные материалы (гранит, шлаки); бытовые приборы (старые телевизоры, часы со светящимся составом), авиаперелёты."]}, {"n": 104, "q": "Земная радиация. Проблема радона в окружающей среде.", "a": ["Земная радиация — излучение естественных радионуклидов, которые находятся в земной коре, горных породах, почве, воде, воздухе и строительных материалах: ряды урана-238 и тория-232, калий-40. Уровень зависит от горных пород (выше в гранитах, ниже в осадочных породах и песках). В Беларуси природный фон в основном невысокий.", "Радон (Rn-222) — радиоактивный инертный газ без цвета, запаха и вкуса, образуется при распаде радия в ряду урана. Период полураспада — 3,8 суток. Выходит из почвы и горных пород, накапливается в закрытых помещениях, особенно в подвалах и на первых этажах.", "Проблема: радон и его дочерние продукты распада дают около половины всей дозы облучения населения от природных источников. При вдыхании они облучают лёгкие — радон считается второй (после курения) причиной рака лёгких.", "Пути поступления в дом: из грунта через трещины в фундаменте и полу, из строительных материалов, из воды из глубоких скважин, из природного газа при сжигании.", "Защита: регулярное проветривание помещений, вентиляция подвалов; герметизация пола и фундамента, трещин; противорадоновые мембраны при строительстве; контроль строительных материалов; измерение уровня радона (норма — средняя объёмная активность в жилье не более 200 Бк/м³ для существующих и 100 Бк/м³ для новых зданий). В Беларуси проводится радоновый мониторинг и картирование территорий."]}, {"n": 105, "q": "Биологическое воздействие радиации на организм человека. Радиочувствительность организма. Критические органы. Внешнее и внутреннее облучение организма.", "a": ["Механизм действия: прямое — излучение разрушает молекулы ДНК, белков; косвенное — ионизирует воду в клетках (организм на ~70% из воды), образуются свободные радикалы, которые повреждают клетки. Итог — гибель клеток, мутации, нарушение работы органов.", "Радиочувствительность — степень реакции тканей на облучение. Закон Бергонье–Трибондо: чем активнее делятся клетки и чем менее они специализированы, тем выше их радиочувствительность. Наиболее чувствительны: красный костный мозг, половые органы, лимфатическая система, слизистая кишечника, хрусталик глаза; наименее — кости, мышцы, нервная ткань. Дети, беременные и пожилые более чувствительны.", "Критические органы — органы, облучение которых наносит наибольший ущерб здоровью. По группам: I — всё тело, красный костный мозг, половые железы; II — мышцы, щитовидная железа, печень, лёгкие, хрусталик; III — кожа, кости, кисти и стопы. Для отдельных радионуклидов: йод-131 — щитовидная железа, цезий-137 — мышцы (всё тело), стронций-90 — кости и костный мозг, плутоний — лёгкие, печень, кости.", "Внешнее облучение — источник находится вне организма (гамма-излучение от загрязнённой территории); прекращается при удалении от источника. Защита — расстояние, время, экранирование.", "Внутреннее облучение — радионуклиды попали внутрь организма (с пищей, водой, воздухом) и облучают его постоянно, пока не выведутся. Особенно опасны альфа- и бета-излучатели. После аварии на ЧАЭС внутреннее облучение через продукты (молоко, грибы, ягоды, дичь) даёт основную часть дозы жителей загрязнённых районов Беларуси."]}, {"n": 106, "q": "Детерминированные и стохастические эффекты воздействия ионизирующих излучений. Лучевая болезнь.", "a": ["Детерминированные (пороговые) эффекты — возникают обязательно, когда доза превышает определённый порог; тяжесть зависит от дозы. Примеры: острая и хроническая лучевая болезнь, лучевые ожоги кожи, лучевая катаракта, бесплодие, нарушение кроветворения, пороки развития плода.", "Стохастические (вероятностные, беспороговые) эффекты — могут возникнуть при любой дозе, от дозы зависит не тяжесть, а вероятность их появления. Проявляются через годы и десятилетия. Примеры: злокачественные опухоли (рак щитовидной железы, лейкозы, рак лёгких), генетические (наследственные) нарушения у потомков. После аварии на ЧАЭС в Беларуси резко вырос рак щитовидной железы у детей.", "Лучевая болезнь — общее заболевание организма от облучения.", "Острая лучевая болезнь — при однократном облучении дозой более 1 Гр. Степени: I (лёгкая) — 1–2 Гр; II (средняя) — 2–4 Гр; III (тяжёлая) — 4–6 Гр; IV (крайне тяжёлая) — более 6 Гр (почти всегда смертельна). Фазы: первичная реакция (тошнота, рвота, слабость), скрытый период (мнимое благополучие), разгар болезни (поражение крови, кровотечения, инфекции, выпадение волос), восстановление.", "Хроническая лучевая болезнь — при длительном облучении малыми дозами (суммарно более 1 Гр): поражение кроветворения, нервной системы, снижение иммунитета."]}, {"n": 107, "q": "Радиационная обстановка в Республике Беларусь после аварии на Чернобыльской АЭС (ЧАЭС). Назовите основные радионуклиды чернобыльского выброса.", "a": ["Авария на ЧАЭС — 26 апреля 1986 г., взрыв 4-го энергоблока (Украина, в 16 км от границы с Беларусью). Это крупнейшая техногенная катастрофа XX века.", "Беларусь — наиболее пострадавшая страна: на её территорию выпало около 70% радиоактивных веществ. Загрязнено цезием-137 (более 1 Ки/км²) около 23% территории (46,5 тыс. км²), на ней было 3678 населённых пунктов и 2,2 млн человек. Наиболее пострадали Гомельская и Могилёвская области, также Брестская, Минская, Гродненская.", "Сейчас за счёт распада радионуклидов площадь загрязнения уменьшилась примерно до 13% территории, число загрязнённых населённых пунктов снизилось почти вдвое. Основной загрязнитель сейчас — цезий-137, в ближней зоне (Полесский заповедник) — стронций-90, плутоний и америций-241 (количество америция растёт, т.к. он образуется из плутония-241).", "Основные радионуклиды выброса: йод-131 (Т½ = 8 сут; в первые месяцы — облучение щитовидной железы); цезий-137 (30 лет) и цезий-134 (2 года); стронций-90 (29 лет); изотопы плутония — 238, 239, 240, 241 (от 14 лет до 24 тыс. лет); америций-241 (432 года); а также короткоживущие — теллур, ксенон, барий, рутений, цирконий."]}, {"n": 108, "q": "Экологические последствия аварии на ЧАЭС.", "a": ["Радиоактивное загрязнение всех компонентов природы:", "— почвы — главное «хранилище» радионуклидов; цезий-137 и стронций-90 держатся в верхнем слое (5–10 см) и десятилетиями переходят в растения; больше всего переход на торфяно-болотных и песчаных бедных почвах Полесья;", "— лесов — загрязнено около 1/5 лесного фонда страны; лес накапливает радионуклиды в подстилке, поэтому грибы, ягоды, дичь и древесина часто превышают нормы; лесные пожары в загрязнённой зоне снова поднимают радионуклиды в воздух;", "— водоёмов — загрязнение донных отложений, рыбы, особенно в замкнутых озёрах; вынос радионуклидов реками (Припять, Сож, Днепр) в паводки;", "— атмосферы — в первые дни йод-131 и другие нуклиды; сейчас — вторичный подъём пыли, пожары.", "Изменения в живой природе: в первые годы — гибель хвойных лесов рядом с АЭС («рыжий лес»), мутации у растений и животных. Позже, после выселения людей, в зоне отчуждения восстановилась дикая природа (рост численности лосей, кабанов, волков, появились зубры, лошади Пржевальского, медведи) — но животные несут радионуклиды.", "Из хозяйственного оборота выведено около 265 тыс. га сельхозземель и около 1,7 млн га лесов было загрязнено; часть земель постепенно возвращается в оборот."]}, {"n": 109, "q": "Экономические последствия аварии на ЧАЭС.", "a": ["Общий ущерб для Беларуси оценивают в 235 млрд долл. США (32 годовых бюджета республики 1985 г.).", "Основные составляющие:", "— потери сельского хозяйства — вывод из оборота земель (около 265 тыс. га), ограничения на производство, снижение урожаев, затраты на защитные меры (известкование, удобрения, чистые корма);", "— потери лесного хозяйства — ограничения на заготовку древесины, грибов, ягод, охоту;", "— потери промышленности и других отраслей — закрытие предприятий, месторождений полезных ископаемых (нефть, торф, строительные материалы в загрязнённой зоне), потери основных фондов;", "— затраты на переселение — отселено около 137–138 тыс. человек, построены новые посёлки, дома, школы, больницы;", "— расходы на социальную защиту пострадавших (льготы, компенсации, оздоровление детей), медицинскую помощь, радиационный контроль, научные исследования;", "— затраты на дезактивацию, захоронение отходов, содержание Полесского заповедника.", "Государство с 1990 г. реализует государственные программы по преодолению последствий катастрофы (сейчас — на 2021–2025 гг. и следующая); раньше на это шло до 20% бюджета, сейчас — значительно меньше."]}, {"n": 110, "q": "Социально-психологические последствия аварии на ЧАЭС.", "a": ["Социальные последствия:", "— массовое переселение — около 138 тыс. человек выселены и переехали, разрушен привычный уклад жизни; 479 населённых пунктов отселены, многие из них захоронены;", "— ухудшение здоровья населения — рост рака щитовидной железы (особенно у тех, кто был детьми в 1986 г.), заболеваний эндокринной, кроветворной, сердечно-сосудистой систем, снижение иммунитета;", "— демографические — отток молодёжи и специалистов из загрязнённых районов, старение населения, снижение рождаемости;", "— ограничения в образе жизни — нельзя свободно собирать грибы, ягоды, рыбачить, вести хозяйство; потеря работы.", "Психологические последствия: радиофобия (страх перед радиацией, тревожность, иногда — наоборот, безразличие и отрицание опасности); стресс, депрессии; чувство «жертвы» и зависимость от льгот; неуверенность в будущем; недоверие к официальной информации; проблемы адаптации переселенцев на новом месте.", "Решение: социальная защита (Закон РБ «О социальной защите граждан, пострадавших от катастрофы на ЧАЭС, других радиационных аварий», 2009), оздоровление детей, центры социально-психологической реабилитации, информирование и обучение населения радиационной безопасности, развитие загрязнённых районов."]}, {"n": 111, "q": "Пути поступления радионуклидов в организм человека.", "a": ["Радионуклиды поступают в организм тремя путями:", "— пероральный (с пищей и водой) — основной путь (до 90% внутренней дозы). Цепочки: почва → растения → человек; почва → растения → животные → молоко и мясо → человек; вода → рыба → человек. Наиболее загрязнены: лесные грибы, ягоды (черника, клюква, брусника), дичь, рыба из замкнутых водоёмов, молоко коров с загрязнённых лугов;", "— ингаляционный (с воздухом) — при вдыхании радиоактивной пыли, дыма (при лесных пожарах, сжигании загрязнённых дров и листвы, пахоте, сухой погоде), радона;", "— через кожу и раны — при прямом контакте с загрязнёнными предметами, почвой, водой (наиболее значим при повреждении кожи).", "Внутри организма радионуклиды распределяются по-разному: цезий-137 — равномерно, в основном в мышцах (выводится за 100–150 суток); стронций-90 — в костях (выводится очень долго); йод-131 — в щитовидной железе; плутоний — в лёгких, печени, костях."]}, {"n": 112, "q": "Мероприятия по снижению накопления радионуклидов в продуктах питания.", "a": ["В сельском хозяйстве (защитные меры): известкование кислых почв; внесение повышенных доз калийных и фосфорных удобрений (калий — «конкурент» цезия, кальций — стронция); коренное улучшение лугов и пастбищ (вспашка, перезалужение); подбор культур и сортов с низким накоплением радионуклидов; использование чистых кормов для скота за 1,5–2 месяца до убоя; добавки к кормам с сорбентами (ферроцин — «болюсы», соли-лизунцы); радиационный контроль всей продукции.", "При переработке продуктов: молоко перерабатывают на масло, сыр, творог, сливки (цезий остаётся в обрате и сыворотке); тщательное мытьё овощей и фруктов, удаление верхних листьев капусты, очистка картофеля и корнеплодов.", "В быту (кулинарная обработка): мясо и рыбу вымачивать в подсоленной воде 2–3 ч, отваривать, первый бульон слить (удаляется до 50–70% цезия); грибы вымачивать и отваривать 2–3 раза со сливом отвара (удаляется до 70–90% цезия); не есть кости, хрящи, головы рыбы; проверять продукты в пунктах радиационного контроля (бесплатно); соблюдать республиканские допустимые уровни (РДУ-99)."]}, {"n": 113, "q": "Общие принципы питания в условиях радиации.", "a": ["Цель — уменьшить поступление радионуклидов, ускорить их выведение и укрепить защитные силы организма.", "Принципы:", "— употреблять «чистые» продукты, прошедшие радиационный контроль, ограничить лесные грибы, ягоды, дичь;", "— правильно обрабатывать продукты (вымачивание, отваривание со сливом бульона);", "— полноценное и сбалансированное питание с достаточным количеством белка (нехватка белка усиливает вред радиации);", "— достаточно калия (картофель, фасоль, горох, курага, изюм, орехи) — уменьшает накопление цезия; кальция (молочные продукты) — уменьшает накопление стронция; йода (йодированная соль, морепродукты) — защищает щитовидную железу; железа;", "— продукты, которые помогают выводить радионуклиды: пектины и клетчатка (яблоки, свёкла, морковь, смородина, крупы, отруби, морская капуста), кисломолочные продукты;", "— антиоксиданты — витамины A, C, E и бета-каротин, селен (овощи, фрукты, ягоды из чистых районов, растительное масло, зелень);", "— обильное питьё (чистая вода, соки, морсы, отвары трав);", "— ограничить жиры, сладкое, алкоголь и курение."]}, {"n": 114, "q": "Основные принципы радиационной безопасности.", "a": ["Закреплены в Законе РБ «О радиационной безопасности» (2019 г., действует с 2020 г.):", "— принцип нормирования — не превышать установленные пределы доз облучения от всех источников (для населения — 1 мЗв в год, для персонала — 20 мЗв в год в среднем за 5 лет);", "— принцип обоснования — запрещена любая деятельность с источниками излучения, если польза для человека и общества не превышает возможный вред от дополнительного облучения;", "— принцип оптимизации — поддерживать дозы облучения на возможно низком и достижимом уровне с учётом экономических и социальных факторов (принцип ALARA);", "— в аварийных ситуациях — принцип снижения дозы: защитные меры принимаются, если ожидаемое снижение вреда больше вреда от самих мер.", "Практические способы защиты от внешнего облучения: защита временем (меньше времени у источника), расстоянием (дальше от источника), экранированием (свинец, бетон, вода, грунт); от внутреннего — защита органов дыхания и пищеварения, чистые продукты, дезактивация."]}, {"n": 115, "q": "Основные нормативные документы в области радиационной безопасности.", "a": ["Законы Республики Беларусь:", "— «О радиационной безопасности» (2019 г.);", "— «О правовом режиме территорий, подвергшихся радиоактивному загрязнению в результате катастрофы на Чернобыльской АЭС» (2012 г.);", "— «О социальной защите граждан, пострадавших от катастрофы на Чернобыльской АЭС, других радиационных аварий» (2009 г.);", "— «Об использовании атомной энергии» (2008 г.);", "— «О защите населения и территорий от ЧС».", "Нормативы и правила:", "— Нормы радиационной безопасности (НРБ-2000, сейчас — гигиенический норматив «Критерии оценки радиационного воздействия»): пределы доз, требования к облучению;", "— Основные санитарные правила обеспечения радиационной безопасности (ОСП);", "— Республиканские допустимые уровни содержания цезия-137 и стронция-90 в пищевых продуктах и питьевой воде (РДУ-99, ГН 10-117-99). Например, по цезию-137: вода — 10 Бк/л, молоко — 100 Бк/л, хлеб — 40 Бк/кг, картофель — 80 Бк/кг, говядина — 500 Бк/кг, свинина и птица — 180 Бк/кг, свежие грибы — 370 Бк/кг, детское питание — 37 Бк/кг;", "— РДУ для лесной продукции, кормов, древесины.", "Международные: рекомендации МКРЗ, нормы безопасности МАГАТЭ."]}, {"n": 116, "q": "Назовите зоны радиоактивного загрязнения территории Республики Беларусь после катастрофы на ЧАЭС (5 зон) и укажите правовой режим в каждой зоне.", "a": ["Зоны установлены Законом РБ «О правовом режиме территорий, подвергшихся радиоактивному загрязнению в результате катастрофы на ЧАЭС» (2012 г.):", "— зона эвакуации (отчуждения) — 30-км зона вокруг ЧАЭС и территории, откуда население было эвакуировано в 1986–1987 гг. Режим: постоянное проживание запрещено, въезд — только по разрешению; хозяйственная деятельность запрещена, кроме мер по охране территории; здесь находится Полесский радиационно-экологический заповедник;", "— зона первоочередного отселения — плотность загрязнения цезием-137 от 40 Ки/км² и выше (или стронцием-90 от 3 Ки/км², плутонием — от 0,1 Ки/км²). Режим: проживание запрещено, население отселено, въезд по разрешению, хозяйственная деятельность ограничена;", "— зона последующего отселения — цезий-137 от 15 до 40 Ки/км² (стронций-90 — 2–3, плутоний — 0,05–0,1 Ки/км²). Режим: население отселено, новое заселение запрещено, ограничена деятельность;", "— зона с правом на отселение — цезий-137 от 5 до 15 Ки/км² (стронций-90 — 0,5–2, плутоний — 0,02–0,05 Ки/км²), где средняя годовая доза может превышать 1 мЗв. Режим: жители вправе переехать с компенсацией; запрещено строительство вредных объектов, размещение детских оздоровительных учреждений; обязательный радиационный контроль, защитные меры в сельском хозяйстве;", "— зона проживания с периодическим радиационным контролем — цезий-137 от 1 до 5 Ки/км² (стронций-90 — 0,15–0,5, плутоний — 0,01–0,02 Ки/км²), годовая доза не более 1 мЗв. Режим: проживание разрешено, проводится радиационный контроль, защитные меры, продукция проверяется; население имеет льготы."]}, {"n": 117, "q": "Полесский государственный радиационно-экологический заповедник, цель создания и задачи.", "a": ["Полесский государственный радиационно-экологический заповедник (ПГРЭЗ) создан в 1988 г. на территории зоны отчуждения в Брагинском, Наровлянском и Хойникском районах Гомельской области. Площадь — около 217 тыс. га; самая загрязнённая территория Беларуси (здесь находится основная часть плутония и стронция). Центр — г. Хойники. Отселено 96 населённых пунктов, более 22 тыс. жителей.", "Цель — не допустить выноса радионуклидов за пределы зоны, изучать радиоэкологические процессы и сохранять природные комплексы.", "Задачи:", "— охрана территории, контроль за въездом, борьба с браконьерством и мародёрством;", "— предотвращение выноса радионуклидов (с водой, ветром, животными, при пожарах);", "— противопожарные мероприятия (лесные пожары особенно опасны);", "— радиационно-экологический мониторинг воздуха, почвы, воды, растений и животных;", "— научные исследования (поведение радионуклидов, влияние радиации на природу);", "— сохранение и восстановление биоразнообразия (здесь живут зубры, волки, медведи, лошади Пржевальского, около 70 видов из Красной книги);", "— опытно-хозяйственная деятельность (коневодство, пчеловодство, садоводство) для проверки возможности возвращения земель.", "Сейчас развивается научный и экологический туризм."]}, {"n": 118, "q": "Международное сотрудничество в ликвидации последствий аварии на ЧАЭС.", "a": ["Беларусь с начала 1990-х гг. ставит вопрос о последствиях Чернобыля на уровне ООН. Генеральная Ассамблея ООН приняла ряд резолюций о Чернобыле; 26 апреля объявлен Международным днём памяти жертв радиационных аварий и катастроф (с 2016 г.); 2016–2026 гг. — Десятилетие восстановления и устойчивого развития пострадавших регионов.", "Участники сотрудничества: структуры ООН (ПРООН, ЮНИСЕФ, ВОЗ, МАГАТЭ, ФАО, ЮНЕСКО), Межагентская группа ООН по Чернобылю; Европейский союз (программа TACIS); Япония (фонд Сасакавы — обследование детей на рак щитовидной железы); Россия и Украина (программы Союзного государства по преодолению последствий Чернобыля); благотворительные фонды и общественные организации (оздоровление белорусских детей за рубежом — Италия, Германия, Ирландия, Испания).", "Основные направления: медицинская помощь и обследование населения, оборудование для больниц и радиационного контроля; научные исследования; программы реабилитации территорий (проект ETHOS, программа CORE 2004–2008); социально-экономическое развитие пострадавших районов; обмен опытом (в т.ч. с Японией после Фукусимы); проект Международного чернобыльского форума."]}, {"n": 119, "q": "Реабилитация загрязненных радионуклидами территорий в Республике Беларусь. Рекомендации по ведению сельскохозяйственного производства на территории радиоактивного загрязнения Республики Беларусь на 2021-2025 годы.", "a": ["Реабилитация территорий — комплекс мер по возвращению загрязнённых территорий к нормальной жизни: безопасное проживание, производство чистой продукции, социально-экономическое развитие. Проводится в рамках Государственной программы по преодолению последствий катастрофы на ЧАЭС на 2021–2025 гг. (и следующих), координирует МЧС (Департамент по ликвидации последствий катастрофы на ЧАЭС).", "Основные направления: радиационный контроль и мониторинг; производство продукции в пределах допустимых уровней; газификация, строительство жилья, дорог, водопроводов; медицинское обслуживание и оздоровление; информирование населения; возвращение в хозяйственный оборот земель, где загрязнение снизилось; исключение населённых пунктов из зон загрязнения.", "Рекомендации по ведению сельского хозяйства на 2021–2025 гг. (разработаны Институтом радиологии):", "— известкование кислых почв, внесение повышенных доз калийных и фосфорных удобрений, сбалансированное питание растений микроэлементами;", "— коренное и поверхностное улучшение лугов и пастбищ;", "— подбор культур и сортов с низким накоплением радионуклидов (зерновые, рапс, кукуруза, картофель); на сильно загрязнённых землях — культуры для технической переработки (рапс на масло и биодизель, лён);", "— «чистый» откорм скота перед убоем, применение цезийсвязывающих добавок (ферроцин);", "— переработка продукции (молоко — на масло, сыры);", "— обязательный радиационный контроль сельскохозяйственной продукции и кормов;", "— специализация хозяйств с учётом плотности загрязнения (на землях с большим загрязнением — мясное скотоводство, семеноводство, техническое сырьё)."]}]}]</script>

/* ---------- Helpers ---------- */
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function plural(n,f){var a=n%10,b=n%100; return f[(a===1&&b!==11)?0:(a>=2&&a<=4&&(b<10||b>=20))?1:2]}
function tickW(n){return n+' '+plural(n,['билет','билета','билетов'])}
function hexA(h,a){h=h.replace('#',''); var n=parseInt(h,16); return 'rgba('+(n>>16&255)+','+(n>>8&255)+','+(n&255)+','+a+')'}
function haptic(){try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}}
function escRe(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}
function words(q){return norm(q).trim().split(/\s+/).filter(Boolean)}
function hl(text,ws){
  if(!ws.length) return esc(text);
  var re=new RegExp('('+ws.map(function(w){return escRe(w).replace(/е/g,'[её]')}).join('|')+')','giu');
  return text.split(re).map(function(p,i){return i%2?'<mark>'+esc(p)+'</mark>':esc(p)}).join('');
}

/* ---------- Answer formatting ---------- */
function lead(text){
  var di=-1, ci=-1, m;
  m=text.match(/^(.{2,72}?)\s[—–]\s/); if(m && !/[:;]/.test(m[1])) di=m[1].length;
  m=text.match(/^([^:—–;]{2,52}):\s/); if(m) ci=m[1].length;
  var cut=-1, sep='';
  if(ci>=0 && (di<0 || ci<di)){cut=ci; sep=':'} else if(di>=0){cut=di; sep=' —'}
  if(cut<0) return esc(text);
  var rest=text.slice(cut).replace(/^:/,'').replace(/^\s[—–]/,'');
  return '<b>'+esc(text.slice(0,cut))+'</b>'+esc(sep)+esc(rest);
}
function fmt(paras){
  var out=[], list=null;
  function flush(){ if(list){ out.push('<'+list.t+'>'+list.items.join('')+'</'+list.t+'>'); list=null } }
  paras.forEach(function(p){
    var m;
    if((m=p.match(/^[—–\-•·]\s*(.+)$/))){
      if(!list||list.t!=='ul'){flush(); list={t:'ul',items:[]}}
      list.items.push('<li>'+lead(m[1])+'</li>'); return;
    }
    if((m=p.match(/^\d{1,2}[).]\s+(.+)$/))){
      if(!list||list.t!=='ol'){flush(); list={t:'ol',items:[]}}
      list.items.push('<li>'+lead(m[1])+'</li>'); return;
    }
    flush();
    if(/:$/.test(p) && p.length<100){ out.push('<p class="ah">'+esc(p.replace(/:$/,''))+'</p>'); return }
    out.push('<p>'+lead(p)+'</p>');
  });
  flush();
  return out.join('');
}
