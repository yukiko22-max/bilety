итной политики на каждый год совместно с Правительством; главная цель — обеспечение ценовой стабильности.", "Промежуточные цели (ориентиры): денежная масса, процентные ставки, валютный курс.", "Виды политики: стимулирующая («дешёвые деньги») — снижение ставок, рост денежной массы — при спаде; сдерживающая («дорогие деньги») — рост ставок, сокращение денежной массы — при инфляции.", "Режимы: таргетирование денежной массы, валютного курса, инфляции."]}, {"n": 47, "q": "Уровень и качество жизни.", "a": ["Уровень жизни — степень обеспеченности населения материальными и духовными благами и степень удовлетворения потребностей.", "Показатели уровня жизни: ВВП (ВНД) на душу населения; реальные располагаемые денежные доходы; номинальная и реальная заработная плата, пенсии; бюджет прожиточного минимума (БПМ) и доля населения с доходами ниже него; структура потребительских расходов (доля на питание — чем она ниже, тем выше уровень жизни); обеспеченность жильём; уровень безработицы.", "Качество жизни — более широкое понятие: не только доходы, но и здоровье, образование, экология, безопасность, условия труда и отдыха, свобода, социальные связи.", "Интегральный показатель — индекс человеческого развития (ИЧР) ООН. Он учитывает три компонента: продолжительность жизни (здоровье), уровень образования и доход (ВНД на душу населения по ППС). Беларусь входит в группу стран с очень высоким уровнем ИЧР.", "Повышение качества жизни — цель Программы социально-экономического развития РБ на 2026–2030 годы («переход к новому качеству жизни каждого гражданина»)."]}, {"n": 48, "q": "Доходы населения и проблемы их распределения в рыночной экономике. Кривая Лоренца.", "a": ["Доходы населения — деньги и материальные блага, которые получают домохозяйства за определённый период.", "Источники: оплата труда; доходы от предпринимательства; доходы от собственности (процент, дивиденды, рента); социальные трансферты (пенсии, пособия, стипендии); прочие.", "Номинальные доходы — сумма полученных денег; располагаемые — после уплаты налогов и обязательных платежей; реальные — с учётом изменения цен.", "Проблема распределения: рынок распределяет доходы по вкладу факторов производства, поэтому возникает неравенство (разные способности, образование, собственность, наследство, удача). Слишком большое неравенство ведёт к бедности и социальной напряжённости. Государство перераспределяет доходы через налоги и трансферты.", "Кривая Лоренца — график фактического распределения доходов: по горизонтали — % населения (семей), по вертикали — % доходов. Биссектриса — абсолютное равенство. Чем сильнее кривая отклоняется от биссектрисы, тем больше неравенство.", "Коэффициент Джини — от 0 (полное равенство) до 1 (полное неравенство). Также используют децильный коэффициент (доходы 10% самых богатых / 10% самых бедных)."]}, {"n": 49, "q": "Социальная политика Республики Беларусь: основные направления и приоритеты.", "a": ["Социальная политика — деятельность государства по обеспечению достойного уровня жизни, социальной защиты и социальной стабильности в обществе.", "По Конституции Республика Беларусь — социальное правовое государство.", "Основные направления:", "— политика доходов и оплаты труда: рост реальных доходов, установление минимальной заработной платы, бюджет прожиточного минимума (БПМ) как минимальный социальный стандарт;", "— пенсионное обеспечение (Фонд социальной защиты населения);", "— социальная защита и адресная социальная помощь малообеспеченным, людям с инвалидностью, пожилым;", "— поддержка семьи, материнства и детства: пособия, семейный капитал, льготы многодетным семьям;", "— занятость: содействие трудоустройству, переобучение, пособия по безработице;", "— доступное образование и здравоохранение;", "— жилищная политика: льготное кредитование, строительство и арендное жильё;", "— государственные социальные стандарты (минимальные гарантии в разных сферах).", "Приоритеты (Программа социально-экономического развития на 2026–2030 годы): демографическая безопасность (сохранение населения, здоровье нации, поддержка семьи); развитие человеческого потенциала и качественное образование; качественная и удобная среда для жизни. Общая цель — переход к новому качеству жизни каждого гражданина."]}, {"n": 50, "q": "Понятие и цели экономического роста, социальные приоритеты.", "a": ["Экономический рост — увеличение реального объёма производства (реального ВВП) в стране за определённый период, а также рост производственных возможностей экономики.", "Измерение: темп роста реального ВВП = ВВП текущего года / ВВП прошлого года × 100%; темп прироста = (ВВП текущего − ВВП прошлого) / ВВП прошлого × 100%. Для оценки уровня жизни важнее рост реального ВВП на душу населения.", "Цели экономического роста: повышение уровня и качества жизни населения; увеличение доходов людей; решение социальных проблем (образование, здравоохранение, жильё); полная занятость; укрепление экономической безопасности и обороноспособности страны; повышение конкурентоспособности на мировом рынке.", "Социальные приоритеты: рост должен служить человеку — не просто больше продукции, а лучше жизнь людей: рост реальных доходов, снижение бедности, доступность социальных услуг, хорошая экология, сохранение здоровья. Важна концепция устойчивого развития — рост без вреда для будущих поколений и природы.", "В Беларуси социальная направленность роста закреплена в Программе социально-экономического развития на 2026–2030 годы: цель — новое качество жизни граждан."]}, {"n": 51, "q": "Типы экономического роста.", "a": ["Выделяют два основных типа экономического роста.", "Экстенсивный тип — рост производства за счёт увеличения количества используемых ресурсов: больше работников, больше оборудования, новые земли, больше сырья. Технология и производительность не меняются. Плюсы: быстро даёт результат, простой путь. Минусы: ресурсы ограничены, высокие затраты, вред природе, нет роста эффективности.", "Интенсивный тип — рост производства за счёт более эффективного использования ресурсов: новые технологии, научно-технический прогресс, рост квалификации работников, лучшая организация производства и управления. Растёт производительность труда, снижаются затраты на единицу продукции. Это главный путь развития современных стран.", "В реальности обычно сочетание обоих типов: преимущественно экстенсивный или преимущественно интенсивный рост.", "Также говорят об инновационном типе (на основе знаний, новых технологий, цифровизации) и об устойчивом («зелёном») росте. Беларусь ставит задачу перехода к интенсивному инновационному росту (Государственная программа инновационного развития на 2026–2030 годы)."]}, {"n": 52, "q": "Источники и факторы экономического роста, производительность труда, производительность капитала, производительность природных ресурсов.", "a": ["Источники и факторы экономического роста:", "— факторы предложения: количество и качество природных ресурсов; количество и качество трудовых ресурсов (человеческий капитал); объём основного капитала (инвестиции); технологии и научно-технический прогресс; предпринимательство и организация производства;", "— фактор спроса: достаточный совокупный спрос, чтобы продукция продавалась;", "— фактор распределения: эффективное распределение ресурсов между отраслями;", "— институциональные условия: стабильность, защита собственности, законы, государственная политика, интеграция в мировую экономику.", "Показатели эффективности ресурсов:", "— производительность труда — количество продукции на одного работника или на единицу рабочего времени: ВВП / число занятых. Главный показатель интенсивного роста;", "— производительность капитала (капиталоотдача, фондоотдача) — продукция на 1 рубль основного капитала: ВВП / стоимость основного капитала; обратный показатель — капиталоёмкость;", "— производительность природных ресурсов (ресурсоотдача) — продукция на единицу использованных природных ресурсов (земли, энергии, сырья); обратный показатель — ресурсоёмкость, энергоёмкость ВВП.", "Рост производительности всех факторов — основа интенсивного экономического роста."]}, {"n": 53, "q": "Понятие «мировое хозяйство». Международное разделение труда как основа формирования и развития мирового хозяйства.", "a": ["Мировое хозяйство (мировая экономика) — совокупность национальных экономик всех стран, связанных между собой международным разделением труда и системой международных экономических отношений.", "Субъекты: государства, транснациональные корпорации (ТНК), международные организации (ООН, ВТО, МВФ, Всемирный банк), региональные объединения (ЕС, ЕАЭС), банки, фирмы.", "Формы международных экономических отношений: международная торговля товарами и услугами; международное движение капитала; международная миграция рабочей силы; международные валютно-финансовые отношения; научно-техническое сотрудничество.", "Международное разделение труда (МРТ) — специализация стран на производстве определённых товаров и услуг, которые они затем обменивают на мировом рынке. Это основа мирового хозяйства, потому что именно специализация связывает страны между собой.", "Факторы МРТ: различия в природных условиях и ресурсах; уровень экономического и технологического развития; размер страны и рынка; географическое положение; исторические традиции.", "Виды: общее (между отраслями — промышленность, сельское хозяйство), частное (по видам продукции), единичное (по деталям, этапам производства).", "Выгода: страна производит то, в чём у неё сравнительное преимущество (теория Д. Рикардо), и получает больше благ при тех же ресурсах."]}, {"n": 54, "q": "Основные этапы и современные тенденции развития мирового хозяйства: индустриализация, постиндустриализация, глобализация, региональная экономическая интеграция. Место Республики Беларусь в мировом хозяйстве.", "a": ["Основные этапы формирования мирового хозяйства:", "— XVI–XVII вв. — великие географические открытия, возникновение мирового рынка;", "— конец XVIII – XIX в. — промышленная революция, индустриализация (переход от ручного труда к машинному, рост промышленности), складывается мировое хозяйство;", "— XX в. — рост ТНК, мировые войны, образование социалистической и капиталистической систем, распад колониальной системы;", "— с конца XX в. — постиндустриализация и глобализация.", "Современные тенденции:", "— постиндустриализация — главную роль играют сфера услуг, знания, информация, высокие технологии, цифровая экономика;", "— глобализация — усиление взаимосвязи и взаимозависимости стран; единые рынки товаров, капитала, информации; роль ТНК; плюсы — рост торговли и технологий; минусы — неравенство, распространение кризисов;", "— региональная экономическая интеграция — объединение стран региона для совместного развития: зона свободной торговли → таможенный союз → общий рынок → экономический союз (ЕС, ЕАЭС, АСЕАН);", "— также регионализация, рост роли Азии (Китай), санкции и фрагментация мировой экономики.", "Место Беларуси: малая открытая экономика с высокой долей экспорта в ВВП; экспорт — калийные удобрения, нефтепродукты, грузовые автомобили и тракторы (МАЗ, БелАЗ, МТЗ), продукты питания (молочные, мясные), IT-услуги, транспортные услуги; основной партнёр — Россия; член Союзного государства, ЕАЭС, СНГ, ОДКБ, ШОС (с 2024 г.), партнёр БРИКС; развитие сотрудничества с Китаем и странами «дальней дуги»."]}, {"n": 55, "q": "Международное движение капитала.", "a": ["Международное движение капитала — перемещение капитала (денег, ресурсов) между странами, чтобы получить доход или по другим причинам (помощь, политика).", "Причины: разница в доходности вложений; избыток капитала в одних странах и нехватка в других; стремление обойти торговые барьеры и приблизиться к рынкам сбыта и ресурсам; дешёвая рабочая сила; льготы для инвесторов; политическая стабильность.", "Формы:", "— по источникам: частный (фирмы, банки) и государственный (официальный) капитал;", "— по форме: предпринимательский (инвестиции) и ссудный (кредиты, займы);", "— прямые иностранные инвестиции (ПИИ) — вложения, дающие контроль над предприятием (строительство заводов, покупка не менее 10% акций); портфельные инвестиции — покупка ценных бумаг без контроля, ради дохода;", "— по срокам: краткосрочные, среднесрочные, долгосрочные.", "Ввоз капитала — импорт, вывоз — экспорт капитала. «Бегство капитала» — нелегальный или вынужденный вывод капитала.", "Последствия: для страны-получателя — новые технологии, рабочие места, рост производства и налогов; но рост внешнего долга, вывоз прибыли, зависимость. Для страны-экспортёра — доходы, расширение рынков; но меньше инвестиций внутри страны.", "В Беларуси привлечение иностранных инвестиций поддерживается через свободные экономические зоны, Парк высоких технологий, индустриальный парк «Великий камень»."]}, {"n": 56, "q": "Платежный баланс страны.", "a": ["Платёжный баланс — систематизированная запись всех экономических операций между резидентами страны и остальным миром за определённый период (обычно год или квартал). В Беларуси составляется Национальным банком по методике МВФ.", "Структура (основные счета):", "1) счёт текущих операций: торговый баланс (экспорт и импорт товаров); баланс услуг (транспорт, туризм, IT и др.); первичные доходы (оплата труда, доходы от инвестиций — проценты, дивиденды); вторичные доходы (текущие трансферты — денежные переводы мигрантов, помощь);", "2) счёт операций с капиталом (капитальные трансферты, покупка нематериальных активов);", "3) финансовый счёт: прямые и портфельные инвестиции, кредиты и займы, прочие инвестиции, изменение резервных активов (золотовалютных резервов);", "4) статья «чистые ошибки и пропуски».", "Принцип двойной записи: каждая операция записывается дважды — в кредит и дебет, поэтому в целом платёжный баланс всегда равен нулю.", "Активное (положительное) сальдо — поступлений больше, чем выплат; пассивное (отрицательное) сальдо — дефицит.", "Дефицит текущего счёта покрывается притоком капитала или уменьшением резервов. Платёжный баланс влияет на валютный курс и показывает внешнеэкономическое положение страны."]}, {"n": 57, "q": "Международные валютные отношения.", "a": ["Международные валютные отношения — денежные отношения между странами, которые возникают при международной торговле, движении капитала, туризме, кредитах.", "Валюта — денежная единица страны. Валютный курс — цена одной валюты, выраженная в другой валюте. Котировка — установление курса.", "Режимы валютного курса: фиксированный (государство устанавливает курс), плавающий (курс определяется спросом и предложением на валютном рынке), промежуточные (управляемое плавание, валютный коридор). В Беларуси — плавающий курс белорусского рубля при интервенциях Национального банка для сглаживания резких колебаний (курс к корзине валют).", "На курс влияют: инфляция, процентные ставки, платёжный баланс, экономический рост, ожидания, политика центрального банка.", "Девальвация — снижение курса национальной валюты (выгодно экспортёрам, импорт дорожает); ревальвация — повышение курса.", "Конвертируемость — возможность свободно обменивать валюту на другие.", "Этапы мировой валютной системы: Парижская (золотомонетный стандарт, 1867), Генуэзская (золотодевизный, 1922), Бреттон-Вудская (фиксированные курсы, доллар привязан к золоту, 1944), Ямайская (плавающие курсы, 1976–1978 — действует сейчас). Ключевая организация — МВФ."]}, {"n": 58, "q": "Международная торговля товарами и услугами. Протекционизм, фритредерство как формы внешнеторговой политики.", "a": ["Международная торговля — обмен товарами и услугами между странами. Состоит из экспорта (вывоза) и импорта (ввоза). Внешнеторговый оборот = экспорт + импорт; сальдо торгового баланса = экспорт − импорт.", "Причины торговли: разные ресурсы и условия; специализация на основе абсолютных (А. Смит) и сравнительных (Д. Рикардо) преимуществ; выгода от эффекта масштаба; разнообразие товаров.", "Внешнеторговая политика — меры государства, которые регулируют внешнюю торговлю.", "Фритредерство (свободная торговля) — минимальное вмешательство государства, отмена или снижение барьеров. Плюсы: конкуренция, дешёвые и разнообразные товары, эффективность. Минусы: слабые отечественные отрасли могут не выдержать конкуренции.", "Протекционизм — защита отечественных производителей от иностранной конкуренции. Плюсы: защита молодых отраслей и рабочих мест, экономическая безопасность. Минусы: высокие цены, меньше конкуренции, ответные меры других стран.", "Инструменты: тарифные — таможенные пошлины; нетарифные — квоты, лицензирование, эмбарго, технические стандарты, субсидии экспортёрам, антидемпинговые меры.", "Международное регулирование — Всемирная торговая организация (ВТО). В ЕАЭС действует единый таможенный тариф."]}, {"n": 59, "q": "Международная миграция рабочей силы.", "a": ["Международная миграция рабочей силы — перемещение трудоспособного населения из одной страны в другую, чтобы найти работу и получить более высокий доход.", "Причины: экономические — разница в зарплате и уровне жизни, безработица в своей стране, нехватка рабочих в другой; также политические, военные, этнические, семейные, экологические.", "Виды: эмиграция (выезд из страны) и иммиграция (въезд в страну); реэмиграция (возвращение на родину); постоянная и временная (сезонная, маятниковая); легальная и нелегальная.", "Особое явление — «утечка умов» (отъезд высококвалифицированных специалистов, учёных).", "Последствия для страны-донора: снижается безработица, поступают денежные переводы мигрантов, но теряются квалифицированные кадры и средства на их подготовку. Для принимающей страны: покрытие нехватки рабочих, рост производства, дешёвый труд; но нагрузка на социальную сферу и возможная напряжённость.", "В ЕАЭС действует общий рынок труда: граждане стран-членов работают без разрешений. В Беларуси ГП «Сбалансированный рынок труда» на 2026–2030 годы предусматривает стимулирование притока квалифицированной иностранной рабочей силы с учётом потребностей рынка труда."]}, {"n": 60, "q": "Пути перехода к рыночной экономике: постепенные рыночные преобразования (градуалистский подход); метод шоковой терапии. Системные рыночные реформы.", "a": ["Переходная экономика — экономика в процессе перехода от командной (плановой) к рыночной системе.", "Шоковая терапия — быстрые радикальные реформы одновременно: мгновенная либерализация цен и внешней торговли, массовая приватизация, жёсткая финансовая политика (сокращение госрасходов и денежной массы). Плюсы: быстрое создание рынка. Минусы: резкий спад производства, высокая инфляция, рост безработицы и бедности. Примеры: Польша, Россия начала 1990-х.", "Градуалистский (постепенный, эволюционный) подход — поэтапные реформы под контролем государства, сохранение социальной стабильности, постепенная приватизация и либерализация. Плюсы: меньше социальных потерь. Минусы: медленно, может затянуться. Примеры: Китай, Беларусь.", "Системные рыночные реформы (основные направления): либерализация цен и торговли; разгосударствление и приватизация; формирование рыночной инфраструктуры (банки, биржи, страхование); финансовая стабилизация; создание правовой базы рынка; развитие конкуренции и предпринимательства; реформа социальной защиты; открытие экономики миру."]}, {"n": 61, "q": "Этапы рыночного реформирования экономики Беларуси. Учет санкционного давления в выборе вектора развития национальной экономики.", "a": ["Беларусь выбрала эволюционный (постепенный) путь перехода к социально ориентированной рыночной экономике.", "Этапы (обобщённо):", "1) 1991–1994 гг. — начало реформ после распада СССР: первые шаги либерализации, кризис, падение производства, высокая инфляция;", "2) 1995–2000 гг. — стабилизация: выбор белорусской модели, сильная роль государства, восстановление связей с Россией, рост производства;", "3) 2001–2010 гг. — устойчивый рост, модернизация промышленности, развитие экспорта и инфраструктуры;", "4) после 2011 г. — либерализация условий для бизнеса, развитие частного сектора и IT (Парк высоких технологий), повышение эффективности, курс на инновационное развитие;", "5) с 2020–2022 гг. — работа в условиях санкций, импортозамещение, переориентация на рынки России, Китая, стран «дальней дуги».", "Учёт санкционного давления: переориентация экспорта и логистики (через порты России); импортозамещение и развитие собственного производства; углубление интеграции в Союзном государстве и ЕАЭС; расширение сотрудничества с Китаем, странами Азии, Африки, Латинской Америки; расчёты в национальных валютах; ставка на технологический суверенитет, цифровизацию и внутренний рынок."]}, {"n": 62, "q": "Модель социально-ориентированной рыночной экономики Республики Беларусь.", "a": ["Белорусская экономическая модель — социально ориентированная рыночная экономика: рыночные механизмы сочетаются с сильным государственным регулированием и социальными гарантиями.", "Основные черты:", "— многообразие форм собственности при значительной роли государственной собственности в ключевых отраслях;", "— активное государственное регулирование экономики (прогнозы, программы, поддержка важных предприятий);", "— эволюционный (постепенный) путь реформ без «шоковой терапии»;", "— сильная социальная политика: доступное образование и здравоохранение, социальная защита, поддержка семьи, низкая безработица;", "— развитая промышленность и сельское хозяйство, ориентация на экспорт;", "— интеграция с Россией (Союзное государство) и в ЕАЭС;", "— развитие частного предпринимательства и IT-сектора;", "— курс на инновационное развитие, цифровизацию и технологическую независимость.", "Цель модели — рост благосостояния и качества жизни граждан при социальной стабильности и справедливости. Её закрепляет Конституция (Беларусь — социальное государство) и программы социально-экономического развития."]}, {"n": 63, "q": "Методы воздействия центрального банка на денежную массу. Операции на открытом рынке. Политика учетной ставки. Изменение уровня обязательных резервов.", "a": ["Центральный банк (в Беларуси — Национальный банк) регулирует денежную массу с помощью трёх основных инструментов.", "1. Операции на открытом рынке — покупка и продажа государственных ценных бумаг. Если банк покупает ценные бумаги у коммерческих банков и населения — денег в экономике становится больше (стимулирование). Если продаёт — деньги изымаются, денежная масса уменьшается (сдерживание). Самый гибкий и часто используемый инструмент.", "2. Политика учётной ставки (в Беларуси — ставка рефинансирования) — процент, под который центральный банк выдаёт кредиты коммерческим банкам. Повышение ставки → кредиты дороже → банки меньше кредитуют → денежная масса сокращается, инфляция снижается. Снижение ставки → кредиты дешевле → денежная масса растёт, стимулируется экономика.", "3. Изменение нормы обязательных резервов — доли депозитов, которую банки должны хранить в центральном банке. Повышение нормы → у банков меньше денег для кредитов → денежная масса уменьшается (через снижение денежного мультипликатора). Снижение нормы → денежная масса растёт. Инструмент очень сильный, используется редко.", "Другие инструменты: валютные интервенции, прямые ограничения кредитования, нормативы ликвидности."]}, {"n": 64, "q": "Программы социально-экономического развития Республики Беларусь.", "a": ["Программы социально-экономического развития — главные документы среднесрочного (на 5 лет) планирования в Беларуси. Они определяют цели, приоритеты и ожидаемые результаты развития страны. С 1996 г. программы принимаются на Всебелорусских народных собраниях.", "Программа на 2021–2025 годы — «пятилетка качества»: цель — обеспечение социальной стабильности и роста благосостояния граждан за счёт модернизации экономики, наращивания экспорта и создания комфортных условий для жизни.", "Программа на 2026–2030 годы утверждена решением VII Всебелорусского народного собрания от 19 декабря 2025 г. № 1 (вступила в силу 21.12.2025). Цель — переход к новому качеству жизни каждого гражданина Беларуси.", "Семь приоритетов: 1) национальная демографическая безопасность (сохранение населения, здоровье нации, поддержка семьи); 2) развитие человеческого потенциала, качественное образование; 3) качественная и удобная среда для жизни; 4) рост конкурентоспособности, ускорение технологического развития и цифровая трансформация; 5) сильные регионы; 6) укрепление обороноспособности и развитие оборонного сектора; 7) реализация туристического потенциала.", "Для реализации принимаются государственные программы (например, ГП инновационного развития, «Сбалансированный рынок труда», «Дороги Беларуси» на 2026–2030 годы)."]}]}, {"id": "bzhch", "title": "Безопасность жизнедеятельности человека", "short": "БЖЧ", "icon": "shield", "color": "#FF2D55", "tickets": [{"n": 1, "q": "Понятие опасности. Классификация и источники опасностей.", "a": ["Опасность — свойство явлений, процессов, объектов, которые при определённых условиях могут причинить вред здоровью человека, имуществу или окружающей среде. Опасность есть всегда — «нулевого риска» не бывает (аксиома о потенциальной опасности).", "Классификация: по происхождению — природные, техногенные, антропогенные (из-за ошибок человека), экологические, социальные, биологические; по времени проявления — импульсивные (внезапные) и кумулятивные (накапливаются постепенно); по зоне действия — локальные, местные, региональные, глобальные; по воздействию на человека — физические, химические, биологические, психофизиологические.", "Источники опасностей: природные явления (для Беларуси — ураганы, ливни, паводки, лесные и торфяные пожары); техника и производство (машины, электричество, химические вещества); сам человек (ошибки, усталость, нарушение правил); социальная среда (преступность, вредные привычки)."]}, {"n": 2, "q": "Понятие безопасности. Принципы безопасности жизнедеятельности", "a": ["Безопасность — состояние, при котором с определённой вероятностью исключено проявление опасностей, т.е. риск снижен до приемлемого уровня. Абсолютной безопасности не существует.", "Безопасность жизнедеятельности — система знаний о том, как распознавать опасности, защищаться от них и сохранять жизнь, здоровье и работоспособность человека.", "Принципы (по способу реализации): ориентирующие — системность, снижение опасности, замена оператора (автоматизация), учёт индивидуальных особенностей человека; технические — защита расстоянием и временем, экранирование, блокировка, герметизация, слабое звено (предохранители); организационные — нормирование, обучение, подбор кадров, рациональный режим труда и отдыха; управленческие — контроль, ответственность, стимулирование, обратная связь."]}, {"n": 3, "q": "Интегрированная учебная дисциплина «Безопасность жизнедеятельности человека». Актуальность изучения дисциплины, цель и задачи.", "a": ["«Безопасность жизнедеятельности человека» — интегрированная дисциплина, которая в вузах Беларуси объединяет основы экологии, энергосбережения, охраны труда, защиты населения от ЧС и радиационной безопасности.", "Актуальность: растёт число природных и техногенных ЧС, ухудшается состояние окружающей среды, высокий производственный травматизм; для Беларуси особенно важны последствия катастрофы на ЧАЭС (загрязнено около 23% территории), энергетическая зависимость от импорта и работа БелАЭС.", "Цель — сформировать у студентов знания и навыки, чтобы сохранять жизнь и здоровье в быту, на производстве и в ЧС, бережно относиться к природе и энергоресурсам.", "Задачи: научить распознавать и оценивать опасности; знать способы защиты от них; уметь оказывать первую помощь и действовать в ЧС; знать основы охраны труда и законодательства РБ; формировать экологическую культуру и навыки энергосбережения."]}, {"n": 4, "q": "Глобальные проблемы современности. Причины и предпосылки глобальных проблем.", "a": ["Глобальные проблемы — проблемы, которые касаются всего человечества, угрожают его существованию и могут быть решены только совместными усилиями всех стран.", "Основные проблемы: экологическая (загрязнение среды, изменение климата, разрушение озонового слоя); демографическая (рост населения в бедных странах и старение в развитых, в т.ч. в Беларуси); продовольственная (голод); энергетическая и сырьевая (истощение ресурсов); проблема войны и мира, терроризма; преодоление отсталости бедных стран; здоровье (эпидемии, пандемии); освоение Мирового океана и космоса.", "Причины и предпосылки: быстрый рост населения и потребления; научно-технический прогресс и рост промышленности; нерациональное использование природных ресурсов; глобализация (взаимозависимость стран); неравномерное развитие стран; гонка вооружений."]}, {"n": 5, "q": "Глобалистика. Основные пути преодоления глобальных проблем.", "a": ["Глобалистика — междисциплинарная область науки, которая изучает глобальные проблемы, их причины, взаимосвязи и пути решения. Начало положил Римский клуб (1968), доклад «Пределы роста» (1972).", "Пути преодоления: переход к устойчивому развитию (Цели устойчивого развития ООН до 2030 г.; в Беларуси — Национальная стратегия устойчивого развития); международное сотрудничество (ООН, ЮНЕП, ВОЗ, конвенции); ресурсо- и энергосбережение, развитие ВИЭ; экологически чистые технологии, безотходное производство; разоружение и мирное решение конфликтов; помощь развивающимся странам; экологическое образование и воспитание."]}, {"n": 6, "q": "Основные определения и принципы в экологии. Среда обитания. Биосфера. Техносфера. Ноосфера. Принципы взаимоотношений человека с природой. «Экологический кризис» и «Экологическая катастрофа».", "a": ["Экология — наука о взаимоотношениях живых организмов между собой и с окружающей средой (термин ввёл Э. Геккель, 1866 г.).", "Среда обитания — часть природы, которая окружает организм и влияет на него (водная, наземно-воздушная, почвенная, организменная).", "Биосфера — оболочка Земли, населённая живыми организмами (нижняя часть атмосферы, гидросфера, верхняя часть литосферы). Учение о биосфере создал В.И. Вернадский.", "Техносфера — часть биосферы, преобразованная человеком с помощью техники (города, заводы, дороги).", "Ноосфера — «сфера разума», этап развития биосферы, когда разумная деятельность человека становится главным фактором её развития.", "Принципы взаимоотношений с природой: человек — часть природы; бережное и рациональное использование ресурсов; предосторожность; «загрязнитель платит» (платность природопользования); ответственность за ущерб.", "Экологический кризис — напряжённое состояние отношений человека и природы, когда нарушается равновесие, но ситуацию ещё можно исправить.", "Экологическая катастрофа — необратимые изменения природы, приводящие к массовой гибели организмов и угрозе жизни людей (Арал, Чернобыльская зона)."]}, {"n": 7, "q": "Показатели экологического состояния окружающей среды: «Экологический рюкзак», «День экологического долга», «Индекс экологической эффективности».", "a": ["Экологический рюкзак — масса всех природных ресурсов (в кг), потраченных на производство, использование и утилизацию одного товара, за вычетом массы самого товара. Например, «рюкзак» смартфона — десятки килограммов, золотого кольца — тонны породы.", "День экологического долга (Earth Overshoot Day) — дата, когда человечество израсходовало все ресурсы, которые Земля может восстановить за год. После этого мы живём «в долг» у будущих поколений. Рассчитывает Global Footprint Network; в последние годы — конец июля – начало августа.", "Индекс экологической эффективности (EPI) — рейтинг стран по состоянию окружающей среды и экологической политике (качество воздуха и воды, биоразнообразие, климат, отходы). Составляют Йельский и Колумбийский университеты раз в 2 года; Беларусь в нём обычно в верхней половине списка."]}, {"n": 8, "q": "Основные законы экологии (по Коммонеру), их краткое толкование.", "a": ["Барри Коммонер (США, 1974 г.) сформулировал 4 закона экологии:", "— «Всё связано со всем» — в природе всё взаимосвязано, изменение одного элемента влияет на другие (осушение болот Полесья изменило водный режим и климат региона);", "— «Всё должно куда-то деваться» — ничто не исчезает бесследно, отходы просто переходят в другое место или форму;", "— «Природа знает лучше» — человек не может полностью понять природу, поэтому вмешательство в неё опасно;", "— «Ничто не даётся даром» — за всё, что мы берём у природы, приходится платить (загрязнением, затратами на очистку, здоровьем)."]}, {"n": 9, "q": "Природные условия и природные ресурсы.", "a": ["Природные условия — силы и тела природы, которые влияют на жизнь и хозяйство человека, но не используются им напрямую как сырьё: климат, рельеф, солнечный свет, геологическое строение. Беларусь: умеренно континентальный климат, равнинный рельеф, много рек, озёр и болот.", "Природные ресурсы — элементы природы, которые человек использует для своих нужд (сырьё, энергия, продукты).", "Классификация: по происхождению — минеральные, водные, земельные, биологические (лесные, животные), климатические; по исчерпаемости — исчерпаемые возобновимые (лес, вода, почва), исчерпаемые невозобновимые (нефть, газ, торф, калийные соли), неисчерпаемые (солнце, ветер); по использованию — промышленные, сельскохозяйственные, рекреационные.", "Главные ресурсы Беларуси: калийные и каменные соли, торф, лес (около 40% территории), пресная вода, плодородные земли; нефти и газа мало, поэтому большая часть энергоресурсов импортируется."]}, {"n": 10, "q": "Национальная система мониторинга окружающей среда (НСМОС).", "a": ["Мониторинг окружающей среды — система наблюдений за состоянием среды, оценки и прогноза её изменений под влиянием природных и антропогенных факторов.", "НСМОС в Республике Беларусь создана в 1993 г. Действует на основе Закона РБ «Об охране окружающей среды» и положения, утверждённого Советом Министров. Координирует Минприроды.", "Цель — обеспечить государственные органы и население достоверной информацией о состоянии окружающей среды для принятия решений.", "Виды мониторинга в составе НСМОС: земель; поверхностных вод; подземных вод; атмосферного воздуха; растительного мира; лесов; животного мира; радиационный; геофизический; озонового слоя; локальный (за источниками вредного воздействия — предприятиями) и др.", "Результаты публикуются в ежегодных бюллетенях «Состояние окружающей среды Республики Беларусь» (сайт nsmos.by)."]}, {"n": 11, "q": "Основные источники и виды загрязнения атмосферы. Приоритетные загрязнители атмосферного воздуха в Беларуси.", "a": ["Загрязнение атмосферы — поступление в воздух веществ, которых там раньше не было или их концентрация выше нормы.", "Источники: природные (вулканы, пыльные бури, лесные и торфяные пожары, пыльца); антропогенные — транспорт, энергетика (ТЭЦ, котельные), промышленность, сельское хозяйство, бытовые печи. В Беларуси главный загрязнитель — автотранспорт (больше половины всех выбросов), затем энергетика и промышленность.", "Виды загрязнения: химическое (газы и аэрозоли), физическое (шум, тепло, электромагнитное, радиоактивное), биологическое (микроорганизмы).", "Приоритетные загрязнители в Беларуси: оксид углерода (CO), оксиды азота (NOx), диоксид серы (SO2), неметановые летучие органические соединения (НМЛОС), твёрдые частицы (пыль, в т.ч. PM10, PM2,5), а также формальдегид, аммиак, бенз(а)пирен. Больше всего загрязнён воздух в крупных промышленных городах (Минск, Гомель, Могилёв, Новополоцк, Светлогорск)."]}, {"n": 12, "q": "Проблема атмосферного озона. Пути решения. Международная деятельность по защите озонового слоя. Монреальский протокол 1987г. Закон Республики Беларусь «Об охране озонового слоя».", "a": ["Озоновый слой — слой стратосферы на высоте 20–25 км с повышенной концентрацией озона (O3). Он поглощает жёсткое ультрафиолетовое излучение, которое вызывает рак кожи, катаракту, снижает иммунитет, губит растения и планктон.", "Проблема: разрушение озона веществами — фреонами (хлорфторуглеродами), галонами, бромистым метилом, которые использовались в холодильниках, кондиционерах, аэрозолях, огнетушителях. Образуются «озоновые дыры» (над Антарктидой с 1980-х гг.).", "Пути решения: отказ от озоноразрушающих веществ (ОРВ) и замена их безопасными; сбор и уничтожение старых фреонов; контроль ввоза и оборота ОРВ.", "Международная деятельность: Венская конвенция об охране озонового слоя (1985) и Монреальский протокол по веществам, разрушающим озоновый слой (1987) — графики сокращения и полного запрета производства ОРВ; Кигалийская поправка (2016) — сокращение ГФУ. 16 сентября — Международный день охраны озонового слоя. Беларусь участвует в Венской конвенции и Монреальском протоколе.", "Закон РБ «Об охране озонового слоя» регулирует обращение с ОРВ: запрещает или ограничивает их производство, ввоз и использование, вводит учёт и разрешения, обязанность сбора и обезвреживания ОРВ из старого оборудования; контроль осуществляет Минприроды."]}, {"n": 13, "q": "Электромагнитное загрязнение атмосферы. Мероприятия по снижению воздействия электромагнитного излучения на человека.", "a": ["Электромагнитное загрязнение — превышение естественного уровня электромагнитных полей (ЭМП) из-за техники.", "Источники: линии электропередачи, трансформаторы, радио- и телевышки, базовые станции мобильной связи, радары, бытовая техника (микроволновки, компьютеры, мобильные телефоны, Wi-Fi).", "Влияние на человека: головная боль, утомляемость, нарушение сна, раздражительность; при длительном воздействии — нарушения нервной, сердечно-сосудистой, иммунной и половой систем.", "Мероприятия: защита расстоянием (санитарно-защитные зоны вокруг ЛЭП и антенн); защита временем (меньше времени у техники, короче разговоры по телефону); экранирование; гигиеническое нормирование ЭМП (санитарные нормы Минздрава РБ); не ставить технику у кровати, выключать приборы из розетки, пользоваться гарнитурой."]}, {"n": 14, "q": "Парниковый эффект. Прогнозы изменения климата на Земле.", "a": ["Парниковый эффект — нагрев нижних слоёв атмосферы, потому что парниковые газы пропускают солнечный свет, но задерживают тепловое (инфракрасное) излучение Земли. Естественный парниковый эффект полезен (без него средняя температура была бы около –18 °C), но рост выбросов его усиливает.", "Парниковые газы: углекислый газ (CO2) — главный, метан (CH4), закись азота (N2O), фреоны, водяной пар. Источники: сжигание топлива, вырубка лесов, осушение болот, сельское хозяйство, свалки.", "Последствия и прогнозы: глобальное потепление (уже около +1,2 °C с доиндустриального времени); таяние ледников и подъём уровня океана; засухи, наводнения, ураганы; смещение климатических зон, угроза продовольствию.", "Для Беларуси: средняя температура выросла примерно на 1,3 °C, зимы стали мягче, чаще засухи и ураганы, сдвигаются агроклиматические зоны (на юге появилась новая, более тёплая зона), появляются новые вредители и культуры."]}, {"n": 15, "q": "Мероприятия по улучшению качества атмосферного воздуха.", "a": ["Технологические: малоотходные и безотходные технологии; переход с угля и мазута на газ и ВИЭ; повышение КПД энергоустановок.", "Технические (очистка выбросов): пылеуловители, фильтры, электрофильтры, скрубберы, каталитические нейтрализаторы на автомобилях.", "Планировочные: санитарно-защитные зоны вокруг предприятий; вынос вредных производств за город; озеленение; объездные дороги.", "Транспортные: развитие общественного и электротранспорта (в Минске — метро, электробусы), экологические классы топлива и автомобилей, велоинфраструктура.", "Организационно-правовые: нормирование выбросов, экологический налог, мониторинг воздуха, экологическая экспертиза, контроль Минприроды."]}, {"n": 16, "q": "Правовое регулирование отношений в области охраны атмосферного воздуха. Киотский протокол 1997г. Закон Республики Беларусь «Об охране атмосферного воздуха».", "a": ["Основные акты РБ: Конституция (право на благоприятную среду, ст. 46); Закон «Об охране окружающей среды» (1992); Закон «Об охране атмосферного воздуха» (2008); Закон «Об охране озонового слоя»; экологические и санитарные нормативы.", "Закон РБ «Об охране атмосферного воздуха» устанавливает: нормативы качества воздуха и допустимых выбросов; разрешения на выбросы; учёт выбросов и инвентаризацию источников; требования к транспорту и предприятиям; мониторинг; ответственность за нарушения.", "Международное регулирование: Рамочная конвенция ООН об изменении климата (1992); Киотский протокол (1997) — первые обязательства развитых стран сократить выбросы парниковых газов (в 2008–2012 гг. в среднем на 5% к уровню 1990 г.), торговля квотами; Беларусь присоединилась в 2005 г. На смену пришло Парижское соглашение (2015) — удержать потепление ниже 2 °C (желательно 1,5 °C); Беларусь ратифицировала его в 2016 г."]}, {"n": 17, "q": "Гидросфера. Проблема пресной воды в мире.", "a": ["Гидросфера — водная оболочка Земли: океаны, моря, реки, озёра, болота, подземные воды, ледники, водяной пар атмосферы.", "Около 97,5% воды — солёная, пресной только 2,5%, и большая её часть — во льдах и под землёй. Доступно для использования менее 1% всей воды.", "Проблема пресной воды: неравномерное распределение по планете; рост населения и потребления; загрязнение рек и озёр; истощение подземных вод; изменение климата (засухи). Около 2 млрд человек не имеют доступа к безопасной питьевой воде.", "Беларусь обеспечена пресной водой хорошо: более 20 тыс. рек (главные — Днепр, Западная Двина, Неман, Припять, Березина, Сож, Западный Буг), около 10–11 тыс. озёр (крупнейшее — Нарочь), большие запасы подземных вод. Питьевое водоснабжение почти полностью — из подземных вод."]}, {"n": 18, "q": "Государственный водный фонд Республики Беларусь. Мониторинг вод.", "a": ["Водный фонд — все водные объекты на территории страны. Воды в Беларуси находятся в исключительной собственности государства (Водный кодекс РБ 2014 г.).", "Состав водного фонда: поверхностные воды (реки, ручьи, каналы, озёра, водохранилища, пруды, болота) и подземные воды. В стране более 20 тыс. рек, около 10 тыс. озёр, более 150 водохранилищ.", "Мониторинг вод — часть НСМОС: мониторинг поверхностных вод (гидрохимические и гидробиологические наблюдения на реках и озёрах; ведёт Белгидромет) и мониторинг подземных вод (уровень и качество в скважинах). Оценивают содержание растворённого кислорода, органических веществ, биогенных элементов (азот, фосфор), нефтепродуктов, металлов.", "Результаты нужны для ведения государственного водного кадастра, расчёта нормативов и принятия мер по охране вод."]}, {"n": 19, "q": "Виды и источники загрязнения вод.", "a": ["Загрязнение вод — изменение состава и свойств воды, из-за которого она становится опасной или непригодной для использования.", "Виды: химическое (нефтепродукты, тяжёлые металлы, пестициды, удобрения, СПАВ); биологическое (бактерии, вирусы, яйца гельминтов); физическое — тепловое (сброс тёплых вод ТЭЦ и АЭС), радиоактивное, механическое (мусор, взвеси).", "Источники: промышленные сточные воды; коммунально-бытовые стоки городов; сельское хозяйство (смыв удобрений, ядохимикатов, навоза с полей и ферм); ливневые стоки с улиц; транспорт; свалки; атмосферные осадки.", "Последствие избытка азота и фосфора — эвтрофикация («цветение» воды), что характерно для многих рек и озёр Беларуси. В Беларуси также проблема — повышенное содержание железа в подземной воде (природного происхождения) и нитратов в шахтных колодцах."]}, {"n": 20, "q": "Нормирование качества вод разного назначения.", "a": ["Нормирование — установление предельных значений показателей, при которых вода безопасна для человека и природы.", "ПДК (предельно допустимая концентрация) — максимальное содержание вещества в воде, которое не вредит здоровью человека и водным организмам.", "Виды вод и нормативы: питьевая вода — санитарные нормы и правила Минздрава РБ (органолептические, химические, микробиологические, радиационные показатели); вода хозяйственно-питьевого и культурно-бытового назначения (купание, отдых); вода рыбохозяйственных водоёмов — самые жёсткие нормы, т.к. рыба чувствительнее человека.", "Для предприятий устанавливают нормативы допустимых сбросов (ДС) загрязняющих веществ в составе сточных вод, чтобы в водоёме не превышались ПДК."]}, {"n": 21, "q": "Способы очистки питьевой воды. Способы очистки сточных вод.", "a": ["Очистка питьевой воды (водоподготовка): отстаивание; коагуляция (добавляют вещества, которые склеивают мелкие частицы в хлопья); фильтрование через песок; обезжелезивание (в Беларуси очень актуально — построены станции обезжелезивания); обеззараживание — хлорирование, озонирование, ультрафиолет. В быту — кипячение, бытовые фильтры.", "Очистка сточных вод:", "— механическая — решётки, песколовки, отстойники (удаляют крупный мусор и взвеси);", "— химическая и физико-химическая — нейтрализация, коагуляция, флотация, адсорбция, ионный обмен;", "— биологическая — микроорганизмы разлагают органические вещества (аэротенки, биофильтры, поля фильтрации);", "— обеззараживание перед сбросом в водоём.", "Крупнейшая станция в стране — Минская очистная станция (стоки Минска очищаются и сбрасываются в р. Свислочь)."]}, {"n": 22, "q": "Охрана водных ресурсов в Республике Беларусь. Основные нормативные законодательные акты о пользовании и об охране вод.", "a": ["Охрана вод — система мер, чтобы предотвратить загрязнение, засорение и истощение водных объектов.", "Меры: строительство и модернизация очистных сооружений; нормирование сбросов; водоохранные зоны и прибрежные полосы вдоль рек и озёр (в них запрещены распашка, стоянки машин, свалки, применение удобрений); зоны санитарной охраны источников питьевой воды; учёт водопользования (счётчики); оборотное водоснабжение на заводах; мониторинг; плата (налог) за воду; планы управления речными бассейнами (Днепр, Неман, Западная Двина, Западный Буг, Припять).", "Нормативные акты: Конституция РБ; Водный кодекс РБ (2014 г.); Закон «Об охране окружающей среды»; Закон «О питьевом водоснабжении» (1999); Стратегия в области охраны и рационального использования водных ресурсов; санитарные нормы и правила. Беларусь — участница Конвенции по охране и использованию трансграничных водотоков и озёр (Хельсинки, 1992)."]}, {"n": 23, "q": "Основные функции земли. Земельный фонд Республики Беларусь.", "a": ["Функции земли: природная (основа экосистем, среда для растений и животных); пространственная (территория для размещения городов, заводов, дорог); главное средство производства в сельском и лесном хозяйстве; источник ресурсов (недра); объект собственности и недвижимости.", "Земельный фонд — все земли в пределах страны. Площадь Беларуси — около 20,76 млн га.", "Состав по видам: сельскохозяйственные земли — около 40% (пашня, луга, пастбища); лесные земли — около 43–44%; под болотами и водой — около 6%; под застройкой и дорогами; прочие.", "По категориям (Кодекс о земле): сельскохозяйственного назначения; населённых пунктов; промышленности, транспорта, связи, энергетики, обороны; природоохранного, оздоровительного, рекреационного и историко-культурного назначения; лесного фонда; водного фонда; запаса."]}, {"n": 24, "q": "Виды и источники загрязнения земель. Антропогенное загрязнение земель.", "a": ["Загрязнение земель — поступление в почву веществ, которые ухудшают её свойства и вредны для людей, растений и животных.", "Виды: химическое (тяжёлые металлы — свинец, кадмий, ртуть; нефтепродукты; пестициды; избыток удобрений); радиоактивное (в Беларуси — цезий-137 и стронций-90 после аварии на ЧАЭС); биологическое (возбудители болезней); механическое (мусор, строительные отходы).", "Антропогенное загрязнение — загрязнение из-за деятельности человека. Источники: промышленные выбросы и отходы; транспорт (вдоль дорог — свинец, нефтепродукты); сельское хозяйство (удобрения, ядохимикаты, навоз); полигоны твёрдых коммунальных отходов и стихийные свалки; отвалы горных предприятий (солеотвалы в Солигорске); аварии на нефтепроводах; военные объекты."]}, {"n": 25, "q": "Деградация земель. Опустынивание территорий. Международная деятельность по борьбе с опустыниванием земель.", "a": ["Деградация земель — ухудшение состояния и свойств земель, снижение их плодородия и хозяйственной ценности.", "Виды деградации: водная и ветровая эрозия; загрязнение; засоление; заболачивание; уплотнение почв тяжёлой техникой; деградация торфяных почв после осушения (сработка торфа, пыльные бури); нарушение земель при добыче полезных ископаемых.", "Опустынивание — деградация земель в засушливых районах из-за изменения климата и деятельности человека (перевыпас скота, вырубка, неправильное орошение). В Беларуси «пустынь» нет, но на осушенных землях Полесья появляются участки с песками.", "Международная деятельность: Конвенция ООН по борьбе с опустыниванием (1994); 17 июня — Всемирный день борьбы с опустыниванием и засухой. Беларусь присоединилась к Конвенции в 2001 г., принимает национальные планы по борьбе с деградацией земель (включая почвы)."]}, {"n": 26, "q": "Плодородие почвы. Причины снижения плодородия почв. Способы повышения плодородия почв.", "a": ["Плодородие — способность почвы обеспечивать растения водой, воздухом, питательными веществами и давать урожай. Главный показатель — содержание гумуса.", "Виды: естественное (природное), искусственное (созданное человеком), экономическое. Почвы Беларуси в основном дерново-подзолистые, кислые, бедные гумусом (в среднем 2–2,5%), есть торфяно-болотные.", "Причины снижения: эрозия; уменьшение гумуса при неправильной обработке; закисление (подкисление) почв; переуплотнение техникой; загрязнение; вынос питательных веществ урожаем без внесения удобрений; сработка торфяников.", "Способы повышения: внесение органических (навоз, компост, торф) и минеральных удобрений; известкование кислых почв (в Беларуси — обязательная мера); севооборот, посев многолетних трав и сидератов; противоэрозионные меры (лесополосы, правильная вспашка); мелиорация (осушение или орошение); охрана от загрязнения."]}, {"n": 27, "q": "Рациональное использование земель.", "a": ["Рациональное использование земель — использование земли по назначению, эффективно и так, чтобы сохранить и улучшить её плодородие и не навредить природе.", "Основные направления: использовать земли строго по целевому назначению; защищать лучшие сельхозземли от застройки; севообороты, научно обоснованные нормы удобрений, известкование; противоэрозионная организация территории; повторное использование нарушенных земель после рекультивации; вовлечение неиспользуемых земель в оборот; экологически обоснованная мелиорация (без чрезмерного осушения); точное (цифровое) земледелие.", "В Беларуси за этим следят Госкомимущество (землеустройство и земельный кадастр) и Минприроды; основа — Кодекс о земле."]}, {"n": 28, "q": "Проблема торфа в Беларуси. Рациональное использование торфа в Республике Беларусь.", "a": ["Торф — органическая порода, которая образуется в болотах из неполностью разложившихся остатков растений. Беларусь — одна из самых «болотных» стран Европы: торфяники когда-то занимали около 14% территории.", "Проблема: в XX веке около половины торфяников было осушено для сельского хозяйства и добычи торфа. Последствия: сработка (исчезновение) торфяного слоя, пыльные бури, торфяные пожары, выбросы CO2, исчезновение редких видов, понижение уровня грунтовых вод, ухудшение климата Полесья.", "Рациональное использование: добыча только на уже осушенных и разработанных участках; использование торфа как местного топлива (торфобрикеты), удобрения, сырья для химии и медицины; повторное заболачивание выработанных и деградированных торфяников (проекты при поддержке ПРООН, ГЭФ); сохранение естественных болот (Ольманские болота, Ельня, Званец и др.).", "Основа — Схема распределения торфяников по направлениям использования и Стратегия сохранения и рационального (устойчивого) использования торфяников."]}, {"n": 29, "q": "Охрана земель. Виды мониторинга земель.", "a": ["Охрана земель — комплекс мер по защите земель от деградации, загрязнения, нерационального использования и восстановлению их плодородия.", "Меры: противоэрозионные мероприятия; рекультивация нарушенных земель; защита от загрязнения отходами и химикатами; сохранение плодородного слоя при строительстве; известкование и удобрения; борьба с заболачиванием и зарастанием; ответственность землепользователей.", "Мониторинг земель (часть НСМОС) — система наблюдений за состоянием земель. Виды:", "— наблюдения за состоянием земель (эрозия, заболачивание, зарастание кустарником);", "— наблюдения за химическим загрязнением земель (тяжёлые металлы, нефтепродукты, пестициды — в городах, у предприятий, вдоль дорог);", "— наблюдения за радиоактивным загрязнением земель;", "— агрохимическое обследование сельхозземель (кислотность, гумус, фосфор, калий)."]}, {"n": 30, "q": "Основные нормативные законодательные акты о пользовании и об охране земли. Кодекс Республики Беларусь о земле.", "a": ["Основные акты: Конституция РБ (земля — основа жизни и деятельности народа); Кодекс РБ о земле (2008 г., ред. 2022 г.); Закон «Об охране окружающей среды»; Закон «Об обращении с отходами»; Закон «О правовом режиме территорий, подвергшихся радиоактивному загрязнению в результате катастрофы на ЧАЭС»; указы Президента об изъятии и предоставлении земельных участков.", "Кодекс о земле регулирует: категории и виды земель; формы собственности (земли в основном государственные, частная собственность граждан — только на участки для жилья, дачи, огорода); права и обязанности землепользователей (использовать по назначению, сохранять плодородие, не загрязнять); порядок изъятия и предоставления участков; охрану земель; землеустройство, земельный кадастр и мониторинг; ответственность за нарушения."]}, {"n": 31, "q": "Лес. Роль леса в жизнедеятельности человека. Лесные ресурсы.", "a": ["Лес — природный комплекс с преобладанием деревьев, а также кустарников, трав, животных и микроорганизмов, тесно связанных между собой.", "Роль леса: экологическая — производит кислород, поглощает CO2, очищает воздух, регулирует климат и водный режим рек, защищает почву от эрозии, дом для животных; экономическая — древесина, топливо, грибы, ягоды, лекарственные растения, охота; социальная — отдых, здоровье, туризм, культура.", "Лесные ресурсы Беларуси: лесистость около 40% (более 8 млн га) — одна из самых высоких в Европе. Основные породы — сосна (около 50%), берёза, ель, ольха, дуб. Самые большие массивы — Беловежская пуща, Налибокская пуща, Полесье. Леса — главный возобновляемый природный ресурс страны."]}, {"n": 32, "q": "Лесной фонд. Лесоустройство. Лесоразведение. Лесовосстановление.", "a": ["Лесной фонд — все леса и лесные земли страны (покрытые и не покрытые лесом: вырубки, гари, а также нелесные земли в лесах). В Беларуси леса находятся в исключительной собственности государства; управляет ими Минлесхоз через лесхозы.", "По назначению леса делятся на природоохранные, рекреационно-оздоровительные, защитные и эксплуатационные.", "Лесоустройство — система мер по учёту, оценке и планированию использования лесов (инвентаризация, лесные карты, лесоустроительные проекты на 10 лет).", "Лесоразведение — создание новых лесов на землях, где леса раньше не было (на неудобных, выработанных, загрязнённых землях).", "Лесовосстановление — восстановление леса на вырубках, гарях, погибших участках: естественное (самосев) и искусственное (посадка саженцев). В Беларуси ежегодно восстанавливают десятки тысяч гектаров леса; проходит акция «Неделя леса»."]}, {"n": 33, "q": "Экологические проблемы лесов в мире и в Республике Беларусь.", "a": ["В мире: массовая вырубка тропических лесов (Амазония, Африка, Юго-Восточная Азия); лесные пожары; кислотные дожди; изменение климата; сокращение биоразнообразия. Ежегодно исчезает около 10 млн га леса.", "В Беларуси: усыхание ельников и сосняков из-за засух, потепления и вредителей (короеды-типографы, верхушечный короед); последствия ураганов (буреломы, ветровалы); лесные и торфяные пожары; радиоактивное загрязнение лесов после ЧАЭС (около 20% лесного фонда загрязнено, ограничения на сбор грибов, ягод, древесины); загрязнение возле городов и дорог; браконьерство и незаконные рубки; замусоривание.", "Решения: санитарные рубки, защита от вредителей, противопожарные меры, посадка более устойчивых пород (дуб, лиственница), радиационный контроль лесной продукции."]}, {"n": 34, "q": "Законодательная база лесопользования. Лесной кодекс.", "a": ["Основные акты: Конституция РБ; Лесной кодекс РБ (2015 г.); Закон «Об охране окружающей среды»; Закон «Об особо охраняемых природных территориях»; Закон «О растительном мире»; правила рубок, отпуска древесины, пожарной безопасности в лесах.", "Лесной кодекс регулирует: собственность на леса (только государственная); деление лесов на категории; виды лесопользования — заготовка древесины, живицы, второстепенных лесных ресурсов (пни, кора), побочное пользование (грибы, ягоды, сено), охота, научные и рекреационные цели; права граждан свободно бесплатно находиться в лесах и собирать грибы и ягоды для себя; лесоустройство, лесовосстановление, охрану и защиту лесов; ответственность за нарушения."]}, {"n": 35, "q": "Особо охраняемые природные территории Республики Беларусь. Заповедники и национальные парки, их задачи.", "a": ["ООПТ — территории с особым режимом охраны для сохранения природных комплексов, редких видов, ландшафтов. Основа — Закон РБ «Об особо охраняемых природных территориях». ООПТ занимают около 9% территории Беларуси.", "Виды ООПТ: заповедники, национальные парки, заказники (республиканского и местного значения), памятники природы.", "Заповедники (2): Березинский биосферный заповедник; Полесский государственный радиационно-экологический заповедник. Задачи: полное сохранение природных комплексов в естественном состоянии, научные исследования, мониторинг. Хозяйственная деятельность запрещена.", "Национальные парки (4): «Беловежская пуща» (объект Всемирного наследия ЮНЕСКО), «Браславские озёра», «Нарочанский», «Припятский». Задачи: охрана природы + экологический туризм и отдых, экологическое просвещение, научные исследования. Есть функциональные зоны: заповедная, регулируемого использования, рекреационная, хозяйственная."]}, {"n": 36, "q": "Красная книга Республики Беларусь. Функции Красной книги Республики Беларусь.", "a": ["Красная книга РБ — официальный государственный документ со сведениями о редких и находящихся под угрозой исчезновения видах диких животных, дикорастущих растений, грибов и лишайников. Первое издание — 1981 г.; переиздаётся примерно раз в 10 лет. Действует 5-е издание (2025 г.): 523 вида — 213 видов животных и 310 видов растений (добавлено 55 новых видов, исключено 38 — их популяции восстановились).", "Категории охраны: I — находящиеся на грани исчезновения (критически угрожаемые); II — исчезающие; III — уязвимые; IV — потенциально уязвимые; также выделяют исчезнувшие (0).", "Примеры: зубр, бурый медведь, рысь, барсук, европейская норка, чёрный аист, вертлявая камышовка, венерин башмачок, ятрышники.", "Функции: учёт и оценка состояния редких видов; правовая основа для их охраны (запрет добычи, уничтожения, торговли, ответственность); основа для создания ООПТ и программ восстановления видов; научная и просветительская функция."]}, {"n": 37, "q": "Основные направления программы «Охрана окружающей среды и устойчивое использование природных ресурсов на 2021-2025 годы».", "a": ["Государственная программа утверждена постановлением Совета Министров РБ от 19.02.2021 № 99, заказчик — Минприроды. Цель — улучшение состояния окружающей среды, рациональное (устойчивое) использование природных ресурсов.", "Программа включает 6 подпрограмм (это и есть основные направления):", "— «Недра Беларуси» — изучение недр, поиск и разведка полезных ископаемых;", "— «Гидрометеорологическая деятельность, охрана природных ресурсов в условиях изменения климата» — прогнозы погоды, смягчение изменения климата и адаптация к нему;", "— «Обращение со стойкими органическими загрязнителями» — безопасное хранение и уничтожение СОЗ (старые пестициды, ПХБ);", "— «Сохранение и устойчивое использование биологического и ландшафтного разнообразия» — развитие ООПТ, охрана редких видов, восстановление болот;", "— «Национальная система мониторинга окружающей среды»;", "— «Функционирование системы охраны окружающей среды» — контроль, экологическое просвещение, международное сотрудничество.", "Среди мероприятий — разработка планов управления бассейнами рек Неман и Западная Двина. Сейчас её продолжает новая программа на 2026–2030 годы."]}, {"n": 38, "q": "Основные проблемы продовольственной безопасности.", "a": ["Продовольственная безопасность — состояние, при котором государство гарантирует всем людям физическую и экономическую доступность безопасных и качественных продуктов в количестве, нужном для здоровой жизни.", "Проблемы в мире: голод и недоедание (около 700–800 млн человек); рост населения; деградация и сокращение сельхозземель; изменение климата (засухи, неурожаи); нехватка воды; зависимость бедных стран от импорта; войны и рост цен; потери и выбрасывание продуктов (около 1/3 всей еды).", "В Беларуси: страна сама себя обеспечивает основными продуктами (мясо, молоко, картофель, зерно, овощи) и экспортирует молочную и мясную продукцию. Главные задачи — устойчивость сельского хозяйства к погоде, качество и безопасность продуктов, контроль радиоактивного загрязнения продукции, доступность цен. Основа — Доктрина национальной продовольственной безопасности РБ до 2030 г."]}, {"n": 39, "q": "Качество и безопасность продуктов питания", "a": ["Качество продуктов — совокупность свойств (вкус, пищевая ценность, свежесть, внешний вид), которые удовлетворяют потребности человека.", "Безопасность продуктов — отсутствие вредного воздействия на здоровье при обычном употреблении (нет опасных уровней токсинов, пестицидов, нитратов, тяжёлых металлов, радионуклидов, микробов).", "Опасные вещества в пище: остатки пестицидов и нитратов; тяжёлые металлы; антибиотики и гормоны в мясе; пищевые добавки (Е) в избытке; ГМО (требуют маркировки); микотоксины (плесень); радионуклиды (цезий-137, стронций-90 — актуально для грибов, ягод, дичи, молока из загрязнённых районов Беларуси).", "Контроль в РБ: Закон «О качестве и безопасности продовольственного сырья и пищевых продуктов для жизни и здоровья человека»; технические регламенты ЕАЭС; санитарные нормы Минздрава; радиационный контроль (нормы РДУ-99); Госстандарт, санэпидслужба. Продукция маркируется знаками соответствия (ЕАС)."]}, {"n": 40, "q": "Культура питания. Основные принципы рационального питания.", "a": ["Культура питания — знания, привычки и правила о том, что, сколько, когда и как есть, чтобы сохранять здоровье.", "Рациональное питание — питание, сбалансированное по энергии и веществам с учётом возраста, пола, нагрузки и здоровья.", "Принципы:", "— энергетический баланс — калорийность пищи равна затратам энергии (не переедать и не голодать);", "— сбалансированность — белки : жиры : углеводы примерно 1 : 1 : 4, достаточно витаминов, минералов, воды, клетчатки;", "— режим питания — 3–5 раз в день в одно и то же время, ужин за 2–3 ч до сна; распределение: завтрак ~25–30%, обед ~35–40%, ужин ~20–25%, перекусы;", "— разнообразие — овощи, фрукты, крупы, молочные продукты, рыба, мясо, бобовые;", "— меньше соли, сахара, жареного, фастфуда; больше овощей и фруктов (не менее 400 г в день);", "— безопасность и качество продуктов."]}, {"n": 41, "q": "Экологические аспекты питания. Международная маркировка пластиковой посуды и упаковки.", "a": ["Экологические аспекты питания: продукты могут содержать вредные вещества из загрязнённой среды (нитраты, пестициды, тяжёлые металлы, радионуклиды); упаковка и посуда влияют на здоровье и создают отходы; производство еды (особенно мяса) даёт большую нагрузку на природу. Экологичный подход — местные сезонные продукты, меньше упаковки, многоразовая посуда, без пищевых отходов.", "Маркировка пластика — треугольник из стрелок с цифрой (код переработки):", "— 1 PET (ПЭТ) — бутылки для воды, напитков; одноразово, не нагревать;", "— 2 HDPE (ПНД) — бутылки для молока, канистры, флаконы; относительно безопасен;", "— 3 PVC (ПВХ) — трубы, плёнки; для пищи опасен (хлор, фталаты);", "— 4 LDPE (ПВД) — пакеты, плёнки; относительно безопасен;", "— 5 PP (ПП) — контейнеры, крышки, посуда для СВЧ; один из самых безопасных, выдерживает нагрев;", "— 6 PS (ПС) — одноразовая посуда, пенопласт; при нагреве выделяет стирол — горячее не класть;", "— 7 OTHER (O) — прочие (поликарбонат, может содержать бисфенол А).", "Значок «бокал и вилка» — пригодно для пищевых продуктов; «снежинка» — для заморозки; «волны» — для СВЧ."]}, {"n": 42, "q": "Способы утилизации пластиковых отходов. Какие типы пластиковых отходов перерабатываются Беларуси?", "a": ["Способы утилизации пластика:", "— захоронение на полигонах — самый плохой путь, пластик разлагается сотни лет;", "— сжигание (с получением энергии) — уменьшает объём, но даёт вредные выбросы (диоксины), нужна сложная очистка;", "— механическая переработка (рециклинг) — сортировка, мойка, дробление, получение гранул или флекса и выпуск новых изделий;", "— химическая переработка (пиролиз) — получение топлива и химического сырья;", "— повторное использование, сокращение использования (многоразовые сумки, бутылки) и биоразлагаемые материалы.", "В Беларуси: действует система раздельного сбора (контейнеры для пластика, стекла, бумаги), координирует ГУ «Оператор вторичных материальных ресурсов». В основном перерабатываются: ПЭТ (1) — бутылки (в волокно, флекс, ленту); ПНД/HDPE (2) и ПВД/LDPE (4) — флаконы, канистры, плёнки, пакеты (в трубы, мешки, плёнку); ПП (5) — ящики, крышки. Хуже перерабатываются ПВХ (3), ПС (6) и смешанные пластики (7)."]}, {"n": 43, "q": "Влияние неблагоприятных факторов окружающей среды на здоровье человека.", "a": ["По оценкам ВОЗ, здоровье человека примерно на 50% зависит от образа жизни, на 20% — от окружающей среды, на 20% — от наследственности, на 10% — от медицины.", "Неблагоприятные факторы и их влияние:", "— загрязнение воздуха — болезни органов дыхания (астма, бронхит), сердечно-сосудистые болезни, аллергии, рак лёгких;", "— загрязнение воды — кишечные инфекции, болезни почек и печени; избыток железа или нитратов в воде (проблема Беларуси) — заболевания ЖКТ, у детей — метгемоглобинемия; недостаток йода — болезни щитовидной железы (в Беларуси — йодированная соль);", "— загрязнение почвы и пищи — отравления, накопление тяжёлых металлов, пестицидов;", "— радиация (последствия ЧАЭС, радон) — рак щитовидной железы, лейкозы, ослабление иммунитета;", "— шум, вибрация, электромагнитные поля — стресс, нарушения сна, нервной системы, слуха;", "— изменение климата — тепловые удары, новые инфекции (клещевые болезни, болезнь Лайма)."]}, {"n": 44, "q": "Виды энергии. Энергетика. Энергосистема.", "a": ["Энергия — общая мера различных форм движения материи, способность совершать работу.", "Виды энергии: механическая (кинетическая и потенциальная), тепловая, электрическая, химическая, ядерная (атомная), электромагнитная (световая, солнечная), гравитационная. По источникам: первичная (в природных ресурсах — топливо, ветер, солнце, вода) и вторичная (после преобразования — электричество, тепло, бензин).", "Энергетика — отрасль экономики, которая занимается получением, переработкой, передачей и использованием энергии. Включает электроэнергетику и теплоэнергетику, топливную промышленность.", "Энергосистема — совокупность электростанций, котельных, электрических и тепловых сетей, связанных общим режимом работы и единым управлением. Белорусская энергосистема — ГПО «Белэнерго»: 6 областных РУП-облэнерго, крупнейшие электростанции — Белорусская АЭС, Лукомльская ГРЭС, Березовская ГРЭС, Минские ТЭЦ; связана с энергосистемой России."]}, {"n": 45, "q": "Недра. Минерально-сырьевые ресурсы республики Беларусь", "a": ["Недра — часть земной коры под почвенным слоем (а где его нет — под поверхностью земли и дном водоёмов), доступная для изучения и использования. В Беларуси недра — исключительная собственность государства (Кодекс о недрах).", "Минерально-сырьевые ресурсы Беларуси (более 30 видов, около 4 тыс. месторождений):", "— горючие: нефть (Речицкое и др. месторождения в Гомельской обл., добыча около 1,7–2 млн т в год), попутный газ, торф, бурый уголь, горючие сланцы (Любанское, Туровское);", "— горно-химические: калийные соли (Старобинское — Солигорск, «Беларуськалий»; Петриковское, Нежинское) — Беларусь в числе мировых лидеров по калийным удобрениям; каменная соль (Мозырь, Старобин);", "— строительные: песок, гравий, глины, мел, доломит (Витебская обл.), цементное сырьё (Костюковичи, Кричев, Волковыск), строительный камень (Микашевичи — гранит);", "— металлические руды: железные руды (Околовское, Новосёлковское) — пока не разрабатываются;", "— подземные пресные и минеральные воды, сапропели."]}, {"n": 46, "q": "Топливно-энергетический комплекс (ТЭК).", "a": ["ТЭК — совокупность отраслей, которые добывают, перерабатывают, транспортируют и распределяют топливо и энергию.", "Состав ТЭК Беларуси:", "— топливная промышленность: нефтедобыча (ПО «Белоруснефть»), нефтепереработка (НПЗ в Новополоцке — «Нафтан» и в Мозыре), торфяная промышленность (торфобрикетные заводы);", "— газовая отрасль: ОАО «Газпром трансгаз Беларусь», ГПО «Белтопгаз» — транспорт и распределение газа;", "— электроэнергетика и теплоэнергетика — ГПО «Белэнерго» (АЭС, ГРЭС, ТЭЦ, котельные, сети);", "— трубопроводный транспорт (нефтепроводы «Дружба», газопроводы «Ямал–Европа»).", "Управляет ТЭК Министерство энергетики. Особенность: страна обеспечивает себя собственными ресурсами лишь на ~15–16%, основа топливного баланса — импортный природный газ из России; с вводом БелАЭС зависимость от газа снижается."]}, {"n": 47, "q": "Топливно-энергетические ресурсы Республики Беларусь. Условное топливо. Энергоемкость валового внутреннего продукта.", "a": ["ТЭР — все виды энергоносителей и энергии, которые используются или могут быть использованы в хозяйстве (нефть, газ, уголь, торф, дрова, электро- и теплоэнергия, ВИЭ).", "Собственные ТЭР Беларуси: нефть (~1,7–2 млн т/год), попутный газ, торф, древесное топливо (дрова, щепа, отходы лесозаготовок), бурый уголь и горючие сланцы (не добываются), ВИЭ (ветер, солнце, вода, биогаз). Своими ресурсами покрывается лишь около 15–16% потребности, остальное — импорт (газ и нефть из России).", "Условное топливо — единица для сравнения разных видов топлива. 1 кг условного топлива (у.т.) имеет теплоту сгорания 7000 ккал (29,3 МДж). Например, 1 т нефти ≈ 1,43 т у.т., 1 тыс. м³ газа ≈ 1,15 т у.т., 1 т дров ≈ 0,27–0,35 т у.т.", "Энергоёмкость ВВП — количество энергоресурсов, потраченных на производство единицы ВВП (т у.т. или кг н.э. на 1 млн руб. или 1000 долл.). Показывает, насколько эффективно экономика использует энергию. С 1990-х гг. энергоёмкость ВВП Беларуси снизилась более чем в 2,5 раза, но всё ещё выше, чем в развитых странах ЕС; задача — сблизить её со среднемировым уровнем."]}, {"n": 48, "q": "Традиционная энергетика и ее характеристика. Перспективы развития в мире и в Республике Беларусь. Эколого-экономические проблемы традиционной энергетики.", "a": ["Традиционная энергетика — получение энергии на тепловых (ТЭС), гидро- (ГЭС) и атомных (АЭС) электростанциях из невозобновляемого топлива и крупных рек.", "ТЭС (ТЭЦ, ГРЭС, котельные) работают на газе, мазуте, угле, торфе. В мире дают около 60% электроэнергии. В Беларуси до ввода БелАЭС почти вся электроэнергия производилась на ТЭС на природном газе (крупнейшие — Лукомльская и Березовская ГРЭС, Минские ТЭЦ).", "ГЭС используют энергию воды. В Беларуси равнинные реки — потенциал мал; есть Гродненская, Полоцкая и Витебская ГЭС и малые ГЭС.", "Перспективы: в мире — снижение доли угля, переход на газ, АЭС и ВИЭ; в Беларуси — модернизация ТЭС (парогазовые установки с высоким КПД), снижение доли газа за счёт БелАЭС и местных видов топлива.", "Проблемы: исчерпаемость ресурсов; зависимость от импорта и цен на газ; выбросы CO2, SO2, NOx, пыли (парниковый эффект, кислотные дожди); тепловое загрязнение водоёмов; отходы (зола, шлаки); у ГЭС — затопление земель, нарушение жизни рек."]}, {"n": 49, "q": "Нетрадиционная (альтернативная) энергетика и ее характеристика, перспективы ее развития в Республике Беларусь. Эколого-экономические проблемы нетрадиционной энергетики.", "a": ["Нетрадиционная (альтернативная) энергетика — получение энергии из возобновляемых источников (ВИЭ): солнца, ветра, малых рек, биомассы, тепла земли.", "Виды и перспективы в Беларуси:", "— солнечная — фотоэлектрические станции (крупная — в Речице, около 55 МВт; много станций в Брестской, Гомельской, Минской обл.); солнечных дней мало, но технология дешевеет;", "— ветровая — выявлено более 1800 площадок, пригодных для ветроустановок (в основном возвышенности на северо-западе), ветропарки в Новогрудском районе, Лиозно и др.;", "— гидроэнергетика — малые ГЭС и средние ГЭС на Немане и Западной Двине;", "— биоэнергетика — древесное топливо, биогаз (свинокомплексы, полигоны, очистные сооружения), рапсовое масло;", "— геотермальная — тепловые насосы.", "Доля ВИЭ в потреблении ТЭР — около 7–8%. Основа — Закон РБ «О возобновляемых источниках энергии» (2010).", "Проблемы: высокая стоимость оборудования; непостоянство работы (зависит от погоды), нужны резервные мощности и накопители; низкая плотность энергии, нужны большие площади; шум и гибель птиц у ветряков; утилизация солнечных панелей и аккумуляторов."]}, {"n": 50, "q": "Атомная энергетика. Атомные электростанции. Перспективы строительства. Эколого-экономические проблемы атомной энергетики.", "a": ["Атомная энергетика — получение тепла и электроэнергии за счёт управляемой цепной реакции деления ядер урана-235 (или плутония) в ядерном реакторе.", "АЭС: в реакторе выделяется тепло → нагревается вода → пар крутит турбину → генератор даёт электроэнергию. В мире около 440 реакторов, дают ~10% электроэнергии; лидеры — США, Франция, Китай, Россия.", "Белорусская АЭС — в Островецком районе Гродненской обл., 2 энергоблока по 1200 МВт (проект «АЭС-2006», реакторы ВВЭР-1200 поколения «3+», строил «Росатом»). 1-й блок введён в 2021 г., 2-й — в 2023 г. Даёт около 1/3–40% электроэнергии страны, замещает около 4,5 млрд м³ газа в год. Обсуждается строительство третьего энергоблока или второй АЭС.", "Плюсы: нет выбросов CO2 и дыма, мало топлива, стабильная выработка, снижение зависимости от газа.", "Проблемы: риск тяжёлых аварий (Чернобыль 1986, Фукусима 2011); радиоактивные отходы и отработанное топливо (хранение тысячи лет); тепловое загрязнение водоёмов (БелАЭС — река Вилия); дорогое строительство и вывод из эксплуатации; угроза терроризма; недоверие населения."]}, {"n": 51, "q": "Биоэнергетика. Использование энергии биомассы в мире и в Республике Беларусь.", "a": ["Биоэнергетика — получение энергии из биомассы (органических веществ растительного и животного происхождения).", "Виды биомассы и биотоплива: твёрдое — дрова, щепа, пеллеты, брикеты, солома, отходы деревообработки; жидкое — биодизель (из рапса), биоэтанол (из кукурузы, сахарного тростника); газообразное — биогаз (из навоза, пищевых отходов, осадков сточных вод, газ свалок).", "В мире: биомасса — крупнейший возобновляемый источник энергии; лидеры по биотопливу — США, Бразилия (биоэтанол), страны ЕС (Швеция, Финляндия — древесное топливо).", "В Беларуси: древесное топливо — главный вид ВИЭ (основная доля всех ВИЭ); построены сотни мини-ТЭЦ и котельных на щепе и дровах (Вилейская, Пружанская, Осиповичская и др.), заводы по выпуску пеллет и топливной щепы; работают биогазовые комплексы на свинокомплексах и птицефабриках (агрокомбинат «Снов» и др.), на полигонах ТКО (Минск — «Тростенецкий», «Северный»), на очистных сооружениях Минска; рапсовое биодизельное топливо.", "Плюсы: возобновляемо, местное, уменьшает отходы; минусы: выбросы при сжигании, нужна большая площадь заготовки."]}, {"n": 52, "q": "Дать определения: энергетическая самостоятельность, энергетическая безопасность, энергетический кризис. Энергосберегающая технология.", "a": ["Энергетическая самостоятельность (независимость) — способность страны обеспечивать себя энергией в основном за счёт собственных ресурсов и не зависеть от одного поставщика. Для Беларуси — увеличение доли местных ТЭР и ВИЭ, БелАЭС, диверсификация поставок.", "Энергетическая безопасность — состояние защищённости граждан, экономики и государства от угроз дефицита энергии, когда обеспечивается надёжное и бесперебойное снабжение энергоресурсами по приемлемым ценам. В РБ — Концепция энергетической безопасности Республики Беларусь (2015, до 2035 г.).", "Энергетический кризис — ситуация, когда спрос на энергоресурсы значительно превышает предложение: резкий рост цен, дефицит топлива, перебои в энергоснабжении (например, нефтяной кризис 1973 г., энергокризис в Европе 2021–2022 гг.).", "Энергосберегающая технология — технология, которая позволяет производить продукцию или услугу с меньшими затратами энергии (энергоэффективные двигатели, светодиодное освещение, тепловые насосы, утепление зданий, рекуперация тепла, частотные регуляторы)."]}, {"n": 53, "q": "Основные задачи Комплексного плана развития электроэнергетической сферы до 2025 года с учетом ввода Белорусской атомной электростанции.", "a": ["Комплексный план утверждён постановлением Совета Министров РБ (2016 г.). Цель — эффективно встроить БелАЭС в энергосистему и использовать её электроэнергию.", "Основные задачи:", "— интеграция БелАЭС в объединённую энергосистему (новые ЛЭП, подстанции, усиление сетей);", "— строительство пиково-резервных источников и электрокотлов на ТЭЦ и котельных для регулирования нагрузки (балансирования);", "— вывод из работы старых неэффективных мощностей;", "— увеличение потребления электроэнергии: электроотопление и горячее водоснабжение (особенно в новом жилье), электрокотлы в промышленности, электротранспорт (электробусы, электрозаправки, электрификация железной дороги);", "— снижение потребления импортного природного газа;", "— стимулирующие тарифы (дифференцированные по времени суток) для потребителей;", "— повышение надёжности и снижение потерь в сетях."]}, {"n": 54, "q": "Энергосбережение. Необходимость энергосбережения в Республике Беларусь. Приоритетные направления энергосбережения (из Государственной программы «Энергосбережение» на 2021–2025 гг.)", "a": ["Энергосбережение — организационная, научная, практическая, информационная деятельность, направленная на рациональное использование и экономное расходование ТЭР (Закон РБ «Об энергосбережении»).", "Необходимость для Беларуси: мало собственных энергоресурсов (около 15% потребности) и большая зависимость от импорта газа и нефти; высокие затраты на энергию в себестоимости продукции; энергоёмкость ВВП выше, чем в развитых странах; экология (меньше топлива — меньше выбросов).", "ГП «Энергосбережение» на 2021–2025 гг. (постановление СМ от 24.02.2021 № 103) состоит из 2 подпрограмм: «Повышение энергоэффективности» и «Развитие использования местных ТЭР, в том числе ВИЭ». Цели: экономия ТЭР 2,5–3 млн т у.т.; доля местных ТЭР не менее 16,1%; доля ВИЭ 7–8%; сближение энергоёмкости ВВП со среднемировым уровнем.", "Приоритетные направления: внедрение энергоэффективных технологий, оборудования и материалов; модернизация энергоисточников (парогазовые установки); строительство источников на местных ТЭР (древесное топливо, торф, горючие отходы); использование ВИЭ; снижение потерь в тепловых и электрических сетях; тепловая модернизация жилых домов; энергоэффективное освещение; использование электроэнергии БелАЭС для отопления; учёт и регулирование потребления."]}, {"n": 55, "q": "Энергосбережение в быту.", "a": ["На быт приходится около 1/4–1/3 всех энергоресурсов страны, поэтому каждая семья может экономить.", "Электроэнергия: светодиодные лампы (в 8–10 раз экономичнее ламп накаливания); техника класса энергоэффективности А и выше; выключать свет и приборы из розетки (режим ожидания тоже тратит энергию); загружать стиральную и посудомоечную машину полностью; размораживать холодильник и не ставить его рядом с плитой; использовать посуду по размеру конфорки, закрывать крышкой; двухтарифный счётчик (ночью дешевле).", "Тепло: утепление окон и дверей, стеклопакеты; не закрывать батареи шторами и мебелью; отражающие экраны за радиаторами; терморегуляторы на батареях; проветривать коротко и интенсивно, а не держать форточку открытой.", "Вода: счётчики воды; душ вместо ванны; исправные краны и бачки; экономные насадки.", "Также: поквартирный учёт тепла, тепловая модернизация домов, солнечные коллекторы и тепловые насосы в частных домах
