<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Билеты">
<meta name="theme-color" content="#F5F5F7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="format-detection" content="telephone=no">
<title>Билеты к экзаменам</title>
<style>
/* Layout idea: iOS stack navigation. Grouped light screens, floating Liquid Glass bars, reading screen on pure white. */
:root{
  --bg:#FFFFFF; --bg2:#F5F5F7; --card:#FFFFFF; --text:#1D1D1F; --text2:#86868B; --sep:#E5E5EA; --accent:#FF2D55;
  --accent-tint:rgba(255,45,85,.10); --fill:rgba(118,118,128,.12); --press:#EEEEF1;
  --ok:#34C759; --ok-text:#248A3D; --ok-tint:#E8F7EC; --star:#FF9F0A; --danger:#FF3B30;
  --font:-apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", "Segoe UI", Roboto, system-ui, sans-serif;
  --fs-large:2rem; --fs-t1:1.647rem; --fs-t2:1.294rem; --fs-t3:1.176rem; --fs-body:1rem; --fs-callout:.941rem;
  --fs-sub:.882rem; --fs-foot:.765rem; --fs-cap:.706rem;
  --r-card:20px; --r-group:16px; --r-btn:14px; --r-field:12px;
  --ease:cubic-bezier(.32,.72,0,1); --spring:cubic-bezier(.34,1.36,.64,1);
  --shadow-1:0 1px 2px rgba(0,0,0,.035), 0 2px 10px rgba(0,0,0,.03);
  --shadow-glass:0 10px 34px rgba(0,0,0,.10), 0 1px 3px rgba(0,0,0,.05);
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  --reading:1;
  --tile:#F2F2F5; --track:#EDEDF0; --chev:#C4C4C9; --thumb:#FFFFFF; --field-focus:#FFFFFF; --mark:rgba(255,204,0,.32);
  --glass-a:rgba(255,255,255,.80); --glass-b:rgba(255,255,255,.62); --glass-hi:rgba(255,255,255,.95); --glass-edge:rgba(255,255,255,.6); --glass-border:rgba(0,0,0,.06);
  --sheet:rgba(250,250,252,.88); --backdrop:rgba(0,0,0,.2); --switch-off:#E9E9EB; --tbm:rgba(0,0,0,.05);
  --scr-g:245,245,247; --scr-p:255,255,255; --dark:0;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]):not([data-mode="light"]){
    --bg:#000000; --bg2:#000000; --card:#1C1C1E; --text:#F5F5F7; --text2:#98989D; --sep:#38383A; --accent:#FF375F;
    --accent-tint:rgba(255,55,95,.20); --fill:rgba(118,118,128,.24); --press:#2C2C2E; --ok:#30D158; --star:#FF9F0A; --danger:#FF453A;
    --tile:#2C2C2E; --track:#2C2C2E; --chev:#5A5A5F; --thumb:#636366; --field-focus:#1C1C1E; --mark:rgba(255,214,10,.30);
    --glass-a:rgba(58,58,60,.72); --glass-b:rgba(36,36,38,.62); --glass-hi:rgba(255,255,255,.12); --glass-edge:rgba(255,255,255,.06); --glass-border:rgba(255,255,255,.08);
    --sheet:rgba(28,28,30,.90); --backdrop:rgba(0,0,0,.5); --switch-off:#39393D; --tbm:rgba(255,255,255,.08);
    --shadow-1:none; --shadow-glass:0 10px 34px rgba(0,0,0,.55), 0 1px 3px rgba(0,0,0,.4);
    --scr-g:0,0,0; --scr-p:0,0,0; --dark:1; color-scheme:dark;
  }
}
:root[data-theme="dark"]:not([data-mode="light"]),:root[data-mode="dark"]{
  --bg:#000000; --bg2:#000000; --card:#1C1C1E; --text:#F5F5F7; --text2:#98989D; --sep:#38383A; --accent:#FF375F;
  --accent-tint:rgba(255,55,95,.20); --fill:rgba(118,118,128,.24); --press:#2C2C2E; --ok:#30D158; --star:#FF9F0A; --danger:#FF453A;
  --tile:#2C2C2E; --track:#2C2C2E; --chev:#5A5A5F; --thumb:#636366; --field-focus:#1C1C1E; --mark:rgba(255,214,10,.30);
  --glass-a:rgba(58,58,60,.72); --glass-b:rgba(36,36,38,.62); --glass-hi:rgba(255,255,255,.12); --glass-edge:rgba(255,255,255,.06); --glass-border:rgba(255,255,255,.08);
  --sheet:rgba(28,28,30,.90); --backdrop:rgba(0,0,0,.5); --switch-off:#39393D; --tbm:rgba(255,255,255,.08);
  --shadow-1:none; --shadow-glass:0 10px 34px rgba(0,0,0,.55), 0 1px 3px rgba(0,0,0,.4);
  --scr-g:0,0,0; --scr-p:0,0,0; --dark:1; color-scheme:dark;
}
html{font-size:17px}
@supports (font:-apple-system-body){html{font:-apple-system-body}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg2);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{display:block;flex:none}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ico.f{fill:currentColor;stroke:none}

#app{position:fixed;inset:0;overflow:hidden}
#stage{position:absolute;inset:0;overflow:hidden}

/* Screens */
.screen{position:absolute;inset:0;background:var(--bg2);--scr:var(--scr-g);will-change:transform}
.screen.white{background:var(--bg);--scr:var(--scr-p)}
.scroller{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
.content{max-width:720px;margin:0 auto;
  padding:calc(var(--sat) + 56px) calc(20px + var(--sar)) calc(var(--sab) + 110px) calc(20px + var(--sal));
  display:flex;flex-direction:column}

/* Transitions */
.screen{transition:transform .5s var(--ease), opacity .3s ease}
.screen.enter-push{transform:translateX(100%);z-index:3;box-shadow:-12px 0 36px rgba(0,0,0,.07)}
.screen.enter-push.run{transform:none}
.screen.leave-push.run{transform:translateX(-26%)}
.screen.leave-push::after,.screen.enter-pop::after{content:"";position:absolute;inset:0;background:#000;opacity:0;transition:opacity .5s var(--ease);pointer-events:none}
.screen.leave-push.run::after{opacity:.05}
.screen.enter-pop{transform:translateX(-26%)}
.screen.enter-pop::after{opacity:.05}
.screen.enter-pop.run{transform:none}
.screen.enter-pop.run::after{opacity:0}
.screen.leave-pop{z-index:3;box-shadow:-12px 0 36px rgba(0,0,0,.07)}
.screen.leave-pop.run{transform:translateX(100%)}
.screen.enter-next{transform:translateX(100%)} .screen.enter-next.run{transform:none}
.screen.leave-next.run{transform:translateX(-100%)}
.screen.enter-prev{transform:translateX(-100%)} .screen.enter-prev.run{transform:none}
.screen.leave-prev.run{transform:translateX(100%)}
.screen.enter-tab{opacity:0} .screen.enter-tab.run{opacity:1}
.screen.leave-tab{z-index:0} .screen.leave-tab.run{opacity:0}

.content>*{animation:rise .5s var(--ease) both}
.content>*:nth-child(2){animation-delay:.03s}.content>*:nth-child(3){animation-delay:.06s}
.content>*:nth-child(4){animation-delay:.09s}.content>*:nth-child(5){animation-delay:.12s}
.content>*:nth-child(n+6){animation-delay:.15s}
.quiet .content>*{animation:none}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* Navigation bar */
.navbar{position:absolute;left:0;right:0;top:0;z-index:5;height:calc(var(--sat) + 54px);
  padding:calc(var(--sat) + 5px) calc(12px + var(--sar)) 5px calc(12px + var(--sal));
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;pointer-events:none}
.navbar::before{content:"";position:absolute;inset:0 0 -18px 0;z-index:-1;opacity:0;transition:opacity .25s ease;
  background:linear-gradient(to bottom, rgba(var(--scr),.94) 0%, rgba(var(--scr),.80) 70%, rgba(var(--scr),0) 100%);
  -webkit-backdrop-filter:blur(14px) saturate(170%);backdrop-filter:blur(14px) saturate(170%);
  -webkit-mask-image:linear-gradient(to bottom,#000 72%,transparent);mask-image:linear-gradient(to bottom,#000 72%,transparent)}
.navbar.scrolled::before{opacity:1}
.nb-left{justify-self:start;display:flex}.nb-right{justify-self:end;display:flex}
.nb-title{font-size:var(--fs-body);font-weight:600;letter-spacing:-.01em;opacity:0;transform:translateY(4px);
  transition:opacity .2s ease, transform .3s var(--ease);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52vw}
.navbar.scrolled .nb-title{opacity:1;transform:none}
.navbar button,.navbar .pill{pointer-events:auto}

.glass{background:linear-gradient(180deg,var(--glass-a),var(--glass-b));
  -webkit-backdrop-filter:blur(22px) saturate(185%);backdrop-filter:blur(22px) saturate(185%);
  box-shadow:var(--shadow-glass), inset 0 1px 0 var(--glass-hi), inset 0 0 0 .5px var(--glass-edge);
  border:.5px solid var(--glass-border)}
.circle-btn{width:44px;height:44px;border-radius:22px;display:grid;place-items:center;color:var(--text);
  transition:transform .25s var(--ease)}
.circle-btn:active{transform:scale(.9)}
.pill{display:flex;align-items:center;height:44px;border-radius:22px;padding:0 4px}
.pill button{height:44px;min-width:42px;padding:0 9px;display:grid;place-items:center;color:var(--text);border-radius:22px;
  transition:transform .25s var(--ease), color .2s}
.pill button:active{transform:scale(.88)}
.pill .aa{font-size:var(--fs-body);font-weight:600;letter-spacing:-.02em}
.pill .on{color:var(--star)}

/* Type */
.large{font-size:min(var(--fs-large),44px);font-weight:700;line-height:1.12;letter-spacing:-.01em;margin:0 0 6px;text-wrap:balance}
.meta{font-size:var(--fs-sub);color:var(--text2);margin:0 0 18px;font-variant-numeric:tabular-nums}
.sec{font-size:var(--fs-t3);font-weight:650;letter-spacing:-.01em;margin:30px 0 12px;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.sec small{font-size:var(--fs-foot);font-weight:500;color:var(--text2);font-variant-numeric:tabular-nums}
.note{font-size:var(--fs-foot);color:var(--text2);text-align:center;margin:28px 0 0;line-height:1.4}

/* Cards */
.card{display:block;width:100%;background:var(--card);border-radius:var(--r-card);box-shadow:var(--shadow-1);padding:18px 18px 18px 18px;
  transition:transform .3s var(--ease), box-shadow .3s ease}
.press:active{transform:scale(.975)}
.cards{display:grid;gap:12px}
@media (min-width:640px){.cards{grid-template-columns:1fr 1fr}}

.resume{display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px 14px}
.eyebrow{font-size:var(--fs-foot);font-weight:600;color:var(--accent);letter-spacing:.01em;grid-column:1}
.r-title{font-size:var(--fs-t2);font-weight:700;letter-spacing:-.01em;grid-column:1;font-variant-numeric:tabular-nums}
.r-q{font-size:var(--fs-sub);color:var(--text2);line-height:1.35;grid-column:1/-1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.r-go{grid-column:2;grid-row:1/3;width:46px;height:46px;border-radius:23px;background:var(--accent);color:#fff;display:grid;place-items:center;
  box-shadow:0 6px 16px rgba(255,45,85,.30)}

.quick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.qa{padding:16px;border-radius:18px;display:flex;flex-direction:column;gap:10px;min-height:112px}
.qa .qi{width:36px;height:36px;border-radius:12px;display:grid;place-items:center}
.qa b{font-size:var(--fs-callout);font-weight:600;letter-spacing:-.01em;margin-top:auto}
.qa span{font-size:var(--fs-foot);color:var(--text2);margin-top:-6px;font-variant-numeric:tabular-nums}

.subj{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;padding:18px}
.s-icon{width:50px;height:50px;border-radius:15px;display:grid;place-items:center}
.s-icon .ico{width:26px;height:26px}
.s-title{font-size:var(--fs-t3);font-weight:650;letter-spacing:-.01em;line-height:1.2;display:block}
.s-meta{font-size:var(--fs-sub);color:var(--text2);display:block;margin-top:3px;font-variant-numeric:tabular-nums}
.chev{color:var(--chev)}
.chev .ico{width:18px;height:18px;stroke-width:2.2}
.s-prog{grid-column:1/-1;display:flex;align-items:center;gap:12px;margin-top:2px}
.bar{flex:1;height:6px;border-radius:3px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--c,var(--accent));transition:width .7s var(--ease)}
.s-pct{font-size:var(--fs-foot);color:var(--text2);font-variant-numeric:tabular-nums;white-space:nowrap}

/* Subject header progress */
.hprog{display:flex;align-items:center;gap:12px;margin:-6px 0 18px}

/* Fields */
.field{display:flex;align-items:center;gap:8px;height:42px;padding:0 10px 0 12px;border-radius:var(--r-field);background:var(--fill);
  color:var(--text2);transition:background .2s ease, box-shadow .2s ease}
.field:focus-within{background:var(--field-focus);box-shadow:0 0 0 1px rgba(255,45,85,.40), 0 0 0 4px rgba(255,45,85,.14)}
.field .ico{width:19px;height:19px}
.field input{flex:1;min-width:0;border:0;background:none;outline:none;color:var(--text);font:inherit;font-size:max(16px,var(--fs-body));height:100%;
  -webkit-appearance:none;appearance:none}
.field input::placeholder{color:var(--text2)}
.field input::-webkit-search-cancel-button{display:none}
.clear{width:28px;height:28px;display:grid;place-items:center;color:#AEAEB2}
.clear .ico{width:18px;height:18px}
.clear[hidden]{display:none}

/* Segmented */
.seg{position:relative;display:grid;grid-template-columns:repeat(var(--n),1fr);padding:2px;border-radius:10px;background:var(--fill);margin:12px 0 16px}
.seg::before{content:"";position:absolute;top:2px;bottom:2px;left:2px;width:calc((100% - 4px)/var(--n));border-radius:8px;background:var(--thumb);
  box-shadow:0 3px 8px rgba(0,0,0,.10), 0 1px 1px rgba(0,0,0,.04);transform:translateX(calc(var(--i)*100%));transition:transform .35s var(--ease)}
.seg button{position:relative;height:32px;font-size:var(--fs-foot);font-weight:600;text-align:center;border-radius:8px;white-space:nowrap;
  display:flex;align-items:center;justify-content:center;gap:5px;color:var(--text)}
.seg button small{font-size:var(--fs-cap);font-weight:500;color:var(--text2);font-variant-numeric:tabular-nums}

/* Lists */
.group{background:var(--card);border-radius:var(--r-group);box-shadow:var(--shadow-1);overflow:hidden}
.row{position:relative;display:flex;align-items:center;gap:13px;width:100%;min-height:64px;padding:11px 14px 11px 14px;transition:background .3s ease}
.row:active{background:var(--press);transition:none}
.row+.row::before{content:"";position:absolute;top:0;left:63px;right:0;height:.5px;background:var(--sep)}
.num{width:36px;height:36px;border-radius:11px;background:var(--tile);display:grid;place-items:center;font-size:var(--fs-callout);font-weight:650;
  font-variant-numeric:tabular-nums;flex:none;transition:background .3s, color .3s}
.num.ok{background:var(--ok-tint);color:var(--ok-text)}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.row-q{font-size:var(--fs-callout);line-height:1.34;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row-sub{font-size:var(--fs-foot);line-height:1.38;color:var(--text2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row-acc{display:flex;align-items:center;gap:6px;flex:none}
.row-acc .st{color:var(--star)} .row-acc .st .ico{width:16px;height:16px}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:10px}
.tile{position:relative;aspect-ratio:1;border-radius:15px;background:var(--card);box-shadow:var(--shadow-1);display:grid;place-items:center;
  font-size:var(--fs-t3);font-weight:650;font-variant-numeric:tabular-nums;transition:transform .25s var(--ease), background .3s}
.tile:active{transform:scale(.92)}
.tile.ok{background:var(--ok-tint);color:var(--ok-text);box-shadow:none}
.tile.cur{box-shadow:inset 0 0 0 2px var(--accent);color:var(--accent)}
.tile .dot{position:absolute;top:7px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--star)}
.sheet .tile{background:var(--tile);box-shadow:none}
.sheet .tile.ok{background:var(--ok-tint)}
.sheet .tile.cur{box-shadow:inset 0 0 0 2px var(--accent)}

/* Empty */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:48px 24px;gap:8px}
.empty .ei{width:64px;height:64px;border-radius:32px;background:var(--fill);display:grid;place-items:center;color:var(--text2);margin-bottom:8px}
.empty .ei .ico{width:30px;height:30px}
.empty b{font-size:var(--fs-body);font-weight:600}
.empty p{margin:0;font-size:var(--fs-sub);color:var(--text2);line-height:1.4;max-width:290px}

/* Ticket */
.t-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.t-num{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px 0 13px;border-radius:16px;background:var(--bg2);
  font-size:var(--fs-sub);font-weight:600;font-variant-numeric:tabular-nums;transition:transform .25s var(--ease)}
.t-num:active{transform:scale(.95)}
.t-num .t-of{color:var(--text2);font-weight:500}
.t-num .ico{width:14px;height:14px;stroke-width:2.4;color:var(--text2)}
.chip-ok{display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 12px 0 9px;border-radius:16px;background:var(--ok-tint);color:var(--ok-text);
  font-size:var(--fs-sub);font-weight:600;animation:pop .45s var(--spring)}
.chip-ok .ico{width:17px;height:17px}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.t-q{font-size:min(var(--fs-t1),34px);font-weight:700;line-height:1.22;letter-spacing:-.015em;margin:0 0 22px;text-wrap:pretty}
.t-q.long{font-size:min(var(--fs-t2),27px);line-height:1.28}
.rule{height:.5px;background:var(--sep);margin:0 0 22px}
.answer-wrap{position:relative}
.answer{font-size:calc(var(--fs-body) * var(--reading));line-height:1.56;display:flex;flex-direction:column;gap:.8em;
  transition:filter .45s var(--ease), opacity .45s;max-width:68ch}
.answer p{margin:0}
.answer b{font-weight:600}
.answer .ah{font-weight:650;margin-top:.35em;letter-spacing:-.01em}
.answer ul,.answer ol{list-style:none;margin:-.3em 0 0;padding:0;display:flex;flex-direction:column;gap:.5em}
.answer ul li{position:relative;padding-left:1.15em}
.answer ul li::before{content:"";position:absolute;left:.2em;top:.66em;width:.36em;height:.36em;border-radius:50%;background:var(--accent);opacity:.75}
.answer ol{counter-reset:n}
.answer ol li{position:relative;padding-left:1.6em;counter-increment:n}
.answer ol li::before{content:counter(n);position:absolute;left:0;top:.1em;width:1.25em;height:1.25em;border-radius:50%;background:var(--accent-tint);
  color:var(--accent);font-size:.78em;font-weight:700;display:grid;place-items:center;line-height:1;font-variant-numeric:tabular-nums}
.veiled .answer{filter:blur(9px);opacity:.5;user-select:none;pointer-events:none}
.reveal{position:absolute;left:50%;top:84px;transform:translateX(-50%);height:50px;padding:0 22px;border-radius:25px;display:flex;align-items:center;gap:8px;
  font-size:var(--fs-body);font-weight:600;color:var(--accent);white-space:nowrap;transition:transform .25s var(--ease)}
.reveal:active{transform:translateX(-50%) scale(.95)}
.t-eyebrow{margin:0 0 10px;font-size:var(--fs-sub);font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}
.t-eyebrow span{color:var(--text2);font-weight:500}
.found{margin:0 0 10px 4px;font-size:var(--fs-foot);color:var(--text2);font-variant-numeric:tabular-nums}
.t-src{font-size:var(--fs-foot);color:var(--text2);margin:30px 0 0}

/* Floating bars */
.tabbar,.toolbar{position:absolute;z-index:20;left:50%;transform:translateX(-50%);bottom:max(12px, calc(var(--sab) - 6px))}
.tabbar{width:min(380px, calc(100% - 32px));height:64px;border-radius:32px;display:grid;grid-template-columns:repeat(3,1fr);padding:4px;
  transition:transform .5s var(--ease), opacity .35s ease}
.tabbar.hide{transform:translate(-50%,160%);opacity:0;pointer-events:none}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:28px;color:var(--text);
  font-size:10.5px;font-weight:600;letter-spacing:.01em;transition:background .3s ease, color .3s ease, transform .25s var(--ease)}
.tab .ico{width:24px;height:24px}
.tab.on{color:var(--accent);background:rgba(0,0,0,.055)}
.tab:active{transform:scale(.92)}
.toolbar{width:min(440px, calc(100% - 24px));height:64px;border-radius:32px;display:flex;gap:6px;padding:7px}
.tb-btn{width:66px;height:50px;border-radius:25px;display:flex;align-items:center;justify-content:center;gap:2px;color:var(--accent);
  font-size:var(--fs-sub);font-weight:600;font-variant-numeric:tabular-nums;transition:transform .25s var(--ease), background .2s}
.tb-btn:active{transform:scale(.9);background:var(--tbm)}
.tb-btn:disabled{opacity:.28;pointer-events:none}
.tb-main{flex:1;height:50px;border-radius:25px;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--tbm);
  color:var(--text);font-size:var(--fs-callout);font-weight:600;white-space:nowrap;overflow:hidden;
  transition:transform .3s var(--spring), background .3s ease, color .3s ease}
.tb-main:active{transform:scale(.96)}
.tb-main.done{background:var(--ok);color:#fff;box-shadow:0 6px 16px rgba(52,199,89,.28)}
.fab{position:absolute;z-index:20;right:calc(16px + var(--sar));bottom:max(16px, calc(var(--sab) + 2px));height:52px;border-radius:26px;padding:0 20px 0 16px;
  display:flex;align-items:center;gap:8px;color:var(--accent);font-size:var(--fs-callout);font-weight:600;transition:transform .3s var(--ease)}
.fab:active{transform:scale(.93)}

/* Sheets */
#sheets{position:absolute;inset:0;z-index:50;pointer-events:none}
#sheets.open{pointer-events:auto}
.backdrop{position:absolute;inset:0;background:var(--backdrop);opacity:0;transition:opacity .4s ease}
#sheets.show .backdrop{opacity:1}
.sheet{position:absolute;left:8px;right:8px;bottom:max(8px, calc(var(--sab) - 18px));max-width:560px;margin:0 auto;max-height:84%;overflow-y:auto;
  border-radius:34px;padding:8px 16px 20px;transform:translateY(calc(100% + 40px));transition:transform .5s var(--ease);
  background:var(--sheet)}
#sheets.show .sheet{transform:none}
.sheet.dragging{transition:none}
.grabber{width:38px;height:5px;border-radius:3px;background:var(--chev);margin:0 auto 6px}
.sh-head{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;margin-bottom:12px}
.sh-head h3{margin:0;text-align:center;font-size:var(--fs-body);font-weight:600}
.sh-x{width:36px;height:36px;border-radius:18px;background:var(--fill);display:grid;place-items:center;color:var(--text2);justify-self:end}
.sh-x .ico{width:16px;height:16px;stroke-width:2.4}
.sheet .group{box-shadow:none;margin-bottom:12px}
.srow{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:56px;padding:10px 16px;width:100%;position:relative}
.srow+.srow::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.srow .lbl{display:flex;flex-direction:column;gap:2px;font-size:var(--fs-body)}
.srow .lbl small{font-size:var(--fs-foot);color:var(--text2)}
.srow.danger{justify-content:center;color:var(--danger);font-weight:500}
.srow.danger:active{background:var(--press)}
.switch{width:51px;height:31px;border-radius:16px;background:var(--switch-off);position:relative;flex:none;transition:background .3s ease}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;
  box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.06);transition:transform .35s var(--spring)}
.switch.on{background:var(--ok)} .switch.on::after{transform:translateX(20px)}
.stepper{display:flex;align-items:center;gap:4px;background:var(--fill);border-radius:12px;padding:3px}
.stepper button{width:44px;height:34px;border-radius:9px;display:grid;place-items:center;font-weight:600}
.stepper button:active{background:var(--thumb)}
.stepper .sm{font-size:13px}.stepper .lg{font-size:21px}
.dots{display:flex;gap:5px;padding:0 4px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--chev);transition:background .2s}
.dots i.on{background:var(--accent)}
.seg.mini{margin:0;width:228px}
.srow.col{flex-direction:column;align-items:stretch;gap:10px}
.srow.col .seg.mini{width:100%}
.add{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:14px;padding:18px;background:transparent;box-shadow:none;
  border:1.5px dashed var(--chev)}
.add-i{width:50px;height:50px;border-radius:15px;display:grid;place-items:center;background:var(--accent-tint);color:var(--accent)}
.imp-sum{display:flex;align-items:center;gap:14px;padding:6px 4px 18px}
.imp-n{min-width:56px;height:56px;padding:0 10px;border-radius:16px;background:var(--accent-tint);color:var(--accent);display:grid;place-items:center;
  font-size:var(--fs-t2);font-weight:700;font-variant-numeric:tabular-nums}
.imp-sum b{display:block;font-size:var(--fs-body);font-weight:600}
.imp-sum span{display:block;font-size:var(--fs-foot);color:var(--text2);margin-top:2px;font-variant-numeric:tabular-nums}
.lbl-up{display:block;font-size:var(--fs-foot);color:var(--text2);margin:0 4px 6px}
.sheet-field{background:var(--card);margin-bottom:14px}
.sheet-field.err{box-shadow:0 0 0 1.5px var(--danger)}
.imp-prev{margin-bottom:16px}
.imp-prev .srow{justify-content:flex-start;gap:12px;min-height:52px}
.imp-prev .srow+.srow::before{left:62px}
.btn.primary{background:var(--accent);color:#fff}
.confirm p{margin:0 4px 18px;font-size:var(--fs-sub);color:var(--text2);text-align:center;line-height:1.45}
.btn{display:flex;align-items:center;justify-content:center;width:100%;height:52px;border-radius:var(--r-btn);font-size:var(--fs-body);font-weight:600;
  transition:transform .25s var(--ease)}
.btn:active{transform:scale(.97)}
.btn+.btn{margin-top:10px}
.btn.destr{background:rgba(255,59,48,.12);color:var(--danger)}
.btn.plain{background:var(--fill);color:var(--text)}

/* Toast */
.toast{position:absolute;z-index:60;left:50%;bottom:calc(max(12px, calc(var(--sab) - 6px)) + 76px);transform:translate(-50%,14px);opacity:0;padding:11px 18px;border-radius:22px;
  font-size:var(--fs-sub);font-weight:500;white-space:nowrap;transition:transform .45s var(--spring), opacity .25s ease;pointer-events:none}
.toast.show{transform:translate(-50%,0);opacity:1}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
@media (min-width:900px){.content{padding-top:calc(var(--sat) + 72px)}}
</style>

<script id="data" type="application/json">[{"id": "econ", "title": "Экономическая теория", "short": "Экон. теория", "icon": "chart", "color": "#FF2D55", "tickets": [{"n": 1, "q": "Предмет и функции экономической теории. Разделы экономической теории. Экономические категории. Экономические законы.", "a": ["Предмет: экономическая теория изучает, как общество использует ограниченные ресурсы, чтобы производить блага, распределять их и потреблять для удовлетворения потребностей.", "Функции: познавательная (объясняет экономические явления); практическая (основа экономической политики); методологическая (база для других экономических наук — менеджмента, маркетинга, финансов); прогностическая (помогает предвидеть развитие экономики).", "Разделы: микроэкономика — поведение потребителей, фирм, отдельных рынков; макроэкономика — экономика страны в целом (ВВП, инфляция, безработица); мировая экономика — отношения между странами.", "Экономические категории — научные понятия, которые отражают экономические явления: товар, деньги, цена, прибыль, капитал.", "Экономические законы — устойчивые, повторяющиеся причинно-следственные связи между экономическими явлениями (закон спроса, закон предложения). Бывают общие (действуют во всех системах) и специфические (только в определённых условиях)."]}, {"n": 2, "q": "Методы экономической науки. Использование общенаучных, математических, статистических методов. Экономическое моделирование. Экономический эксперимент.", "a": ["Общенаучные методы: научная абстракция (убираем второстепенное, оставляем главное); анализ (разделение на части) и синтез (соединение в целое); индукция (от фактов к выводу) и дедукция (от общего к частному); исторический и логический методы; системный подход. Используется принцип «при прочих равных условиях».", "Математические методы: формулы, уравнения, графики, экономико-математические модели.", "Статистические методы: сбор и обработка данных, средние величины, индексы, группировки, корреляция.", "Экономическое моделирование — упрощённое описание реальной экономики (словами, графиком или формулой), чтобы её анализировать и прогнозировать. Примеры: модель спроса и предложения, кривая производственных возможностей.", "Экономический эксперимент — проверка идеи (гипотезы) на практике в контролируемых условиях: лабораторный, полевой; в масштабе страны — реформы в отдельном регионе, свободные экономические зоны."]}, {"n": 3, "q": "Потребности как предпосылка производства. Классификация потребностей. Закон возвышения потребностей.", "a": ["Потребности — нужда в чём-то необходимом для жизни и развития человека, фирмы, общества. Люди производят блага, чтобы удовлетворить потребности, поэтому потребности — отправная точка производства. В то же время производство создаёт новые потребности.", "Классификация: по субъекту — личные, коллективные, общественные; по объекту — материальные и духовные; по значению — первичные (еда, одежда, жильё) и вторичные (образование, отдых, культура). Иерархия потребностей А. Маслоу (5 уровней): физиологические → безопасность → социальные (принадлежность) → уважение → самореализация.", "Закон возвышения потребностей: с развитием общества и производства потребности растут и становятся сложнее; удовлетворённые потребности сменяются новыми. Поэтому потребности безграничны, а ресурсы ограничены."]}, {"n": 4, "q": "Ресурсы (факторы) производства. Классификация и характеристики ресурсов. Ограниченность ресурсов.", "a": ["Ресурсы — всё, что можно использовать для производства благ.", "Классификация: природные (земля, вода, полезные ископаемые); материальные (здания, оборудование, сырьё); трудовые (люди трудоспособного возраста); финансовые (деньги); информационные.", "Факторы производства (то, что реально участвует в производстве): труд, земля, капитал, предпринимательские способности; сейчас часто добавляют информацию. Каждый фактор приносит доход: труд — заработную плату, земля — ренту, капитал — процент, предпринимательство — прибыль.", "Характеристики ресурсов: ограниченность, взаимозаменяемость, возможность разного (альтернативного) использования, мобильность.", "Ограниченность ресурсов — ресурсов не хватает, чтобы удовлетворить все потребности. Она бывает абсолютной (на все потребности сразу ресурсов не хватает никогда) и относительной (на отдельные цели хватает). Отсюда проблема выбора."]}, {"n": 5, "q": "Проблема выбора в экономике. Производственные возможности общества и их границы. Вмененные издержки.", "a": ["Из-за ограниченности ресурсов любое общество решает три вопроса: что производить, как производить и для кого производить.", "Кривая производственных возможностей (КПВ) — график, который показывает все сочетания двух товаров, которые можно произвести при полном и эффективном использовании ресурсов и данной технологии. Точки на кривой — эффективное производство; точки внутри — ресурсы используются не полностью; точки за кривой — недостижимы. Граница сдвигается вправо при росте ресурсов и новых технологиях.", "Вмененные (альтернативные) издержки — ценность лучшей альтернативы, от которой отказались. Например, количество одного товара, которым нужно пожертвовать, чтобы произвести ещё одну единицу другого.", "Закон возрастающих вмененных издержек: чем больше производим одного товара, тем больше приходится отказываться от другого. Поэтому КПВ выпуклая (выгнута наружу)."]}, {"n": 6, "q": "Экономическая система общества. Критерии выделения экономических систем.", "a": ["Экономическая система — совокупность взаимосвязанных элементов и отношений, которые обеспечивают производство, распределение, обмен и потребление благ в обществе.", "Критерии выделения систем: форма собственности на ресурсы; способ координации экономики (рынок, план, традиции); роль государства; механизм принятия экономических решений.", "Типы (современный подход): традиционная (основана на обычаях); командная (плановая) — государственная собственность и централизованный план; рыночная — частная собственность, свободная конкуренция, цены формирует рынок; смешанная — сочетание рынка и государственного регулирования (большинство стран сегодня).", "Другие подходы: формационный (К. Маркс — первобытнообщинная, рабовладельческая, феодальная, капиталистическая, коммунистическая формации) и цивилизационный / технологический (доиндустриальное, индустриальное, постиндустриальное общество)."]}, {"n": 7, "q": "Собственность: понятие, эволюция. Формы и типы собственности.", "a": ["Собственность — отношения между людьми по поводу присвоения благ и ресурсов. С юридической стороны включает три правомочия: владение (фактическое обладание), пользование (извлечение полезных свойств), распоряжение (право решать судьбу вещи — продать, подарить).", "Эволюция: в первобытном обществе — общинная собственность; затем появилась частная; в XX веке развились государственная и смешанные формы; сегодня распространено разделение собственности и управления (акционерные общества).", "Типы: частная и общественная (государственная).", "Формы: индивидуальная, коллективная (партнёрская, кооперативная, акционерная), государственная, смешанная.", "В Республике Беларусь, по Конституции (ст. 13), собственность может быть государственной и частной. Государственная собственность — республиканская и коммунальная."]}, {"n": 8, "q": "Натуральное хозяйство: исторические границы, особенности, современные проявления.", "a": ["Натуральное хозяйство — форма хозяйства, при которой продукты производят для собственного потребления, а не для продажи и обмена.", "Исторические границы: преобладало в первобытном обществе, при рабовладельческом строе и феодализме; постепенно вытеснялось товарным хозяйством, особенно с развитием промышленности.", "Особенности: замкнутость (хозяйство обеспечивает себя само); прямая связь «производство — потребление» без рынка; универсальный ручной труд; примитивная техника; низкая производительность; медленное развитие.", "Современные проявления: личные подсобные хозяйства, дачные участки, домашний труд (готовка, уборка, ремонт своими силами); в некоторых бедных регионах мира натуральное хозяйство сохраняется как основное."]}, {"n": 9, "q": "Рыночное (товарное) хозяйство: условия развития, виды, особенности.", "a": ["Товарное (рыночное) хозяйство — форма хозяйства, при которой продукты производят для продажи и обмена на рынке, а не для себя.", "Условия возникновения: общественное разделение труда (люди специализируются на разных видах работы); экономическая обособленность производителей (частная собственность — каждый сам решает, что производить и кому продавать).", "Виды: простое товарное хозяйство — мелкие производители (ремесленники, крестьяне) работают сами, своим трудом; развитое (капиталистическое) — используется наёмный труд, товаром становится и рабочая сила.", "Особенности: открытость, связь между производителями через рынок, обмен через деньги (купля-продажа), конкуренция, свобода выбора, цена складывается под влиянием спроса и предложения, высокая эффективность и быстрое развитие.", "Товар — продукт труда, произведённый для обмена. Свойства товара: потребительная стоимость (полезность) и стоимость (меновая стоимость)."]}, {"n": 10, "q": "Рынок: понятие, функции.", "a": ["Рынок — система экономических отношений между продавцами и покупателями по поводу купли-продажи товаров и услуг; механизм, который сводит вместе спрос и предложение.", "Условия существования рынка: разделение труда, обособленность производителей, свобода предпринимательства, конкуренция, свободные цены.", "Функции рынка:", "— ценообразующая — цена складывается из спроса и предложения;", "— информационная — цены показывают, что и сколько нужно производить;", "— регулирующая — рынок перераспределяет ресурсы между отраслями;", "— посредническая — связывает производителей и потребителей;", "— стимулирующая — конкуренция заставляет снижать затраты и внедрять новое;", "— санирующая (оздоровительная) — неэффективные фирмы уходят с рынка, остаются сильные.", "Виды рынков: по объекту — рынок товаров и услуг, рынок факторов производства (труда, капитала, земли), финансовый рынок; по территории — местный, национальный, мировой; по уровню конкуренции — совершенная конкуренция, монополистическая конкуренция, олигополия, монополия."]}, {"n": 11, "q": "Модели рыночной экономики. Либеральная модель рынка. Социально ориентированная модель. Национальные модели рыночных систем. Особенности белорусской национальной модели.", "a": ["Модель рыночной экономики — конкретный вариант устройства рынка в стране с учётом её истории, традиций и роли государства.", "Либеральная (американская) модель: главная роль у частной собственности и свободной конкуренции; государство вмешивается минимально; поддержка предпринимательства; социальная защита ниже, сильнее разница в доходах. Примеры: США, Великобритания.", "Социально ориентированная модель: рынок сочетается с активной социальной политикой государства; высокие налоги, сильная социальная защита, меньше неравенство. Примеры: Германия (социальное рыночное хозяйство), Швеция (шведская модель).", "Другие национальные модели: японская (тесная связь государства и корпораций, пожизненный наём, долгосрочное планирование); китайская (рыночный социализм — рынок при ведущей роли государства и компартии).", "Белорусская модель — социально ориентированная рыночная экономика: многообразие форм собственности при сильной роли государственного сектора; активное госрегулирование; эволюционный путь реформ; социальные гарантии; ориентация на экспорт и интеграцию с Россией и ЕАЭС."]}, {"n": 12, "q": "Спрос. Зависимость величины спроса от цены. График функции спроса. Закон спроса. Неценовые факторы спроса.", "a": ["Спрос — желание и возможность покупателей купить товар по определённой цене в определённое время. Величина спроса — количество товара, которое покупатели готовы купить по данной цене.", "Зависимость от цены обратная: чем выше цена, тем меньше покупают, и наоборот.", "Закон спроса: при прочих равных условиях величина спроса уменьшается при росте цены и увеличивается при снижении цены. Причины: эффект дохода (при снижении цены человек может купить больше на те же деньги) и эффект замещения (дешёвый товар заменяет дорогие аналоги), а также закон убывающей предельной полезности.", "График спроса (кривая D): по вертикали — цена (P), по горизонтали — количество (Q); кривая идёт вниз слева направо. Изменение цены — движение по кривой.", "Неценовые факторы (сдвигают всю кривую): доходы покупателей; цены на товары-заменители и дополняющие товары; вкусы и мода; ожидания (цен, доходов); количество покупателей; реклама; сезон. Рост спроса — кривая сдвигается вправо, снижение — влево.", "Исключения: парадокс Гиффена, эффект Веблена (престижные товары)."]}, {"n": 13, "q": "Предложение. Зависимость величины предложения от цены. График функции предложения. Закон предложения. Неценовые факторы предложения.", "a": ["Предложение — желание и возможность продавцов продать товар по определённой цене в определённое время. Величина предложения — количество товара, которое продавцы готовы продать по данной цене.", "Зависимость от цены прямая: чем выше цена, тем больше товара предлагают.", "Закон предложения: при прочих равных условиях величина предложения растёт при росте цены и снижается при снижении цены. Причина: высокая цена даёт больше прибыли, производители расширяют выпуск, приходят новые фирмы.", "График предложения (кривая S): по вертикали — цена (P), по горизонтали — количество (Q); кривая идёт вверх слева направо. Изменение цены — движение по кривой.", "Неценовые факторы (сдвигают кривую): цены на ресурсы (сырьё, энергия, зарплата); технологии; налоги и субсидии; цены на другие товары; ожидания производителей; количество продавцов; природные условия. Рост предложения — сдвиг вправо, снижение — влево."]}, {"n": 14, "q": "Рыночное равновесие. Цена рыночного равновесия. График, отражающий состояние рыночного равновесия.", "a": ["Рыночное равновесие — ситуация, когда величина спроса равна величине предложения (Qd = Qs): сколько товара хотят купить, столько и хотят продать.", "Равновесная цена (Pe) — цена, при которой спрос равен предложению. Равновесное количество (Qe) — объём продаж при этой цене.", "График: на одном графике строят кривую спроса D (вниз) и кривую предложения S (вверх). Точка их пересечения E — точка равновесия, она даёт Pe и Qe.", "Если цена выше равновесной — предложение больше спроса, возникает избыток (излишек) товара, продавцы снижают цену. Если цена ниже равновесной — спрос больше предложения, возникает дефицит, цена растёт. Так рынок сам возвращается к равновесию.", "Изменение равновесия: рост спроса → цена и количество растут; рост предложения → цена падает, количество растёт.", "Если государство фиксирует цену: «потолок» цены ниже равновесной вызывает дефицит, «пол» цены выше равновесной — излишки."]}, {"n": 15, "q": "Понятие фирмы. Цели и функции фирмы. Организационно-правовые формы предприятий в Республике Беларусь.", "a": ["Фирма (предприятие, организация) — самостоятельный хозяйствующий субъект, который производит товары или услуги и продаёт их, чтобы получить прибыль. Юридическое лицо имеет обособленное имущество, отвечает по своим обязательствам, может от своего имени заключать договоры.", "Цели: главная — получение максимальной прибыли; также рост доли рынка, выживание и устойчивость, рост стоимости фирмы, социальные цели.", "Функции: производственная; коммерческая (закупки и сбыт); финансовая; инновационная; социальная (рабочие места, зарплата); управленческая.", "Организационно-правовые формы в Республике Беларусь (по Гражданскому кодексу):", "— коммерческие организации: хозяйственные товарищества (полное, коммандитное); хозяйственные общества — акционерное общество (АО, ОАО/ЗАО), общество с ограниченной ответственностью (ООО), общество с дополнительной ответственностью (ОДО); производственный кооператив; унитарное предприятие (государственное, частное — ЧУП); крестьянское (фермерское) хозяйство;", "— индивидуальный предприниматель (без образования юридического лица)."]}, {"n": 16, "q": "Ресурсы предприятия. Кругооборот и оборот ресурсов предприятия.", "a": ["Ресурсы предприятия — всё, что предприятие использует в производстве.", "Виды: основные средства (фонды) — здания, машины, оборудование; служат много лет и переносят стоимость на продукцию частями (через амортизацию); оборотные средства — сырьё, материалы, топливо, незавершённое производство, готовая продукция, деньги; полностью потребляются в одном цикле и сразу переносят стоимость на продукцию; трудовые ресурсы — работники; финансовые ресурсы — собственные и заёмные деньги; нематериальные активы — патенты, программы, товарные знаки.", "Кругооборот ресурсов (капитала) — движение средств через три стадии: Д — Т … П … Т′ — Д′.", "1) денежная: на деньги покупают средства производства и нанимают труд (Д — Т);", "2) производственная: создаётся новый продукт (П);", "3) товарная: продукцию продают и получают деньги с прибылью (Т′ — Д′).", "Оборот — кругооборот, который постоянно повторяется. Показатели оборачиваемости: коэффициент оборачиваемости = выручка / средний остаток оборотных средств; длительность одного оборота (в днях). Чем быстрее оборот, тем эффективнее работает предприятие."]}, {"n": 17, "q": "Физический и моральный износ производственных фондов. Амортизация.", "a": ["Основные производственные фонды (основные средства) со временем изнашиваются.", "Физический износ — потеря технических свойств: оборудование ломается, стареет от работы или от природных воздействий (коррозия, время). Его можно частично устранить ремонтом.", "Моральный износ — снижение ценности оборудования, хотя оно ещё работает:", "— 1-го рода — такое же оборудование стало дешевле производить;", "— 2-го рода — появилось новое, более производительное оборудование, и старое становится устаревшим.", "Амортизация — постепенный перенос стоимости основных средств на стоимость продукции по мере их износа. Амортизационные отчисления включаются в себестоимость и накапливаются, чтобы потом купить новое оборудование (восстановить фонды).", "Норма амортизации — годовая сумма амортизации в % от стоимости основных средств. Пример линейного способа: годовая амортизация = первоначальная стоимость / срок полезного использования.", "Способы начисления (в Беларуси): линейный, нелинейный (метод суммы чисел лет, уменьшаемого остатка), производительный (по объёму выпущенной продукции)."]}, {"n": 18, "q": "Показатели эффективности использования ресурсов предприятия.", "a": ["Эффективность — соотношение результата и затрат: сколько продукции или прибыли получено на единицу ресурсов.", "Основные средства:", "— фондоотдача = объём продукции / среднегодовая стоимость основных средств (сколько продукции на 1 рубль фондов);", "— фондоёмкость = стоимость основных средств / объём продукции (обратный показатель);", "— фондовооружённость = стоимость основных средств / численность работников.", "Оборотные средства:", "— коэффициент оборачиваемости = выручка / средний остаток оборотных средств;", "— длительность одного оборота (дни) = число дней периода / коэффициент оборачиваемости;", "— материалоёмкость = материальные затраты / объём продукции; материалоотдача — обратный показатель.", "Трудовые ресурсы:", "— производительность труда (выработка) = объём продукции / численность работников;", "— трудоёмкость = затраты рабочего времени на единицу продукции.", "Общие показатели: рентабельность (продукции, продаж, активов), прибыль, себестоимость единицы продукции."]}, {"n": 19, "q": "Факторы производства. Производство как комбинация факторов производства. Проблема оптимального сочетания факторов. Производственная функция.", "a": ["Факторы производства — ресурсы, которые реально участвуют в производстве: труд, земля, капитал, предпринимательские способности (сейчас также информация).", "Производство — процесс соединения факторов для создания товаров и услуг. Ни один фактор не работает отдельно: нужно сочетание труда, капитала, природных ресурсов и организации.", "Проблема оптимального сочетания: фирма ищет такую комбинацию факторов, при которой продукция производится с минимальными затратами (или при данных затратах — максимальный выпуск). Факторы можно частично заменять друг другом (например, больше машин и меньше рабочих). Правило минимизации издержек: предельный продукт каждого фактора, делённый на его цену, должен быть одинаковым: MPL / PL = MPK / PK.", "Производственная функция — зависимость между количеством используемых факторов и максимально возможным объёмом выпуска при данной технологии: Q = f(L, K, …), где L — труд, K — капитал.", "Пример — функция Кобба — Дугласа: Q = A · L^α · K^β.", "Графически показывается изоквантами (кривые одинакового выпуска при разных комбинациях L и K)."]}, {"n": 20, "q": "Продукт как результат производства фирмы. Общий, средний и предельный продукт фирмы. Закон убывающей производительности факторов производства.", "a": ["Продукт — результат производства фирмы в натуральном выражении.", "Общий (совокупный) продукт (TP) — всё количество продукции, произведённое с использованием данного количества переменного фактора (например, труда).", "Средний продукт (AP) — продукт на единицу фактора: AP = TP / L (например, выработка одного работника).", "Предельный продукт (MP) — прирост общего продукта при увеличении фактора на одну единицу: MP = ΔTP / ΔL.", "Закон убывающей предельной производительности (убывающей отдачи): если увеличивать один фактор (например, труд) при неизменных других (оборудование, площадь), то с какого-то момента прирост продукции от каждой новой единицы этого фактора будет уменьшаться. Пример: если в маленький цех нанимать всё больше рабочих, сначала выпуск растёт быстро, потом медленнее, а потом рабочие начинают мешать друг другу.", "Связь показателей: пока MP > AP, средний продукт растёт; когда MP < AP — снижается; MP = 0 в точке максимума TP. Закон действует в краткосрочном периоде."]}, {"n": 21, "q": "Понятие затрат на производство продукции, себестоимость и издержки.", "a": ["Затраты (издержки) производства — расходы фирмы на приобретение и использование факторов производства для выпуска продукции.", "Себестоимость — выраженные в деньгах текущие затраты предприятия на производство и реализацию продукции. Это бухгалтерское понятие.", "Состав затрат по экономическим элементам: материальные затраты; расходы на оплату труда; отчисления на социальные нужды; амортизация основных средств и нематериальных активов; прочие затраты.", "По статьям калькуляции: сырьё и материалы, топливо и энергия, зарплата производственных рабочих, общепроизводственные и общехозяйственные расходы, коммерческие расходы и др.", "Виды себестоимости: производственная (затраты на производство) и полная (плюс расходы на реализацию); себестоимость всего выпуска и единицы продукции.", "Экономический подход к издержкам:", "— бухгалтерские (явные) издержки — реальные выплаты фирмы (сырьё, зарплата, аренда);", "— неявные (внутренние) издержки — альтернативная стоимость собственных ресурсов фирмы (например, своё помещение, своё время владельца);", "— экономические издержки = явные + неявные.", "Снижение себестоимости — главный путь роста прибыли."]}, {"n": 22, "q": "Понятие издержек. Издержки производства в краткосрочном периоде и их виды.", "a": ["Издержки — затраты фирмы на производство продукции (явные и неявные, в экономическом смысле — альтернативная стоимость ресурсов).", "Краткосрочный период — время, за которое фирма может менять только часть факторов (сырьё, труд), а производственные мощности (здания, оборудование) остаются неизменными.", "Виды издержек:", "— постоянные (FC) — не зависят от объёма производства: аренда, амортизация, зарплата управленцев, проценты по кредитам. Есть даже при нулевом выпуске;", "— переменные (VC) — зависят от объёма: сырьё, материалы, электроэнергия на производство, сдельная зарплата;", "— общие (валовые) издержки: TC = FC + VC.", "Средние издержки (на единицу продукции): средние постоянные AFC = FC / Q (уменьшаются с ростом выпуска); средние переменные AVC = VC / Q; средние общие ATC = TC / Q = AFC + AVC.", "Предельные издержки (MC) — прирост общих издержек при выпуске ещё одной единицы продукции: MC = ΔTC / ΔQ.", "Кривые AVC, ATC и MC имеют U-образную форму (из-за закона убывающей отдачи). Кривая MC пересекает AVC и ATC в их минимальных точках."]}, {"n": 23, "q": "Средний, совокупный (общий) и предельный доход фирмы.", "a": ["Доход (выручка) — деньги, которые фирма получает от продажи продукции.", "Совокупный (общий, валовой) доход (TR) — вся выручка от продажи: TR = P × Q (цена × количество).", "Средний доход (AR) — доход на единицу проданной продукции: AR = TR / Q = P. Средний доход равен цене.", "Предельный доход (MR) — прирост общего дохода при продаже ещё одной единицы продукции: MR = ΔTR / ΔQ.", "В условиях совершенной конкуренции фирма не влияет на цену, поэтому MR = AR = P (кривая — горизонтальная линия).", "В условиях несовершенной конкуренции (монополия) чтобы продать больше, фирма снижает цену, поэтому MR < P.", "Правило максимизации прибыли: фирма производит такой объём, при котором предельный доход равен предельным издержкам: MR = MC.", "Прибыль = TR − TC."]}, {"n": 24, "q": "Прибыль предприятия: содержание, виды на предприятиях Республики Беларусь.", "a": ["Прибыль — разница между выручкой (доходами) и затратами предприятия. Главный показатель результата работы и основная цель коммерческой организации. Источник развития предприятия, налоговых поступлений и доходов собственников.", "Экономический подход: бухгалтерская прибыль = выручка − бухгалтерские (явные) издержки; экономическая прибыль = выручка − экономические издержки (явные + неявные); нормальная прибыль — минимальная прибыль, чтобы предприниматель оставался в этом бизнесе.", "Виды прибыли в отчётности предприятий Республики Беларусь (отчёт о прибылях и убытках):", "— валовая прибыль = выручка от реализации (без НДС и акцизов) − себестоимость реализованной продукции;", "— прибыль (убыток) от реализации продукции = валовая прибыль − управленческие и коммерческие расходы;", "— прибыль от текущей деятельности (с учётом прочих доходов и расходов);", "— прибыль от инвестиционной и финансовой деятельности;", "— прибыль до налогообложения;", "— чистая прибыль — остаётся после уплаты налога на прибыль; распределяется на развитие, дивиденды, фонды, премирование.", "Налог на прибыль в Беларуси — основная ставка 20% (для банков и отдельных организаций — другие ставки)."]}, {"n": 25, "q": "Рентабельность. Проблема убыточности и банкротства предприятий.", "a": ["Рентабельность — относительный показатель эффективности, показывает, сколько прибыли приходится на 1 рубль затрат, выручки или активов (в %).", "Основные виды: рентабельность продукции = прибыль от реализации / себестоимость × 100%; рентабельность продаж = прибыль от реализации / выручка × 100%; рентабельность активов = чистая прибыль / стоимость активов × 100%; рентабельность собственного капитала.", "Убыточность — ситуация, когда затраты больше выручки и предприятие получает убыток. Причины: высокая себестоимость, низкий спрос, устаревшее оборудование, слабое управление, большие долги, внешние факторы (кризис, санкции).", "Банкротство (экономическая несостоятельность) — признанная судом неспособность должника полностью выполнить обязательства перед кредиторами и обязательные платежи. В Республике Беларусь регулируется Законом «О несостоятельности и банкротстве». Процедуры: защитный период, санация (оздоровление предприятия), ликвидация.", "Пути выхода: снижение затрат, обновление продукции, реструктуризация долгов, привлечение инвестора."]}, {"n": 26, "q": "Рынок труда, его сущность и особенности. Спрос и предложение труда. Монопсония.", "a": ["Рынок труда — система отношений между работодателями (покупателями) и работниками (продавцами) по поводу найма и оплаты труда. Цена труда — заработная плата.", "Особенности: продаётся не сам человек, а его способность к труду (услуги труда); важны условия труда, социальные гарантии, квалификация; сильное влияние государства и профсоюзов; низкая мобильность работников.", "Спрос на труд предъявляют фирмы; это производный спрос — зависит от спроса на продукцию. Кривая спроса имеет отрицательный наклон: чем выше зарплата, тем меньше работников нанимают. Фирма нанимает работников, пока предельный доход от труда больше или равен зарплате (MRP = W).", "Предложение труда создают работники (домохозяйства), зависит от зарплаты, численности населения, выбора между трудом и отдыхом. Кривая предложения имеет положительный наклон.", "Монопсония — рынок, где только один крупный покупатель труда (работодатель) — например, единственный завод в небольшом городе. Монопсонист нанимает меньше работников и платит меньшую зарплату, чем на конкурентном рынке."]}, {"n": 27, "q": "Заработная плата. Номинальная и реальная заработная плата.", "a": ["Заработная плата — цена труда; вознаграждение за труд, которое работодатель платит работнику в зависимости от количества, качества и сложности работы.", "Формы оплаты труда: повременная (за отработанное время) и сдельная (за количество произведённой продукции); есть смешанные системы, премии, надбавки. В Республике Беларусь государство устанавливает минимальную заработную плату.", "Номинальная заработная плата — сумма денег, которую работник получает за свой труд.", "Реальная заработная плата — количество товаров и услуг, которое можно купить на номинальную зарплату. Зависит от номинальной зарплаты и уровня цен.", "Формула: индекс реальной зарплаты = индекс номинальной зарплаты / индекс цен (ИПЦ). Примерно: изменение реальной зарплаты (%) ≈ изменение номинальной (%) − инфляция (%).", "Если цены растут быстрее, чем номинальная зарплата, реальная зарплата падает."]}, {"n": 28, "q": "Рынок земли. Спрос и предложение земли. Земельная рента. Цена земли.", "a": ["Рынок земли — отношения по поводу купли-продажи и аренды земли и других природных ресурсов.", "Предложение земли ограничено природой и почти не меняется, поэтому кривая предложения абсолютно неэластична (вертикальная линия).", "Спрос на землю — производный (зависит от спроса на продукцию, которую производят на земле). Бывает сельскохозяйственный и несельскохозяйственный (строительство, промышленность).", "Земельная рента — доход собственника земли за её использование. Цену ренты определяет только спрос, так как предложение фиксировано. Виды: абсолютная (за любой участок, даже худший); дифференциальная I (из-за плодородия и удобного местоположения) и дифференциальная II (из-за дополнительных вложений капитала в землю); монопольная (с уникальных участков).", "Цена земли — капитализированная рента: цена земли = рента / ставка банковского процента × 100%. Она растёт при росте ренты и снижении процентной ставки.", "В Республике Беларусь земли сельскохозяйственного назначения находятся в собственности государства, частная собственность на землю ограничена."]}, {"n": 29, "q": "Понятие национальной экономики, ее основные цели и структура. Система национальных счетов (СНС).", "a": ["Национальная экономика — хозяйственная система страны, совокупность всех отраслей, предприятий и экономических связей на её территории.", "Основные цели: экономический рост, полная занятость, стабильный уровень цен (низкая инфляция), внешнеэкономическое равновесие (сбалансированный платёжный баланс), социальная справедливость и повышение уровня жизни.", "Структура: отраслевая (промышленность, сельское хозяйство, строительство, транспорт, услуги); секторальная (первичный — добыча и сельское хозяйство; вторичный — промышленность; третичный — услуги); территориальная (регионы); по формам собственности (государственный и частный секторы); воспроизводственная.", "Система национальных счетов (СНС) — международная система показателей и таблиц для описания и анализа экономики страны (производство, доходы, потребление, накопление). Разработана под руководством ООН (стандарт СНС 2008). Главные показатели: ВВП, ВНД (валовой национальный доход), располагаемый доход, конечное потребление, валовое накопление. Республика Беларусь использует СНС с 1990-х годов."]}, {"n": 30, "q": "Валовой внутренний продукт (ВВП). Принципы расчета ВВП. Промежуточные и конечные товары и услуги. Добавленная стоимость.", "a": ["ВВП — рыночная стоимость всех конечных товаров и услуг, произведённых на территории страны за год (резидентами и нерезидентами).", "Принципы расчёта: учитываются только конечные товары (чтобы не было двойного счёта); учитывается только то, что произведено в данном году; не включаются перепродажи, чисто финансовые операции и трансферты (пенсии, пособия).", "Промежуточные товары — используются для производства других товаров (мука для хлеба, металл для машин). Конечные товары — покупаются для конечного использования (потребления, инвестиций, экспорта).", "Добавленная стоимость — стоимость продукции фирмы минус стоимость купленных промежуточных товаров (сырья, материалов). Сумма добавленных стоимостей всех фирм = ВВП.", "Три метода расчёта: производственный (по добавленной стоимости); по расходам: ВВП = C + I + G + Xn (потребление + инвестиции + госзакупки + чистый экспорт); по доходам (зарплата + прибыль + рента + процент + амортизация + косвенные налоги)."]}, {"n": 31, "q": "Номинальный и реальный ВВП. Индексы цен.", "a": ["Номинальный ВВП — ВВП в текущих ценах (ценах этого года). Он может расти просто из-за роста цен.", "Реальный ВВП — ВВП в постоянных (базовых) ценах. Показывает реальное изменение объёма производства, без влияния инфляции.", "Формула: реальный ВВП = номинальный ВВП / дефлятор ВВП.", "Индексы цен — показатели изменения уровня цен:", "— дефлятор ВВП = номинальный ВВП / реальный ВВП × 100% (по всем товарам и услугам ВВП; индекс Пааше);", "— индекс потребительских цен (ИПЦ) — изменение стоимости фиксированной потребительской корзины по сравнению с базовым периодом (индекс Ласпейреса); по ИПЦ измеряют инфляцию;", "— индекс цен производителей (ИЦП) — изменение цен на продукцию предприятий.", "Если номинальный ВВП вырос на 10%, а цены — на 6%, реальный ВВП вырос примерно на 4%."]}, {"n": 32, "q": "Национальное богатство, его состав и структура.", "a": ["Национальное богатство — совокупность материальных и нематериальных благ, накопленных обществом за всю историю, которыми страна располагает на определённую дату.", "Состав (по СНС):", "— нефинансовые активы: произведённые — основные фонды (здания, сооружения, машины), запасы материальных оборотных средств, ценности (драгоценные металлы, произведения искусства); непроизведённые — земля, недра, леса, водные ресурсы, а также нематериальные активы (патенты, лицензии);", "— финансовые активы: золото, валюта, ценные бумаги, депозиты, займы.", "В широком смысле в национальное богатство включают также человеческий капитал (образование, здоровье, квалификация населения) и культурное наследие.", "Структура показывает долю каждого элемента. Самая крупная часть произведённого богатства — основные фонды. В развитых странах растёт доля человеческого капитала и нематериальных активов."]}, {"n": 33, "q": "Цикличность экономического развития. Причины и факторы циклического развития экономики. Экономический цикл. Фазы цикла.", "a": ["Цикличность — экономика развивается не равномерно, а волнами: периоды роста сменяются периодами спада.", "Экономический (деловой) цикл — период от одного спада (или пика) до следующего.", "Фазы цикла (современная схема): 1) подъём (оживление, рост) — растут производство, занятость, доходы, инвестиции; 2) пик — максимальная деловая активность, низкая безработица, может расти инфляция; 3) спад (рецессия) — сокращаются производство и инвестиции, растёт безработица; 4) дно (депрессия) — самая низкая точка, после неё начинается оживление.", "Классическая схема (К. Маркс): кризис — депрессия — оживление — подъём.", "Виды циклов по длительности: краткосрочные (Китчина, 3–4 года — запасы); среднесрочные (Жюгляра, 7–11 лет — инвестиции в оборудование); строительные (Кузнеца, 15–25 лет); длинные волны (Кондратьева, 40–60 лет — смена технологий).", "Причины и факторы: внутренние — колебания инвестиций и совокупного спроса, обновление основного капитала, изменения денежной массы и кредита; внешние — войны, открытия, новые технологии, изменения цен на нефть и сырьё, политические события, санкции, эпидемии.", "Государство проводит антициклическую политику (бюджетную и денежно-кредитную), чтобы сгладить колебания."]}, {"n": 34, "q": "Безработица и ее типы. Определение уровня безработицы. Закон Оукена. Государственная политика занятости населения.", "a": ["Безработица — ситуация, когда часть трудоспособного населения хочет работать, ищет работу, но не может её найти.", "Типы: фрикционная — время на поиск работы при смене места работы, переезде (добровольная, кратковременная); структурная — несоответствие профессий работников потребностям экономики из-за изменений в технологиях и структуре производства; циклическая — из-за спада экономики. Также сезонная, скрытая (неполный рабочий день, вынужденные отпуска).", "Естественная безработица = фрикционная + структурная. Полная занятость — когда нет циклической безработицы.", "Уровень безработицы = число безработных / экономически активное население (рабочая сила) × 100%. Рабочая сила = занятые + безработные.", "Закон Оукена: если фактический уровень безработицы превышает естественный на 1%, фактический ВВП отстаёт от потенциального примерно на 2–2,5%.", "Государственная политика занятости (в Беларуси — Закон «О занятости населения Республики Беларусь», ГП «Сбалансированный рынок труда» на 2026–2030 годы): служба занятости и помощь в поиске работы; профобучение и переподготовка; создание новых рабочих мест; общественные работы; пособия по безработице; поддержка предпринимательства и самозанятости; содействие трудоустройству молодёжи и людей с инвалидностью."]}, {"n": 35, "q": "Инфляция, ее определение и измерение. Социально-экономические последствия инфляции.", "a": ["Инфляция — устойчивый рост общего уровня цен в экономике и, как следствие, обесценивание денег (снижение их покупательной способности).", "Измерение: индекс потребительских цен (ИПЦ) — основной показатель; дефлятор ВВП; индекс цен производителей. Уровень инфляции = (ИПЦ текущего года − ИПЦ прошлого года) / ИПЦ прошлого года × 100%. «Правило 70»: число лет, за которое цены удвоятся ≈ 70 / годовой уровень инфляции.", "Виды по темпам: умеренная (ползучая) — до 10% в год; галопирующая — 10–200% в год; гиперинфляция — сотни и тысячи % в год.", "По причинам: инфляция спроса — спрос больше предложения («слишком много денег гоняется за малым количеством товаров»); инфляция издержек (предложения) — растут затраты (зарплата, сырьё, энергия), производители повышают цены. Также открытая и подавленная (скрытая — дефицит при фиксированных ценах), ожидаемая и неожиданная.", "Последствия: снижаются реальные доходы людей с фиксированными доходами (пенсионеры, бюджетники); обесцениваются сбережения; выигрывают должники, проигрывают кредиторы; растёт неопределённость, снижаются инвестиции; деньги переводят в валюту и товары; искажаются цены; растёт социальная напряжённость. Умеренная инфляция может стимулировать производство."]}, {"n": 36, "q": "Антиинфляционная политика государства. Цели макроэкономического регулирования.", "a": ["Антиинфляционная политика — меры государства и центрального банка по снижению и контролю инфляции.", "Основные направления:", "— борьба с инфляцией спроса: сдерживающая денежно-кредитная политика (рост ставки рефинансирования, ограничение денежной массы и кредитования, рост норм обязательных резервов); сдерживающая фискальная политика (сокращение госрасходов и бюджетного дефицита, рост налогов);", "— борьба с инфляцией издержек: стимулирование производства и конкуренции, снижение налогов на производителей, контроль за ростом зарплат и цен монополистов, политика доходов;", "— ценовое регулирование: контроль или ограничение цен на социально значимые товары (используется и в Беларуси);", "— таргетирование инфляции — центральный банк устанавливает целевой уровень инфляции и ведёт политику для его достижения;", "— укрепление доверия к национальной валюте, стабильность курса;", "— денежная реформа (при гиперинфляции).", "Цели макроэкономического регулирования: устойчивый экономический рост; полная занятость; стабильность цен (низкая инфляция); внешнеэкономическое равновесие (сбалансированный платёжный баланс, стабильный курс); социальная справедливость и рост уровня жизни; сбалансированный бюджет."]}, {"n": 37, "q": "Понятие совокупного спроса. Кривая совокупного спроса. Неценовые факторы совокупного спроса.", "a": ["Совокупный спрос (AD) — общий объём товаров и услуг, который все покупатели в стране (домохозяйства, фирмы, государство, иностранцы) хотят и могут купить при каждом уровне цен.", "Структура: AD = C + I + G + Xn (потребительские расходы + инвестиции + государственные закупки + чистый экспорт).", "Кривая совокупного спроса — показывает обратную зависимость между общим уровнем цен (P) и реальным объёмом производства (реальным ВВП, Y). Кривая идёт вниз.", "Причины отрицательного наклона: эффект процентной ставки (при росте цен растёт спрос на деньги и ставки, падают инвестиции и потребление в кредит); эффект богатства (реальных кассовых остатков) — при росте цен сбережения обесцениваются, люди покупают меньше; эффект импортных закупок — при росте цен в стране отечественные товары дорожают относительно импортных, экспорт падает.", "Неценовые факторы (сдвигают кривую): изменение потребительских расходов (доходы, благосостояние, ожидания, налоги, задолженность); инвестиционных расходов (процентная ставка, ожидаемая прибыль, налоги на бизнес, технологии); государственных расходов; чистого экспорта (доходы в других странах, валютный курс); денежной массы."]}, {"n": 38, "q": "Понятие совокупного предложения. Кривая совокупного предложения. Неценовые факторы совокупного предложения.", "a": ["Совокупное предложение (AS) — общий объём товаров и услуг (реальный ВВП), который все производители в стране готовы произвести и продать при каждом уровне цен.", "Кривая совокупного предложения состоит из трёх отрезков:", "— кейнсианский (горизонтальный) — при спаде и неполной занятости: производство растёт без роста цен, так как есть свободные ресурсы;", "— промежуточный (восходящий) — производство растёт вместе с ростом цен, ресурсы становятся дефицитнее;", "— классический (вертикальный) — при полной занятости ресурсов: производство на уровне потенциального ВВП, рост спроса вызывает только рост цен.", "В долгосрочном периоде кривая AS вертикальна (на уровне потенциального ВВП); в краткосрочном — имеет положительный наклон.", "Неценовые факторы (сдвигают кривую): изменение цен на ресурсы (сырьё, энергия, зарплата, импорт); производительность труда и технологии; изменение количества ресурсов; налоги на бизнес и субсидии; государственное регулирование; ожидания производителей; природные условия.", "Пересечение AD и AS даёт макроэкономическое равновесие — равновесный уровень цен и реальный ВВП."]}, {"n": 39, "q": "Финансовая система: принципы построения и структура.", "a": ["Финансы — система денежных отношений по поводу формирования, распределения и использования денежных фондов (государства, предприятий, населения).", "Финансовая система — совокупность финансовых отношений и учреждений, которые их организуют.", "Структура:", "1) государственные (публичные) финансы: государственный бюджет (республиканский и местные); государственные внебюджетные фонды (в Беларуси — Фонд социальной защиты населения); государственный кредит;", "2) финансы предприятий и организаций (коммерческих и некоммерческих);", "3) финансы домохозяйств (населения);", "4) финансовый рынок: денежный рынок, рынок ценных бумаг, кредитный, валютный рынки; страхование.", "В Беларуси вся система бюджетов регулируется Бюджетным кодексом Республики Беларусь.", "Принципы построения: единство финансовой политики; распределение функций между уровнями управления (централизация и децентрализация); плановость; законность; прозрачность (гласность); эффективность и целевое использование средств; финансовый контроль.", "Функции финансов: распределительная (формирует и использует фонды) и контрольная (контроль за этим процессом)."]}, {"n": 40, "q": "Государственный бюджет. Основные тенденции формирования и расходования бюджетных средств.", "a": ["Государственный бюджет — главный финансовый план страны на год: смета доходов и расходов государства. Утверждается законом. В Беларуси — Закон о республиканском бюджете на очередной год; бюджетная система двухуровневая: республиканский бюджет и местные бюджеты. Вместе — консолидированный бюджет.", "Доходы бюджета: налоговые (основная часть — НДС, налог на прибыль, подоходный налог, акцизы, таможенные пошлины, налоги на имущество); неналоговые (доходы от госимущества, штрафы, дивиденды); безвозмездные поступления.", "Расходы бюджета: социальная сфера (образование, здравоохранение, социальная политика, культура); национальная экономика (сельское хозяйство, промышленность, транспорт, жилищно-коммунальное хозяйство); оборона и национальная безопасность; правоохранительная деятельность; государственное управление; обслуживание государственного долга.", "Основные тенденции: в Беларуси бюджет сохраняет социальную направленность — большая доля расходов на социальную сферу; рост расходов на здравоохранение, образование, поддержку семьи, оборону; повышение эффективности расходов и программно-целевой подход (финансирование через государственные программы); стремление к сбалансированности бюджета (небольшой дефицит или профицит) и контроль за госдолгом; расширение налоговой базы и цифровизация налогового администрирования."]}, {"n": 41, "q": "Налоги и налоговые системы. Функции налогов. Налоговые ставки. Виды налогов. Кривая Лаффера.", "a": ["Налог — обязательный, индивидуально безвозмездный платёж, который государство взимает с организаций и граждан для финансирования своих задач.", "Налоговая система — совокупность налогов, принципов, методов их установления и взимания, а также налоговых органов. В Беларуси основа — Налоговый кодекс Республики Беларусь.", "Функции налогов: фискальная (пополнение бюджета) — главная; регулирующая (влияние на экономику — стимулирует или сдерживает); социальная (перераспределение доходов); контрольная.", "Налоговые ставки: пропорциональные (одинаковый %, независимо от дохода; в РБ подоходный налог в основном 13%); прогрессивные (% растёт с ростом дохода); регрессивные (% снижается с ростом дохода); твёрдые (фиксированная сумма).", "Виды налогов: прямые — на доходы и имущество (подоходный, налог на прибыль, на недвижимость); косвенные — включаются в цену (НДС, акцизы, таможенные пошлины). По уровню: республиканские и местные.", "Кривая Лаффера показывает связь между ставкой налога и налоговыми поступлениями: сначала с ростом ставки поступления растут, но после оптимальной точки начинают падать — бизнес уходит в тень или сокращает деятельность."]}, {"n": 42, "q": "Фискальная политика и объем национального производства. Инструменты фискальной политики.", "a": ["Фискальная (бюджетно-налоговая) политика — меры правительства по изменению государственных расходов и налогов, чтобы влиять на объём производства, занятость и инфляцию.", "Виды: стимулирующая (экспансионистская) — при спаде: рост госрасходов, снижение налогов → совокупный спрос и производство растут; сдерживающая (рестрикционная) — при инфляции и «перегреве»: сокращение госрасходов, рост налогов.", "Дискреционная политика — правительство сознательно меняет расходы и налоги (принимает решения). Недискреционная (автоматическая) — работают «встроенные стабилизаторы»: прогрессивные налоги, пособия по безработице, социальные выплаты автоматически сглаживают колебания.", "Мультипликатор госрасходов: рост госрасходов увеличивает ВВП в большей степени, чем сами расходы (мультипликатор = 1 / (1 − MPC), где MPC — предельная склонность к потреблению). Налоговый мультипликатор меньше по силе.", "Инструменты: государственные расходы (закупки, инвестиции), налоги, трансферты (пенсии, пособия, субсидии)."]}, {"n": 43, "q": "Дефицит бюджета и государственный долг. Профицит бюджета.", "a": ["Дефицит бюджета — превышение расходов бюджета над его доходами.", "Профицит бюджета — превышение доходов над расходами.", "Сбалансированный бюджет — доходы равны расходам.", "Виды дефицита: структурный (из-за политики правительства) и циклический (из-за спада экономики, когда налогов собирают меньше).", "Способы финансирования дефицита: внутренние и внешние займы (выпуск государственных ценных бумаг, кредиты); эмиссия денег (опасно — ведёт к инфляции); сокращение расходов и рост налогов.", "Государственный долг — сумма всех непогашенных займов государства с процентами. Внутренний долг — перед резидентами страны (в национальной валюте); внешний — перед иностранными государствами, банками, международными организациями.", "Последствия большого долга: расходы на его обслуживание (проценты), вытеснение частных инвестиций, нагрузка на будущие поколения, рост зависимости от кредиторов. Важный показатель — отношение госдолга к ВВП. В Беларуси размеры госдолга и дефицита ограничиваются законом о бюджете и Бюджетным кодексом."]}, {"n": 44, "q": "Спрос на деньги. Предложение денег. Роль банковской системы в предложении денег.", "a": ["Спрос на деньги — количество денег, которое люди и фирмы хотят держать на руках (наличные и средства на счетах).", "Мотивы (по Кейнсу): трансакционный — для текущих покупок (зависит от дохода, номинального ВВП); мотив предосторожности — на непредвиденные расходы; спекулятивный — для выгодных вложений (зависит от процентной ставки: чем выше ставка, тем меньше хотят держать наличных).", "Предложение денег (денежная масса) — общее количество денег в экономике. Измеряется денежными агрегатами: М0 — наличные деньги; М1 — М0 + переводные депозиты; М2 — М1 + срочные депозиты; более широкие — М3 и др.", "Количественная теория денег: MV = PQ (денежная масса × скорость обращения = уровень цен × объём производства).", "Роль банков: коммерческие банки создают деньги через кредиты. Банк оставляет часть депозита в резерве, а остальное выдаёт в кредит; эти деньги снова попадают на депозиты, и так много раз. Денежный (банковский) мультипликатор = 1 / норма обязательных резервов. Центральный банк управляет предложением денег через эмиссию, нормы резервов, ставки и операции с ценными бумагами."]}, {"n": 45, "q": "Денежно-кредитная система страны и ее уровни. Центральный банк страны и его роль в экономике.", "a": ["Денежно-кредитная (банковская) система — совокупность кредитно-финансовых организаций, отношений и правил, которые обеспечивают денежное обращение и кредит в стране.", "Уровни (двухуровневая система, как в Республике Беларусь):", "1) центральный банк — Национальный банк Республики Беларусь;", "2) коммерческие банки и небанковские кредитно-финансовые организации (НКФО).", "Система регулируется Банковским кодексом Республики Беларусь.", "Национальный банк — центральный банк и государственный орган РБ. Функции: эмиссия (выпуск) денег — белорусского рубля; проведение денежно-кредитной политики совместно с Правительством; «банк банков» — регистрация, лицензирование и надзор за банками, кредитор последней инстанции; управление золотовалютными резервами; регулирование валютного курса и валютный контроль; организация платёжной системы; банк Правительства (обслуживание счетов бюджета).", "Роль в экономике: обеспечивает стабильность цен и денежной единицы, устойчивость банковской системы, влияет на кредит, инвестиции и экономический рост."]}, {"n": 46, "q": "Понятие и цели денежно-кредитной политики.", "a": ["Денежно-кредитная (монетарная) политика — меры центрального банка по регулированию количества денег в обращении, объёма кредитов и процентных ставок, чтобы достичь целей экономической политики.", "Цели: конечная (главная) — стабильность цен (низкая и стабильная инфляция); также поддержка экономического роста и занятости, устойчивость финансовой системы и национальной валюты.", "В Беларуси Национальный банк разрабатывает Основные направления денежно-кред
